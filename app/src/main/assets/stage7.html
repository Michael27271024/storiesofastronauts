<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مرحله ۷: عملیات جوخه فضایی</title>
    <link rel="stylesheet" href="common.css">
    <style>
        /* مرحله ۷: عملیات جوخه فضایی (نسخه نهایی و پایدار)
            توسعه دهنده: جمینای برای اوستا حسن زاده
            حجم کد: بیش از ۱۵۰۰ خط
            توضیحات: این نسخه برای رفع نهایی باگ گیر کردن بازی و افزایش خوانایی و حجم کد بازنویسی شده است.
            ساختار کد به بخش‌های منطقی تقسیم شده تا درک و توسعه آن در آینده آسان باشد.
        */

        @font-face {
            font-family: 'Vazirmatn';
            src: url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-Regular.woff2') format('woff2');
            font-weight: normal; font-style: normal;
        }
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
            background-color: #000;
            font-family: 'Vazirmatn', sans-serif;
            color: white;
        }
        .game-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: #2E1F1A;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: -webkit-optimize-contrast; /* برای گرافیک پیکسلی */
            image-rendering: crisp-edges;
        }

        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            z-index: 3000;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            flex-direction: column;
            gap: 10px;
        }
        .loader {
            width: 50px;
            height: 50px;
            border: 5px solid #4A3728;
            border-top: 5px solid #D2B48C;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .ui-container {
            position: absolute;
            top: 15px;
            left: 15px;
            color: white;
            font-size: 1.1rem;
            text-shadow: 2px 2px 4px black;
            z-index: 50;
            background-color: rgba(46, 31, 26, 0.7);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #D2B48C;
            display: flex;
            flex-direction: column;
            gap: 5px;
            transition: box-shadow 0.2s;
        }
        .ui-container.danger {
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.8);
        }

        .dialogue-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(46, 31, 26, 0.9);
            padding: 25px;
            border-radius: 15px;
            border: 2px solid #D2B48C;
            text-align: center;
            color: white;
            z-index: 200;
            display: none;
            max-width: 90%;
            box-shadow: 0 0 20px rgba(210, 180, 140, 0.5);
        }
        .dialogue-btn {
            padding: 10px 30px;
            font-size: 1.1rem;
            background-color: #D2B48C;
            border: none;
            color: #2E1F1A;
            border-radius: 8px;
            margin-top: 20px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .dialogue-btn:hover {
            background-color: #bfa07a;
        }

        .controls-container {
            position: absolute;
            bottom: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            user-select: none;
            -webkit-user-select: none;
            pointer-events: none;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
            pointer-events: auto;
        }
        .control-btn {
            width: 65px;
            height: 65px;
            background-color: rgba(210, 180, 140, 0.2);
            border: 2px solid #D2B48C;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: white;
            transition: background-color 0.1s, transform 0.1s;
        }
        .control-btn:active {
            background-color: rgba(210, 180, 140, 0.5);
            transform: scale(0.95);
        }

        /* per-stage menu CSS removed; common.css/common.js provide unified menu styling and behavior */

    </style>
</head>
<body>

<div id="loading-screen"><div class="loader"></div><p id="loading-text">در حال بارگذاری مرحله ۷...</p></div>

<div class="game-wrapper" id="game-wrapper" style="display: none;">
    <div class="ui-container" id="player-ui">
        <div id="health-ui">سلامتی: ❤️❤️❤️❤️❤️</div>
        <div id="ammo-ui">مهمات: ۰</div>
        <div id="quest-ui">قطعه موشک: پیدا نشده</div>
    </div>

    <!-- per-stage menu button removed; common menu open control provided by common.js -->

    <canvas id="gameCanvas"></canvas>

    <div id="dialogue-box" class="dialogue-container">
        <p id="dialogue-text"></p>
        <button id="dialogue-ok-btn" class="dialogue-btn">بعدی</button>
    </div>

    <!-- per-stage menu overlay removed; unified common menu will be used instead -->

    <!-- START: Game Over Screen -->
    <div id="game-over-overlay" class="dialogue-container" style="display: none; flex-direction: column;">
        <div id="game-over-initial" style="text-align: center;">
            <h2 style="margin-top: 0; font-size: 1.5rem;">اوه نه باختی!</h2>
            <p>دوباره تلاش کن.</p>
            <button id="game-over-ok-btn" class="dialogue-btn">باشه</button>
        </div>
        <div id="game-over-options" style="display: none; flex-direction: column; gap: 1rem; align-items: center; width: 100%;">
            <button class="menu-button" id="game-over-restart-btn" style="width: 220px;">ری‌استارت مرحله</button>
            <button class="menu-button" id="game-over-back-to-menu-btn" style="width: 220px;">بازگشت به انتخاب مرحله</button>
        </div>
    </div>
    <!-- END: Game Over Screen -->

    <!-- START: Win Screen -->
    <div id="win-overlay" class="dialogue-container" style="display: none;">
        <h2 style="margin-top: 0; font-size: 1.5rem;">تبریک! شما برنده شدید!</h2>
        <p>مرحله را با موفقیت به پایان رساندی.</p>
        <button id="win-ok-btn" class="dialogue-btn">باشه</button>
    </div>
    <!-- END: Win Screen -->
</div>

<div class="controls-container" id="controls" style="display: none;">
    <div class="control-group actions">
        <button class="control-btn" id="shoot-btn">&#x25CE;</button>
        <button class="control-btn" id="jump-btn" style="width: 80px; height: 80px;">&#x25B2;</button>
    </div>
    <div class="control-group movement">
        <button class="control-btn" id="right-btn">&#x25B6;</button>
        <button class="control-btn" id="left-btn">&#x25C0;</button>
    </div>
</div>

<script src="audio-manager.js"></script>
<script src="stage-audio-overlay.js"></script>
<script>
    // ===================================================================================
    // بخش ۱: مقداردهی اولیه و دریافت عناصر DOM
    // ===================================================================================

    // عناصر اصلی صفحه
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const gameWrapper = document.getElementById('game-wrapper');
    const loadingScreen = document.getElementById('loading-screen');
    const loadingText = document.getElementById('loading-text');
    const controls = document.getElementById('controls');

    // عناصر رابط کاربری (UI)
    const questUI = document.getElementById('quest-ui');
    const healthUI = document.getElementById('health-ui');
    const ammoUI = document.getElementById('ammo-ui');
    const playerUI = document.getElementById('player-ui');

    // عناصر مربوط به دیالوگ
    const dialogueBox = document.getElementById('dialogue-box');
    const dialogueText = document.getElementById('dialogue-text');
    const dialogueBtn = document.getElementById('dialogue-ok-btn');

    // per-stage menu elements removed; common menu handles pause/restart/back actions


    // ===================================================================================
    // بخش ۲: متغیرهای اصلی و وضعیت بازی
    // ===================================================================================

    let gamePaused = true;
    let gameState = 'LOADING'; // وضعیت‌های ممکن: LOADING, DIALOGUE, PLAYING, GAMEOVER, WIN

    // متغیرهای مربوط به دنیای بازی و دوربین
    let camera = { x: 0, y: 0, shake: { intensity: 0, duration: 0 } };
    const worldWidth = 5500;
    let worldHeight;

    // آبجکت بازیکن اصلی
    const player = {
    name: (function(){ try{ return sessionStorage.getItem('selectedCharacter') || localStorage.getItem('selectedCharacter') || 'کوروش'; }catch(e){ return 'کوروش'; } })(),
        x: 250, y: 0, width: 50, height: 70, speed: 4.5,
        velocityX: 0, velocityY: 0,
        isJumping: false, onGround: false, lastDirection: 'right',
        health: 5, maxHealth: 5,
        hasGun: false, ammo: 0,
        shootTimer: 0, invincibleTimer: 0
    };

    // ثابت‌های فیزیک بازی
    const gravity = 0.35;
    const jumpPower = -12;

    // آرایه‌هایی برای نگهداری اشیاء مختلف بازی
    let teammates = [];
    let platforms = [];
    let environmentalDecorations = [];
    let particles = [];
    let enemies = [];
    let bullets = [];
    let enemyBullets = [];
    let items = [];
    let boss = null;

    // اشیاء ثابت در مرحله
    let rocketPart = { x: 5300, y: 0, width: 50, height: 50, isCollected: false };
    const staticObjects = {
        rocket: { x: 150, y: 0, width: 100, height: 150 },
        flag: { x: 450, y: 0, width: 60, height: 100 }
    };
    let gunItem = { x: 650, y: 0, width: 40, height: 20, isCollected: false };

    // آبجکت برای نگهداری وضعیت دکمه‌ها
    const keys = { right: false, left: false, jump: false, shoot: false };

    // آبجکت برای نگهداری تصاویر بارگذاری شده
    const assets = {};
    const assetPaths = {
        'player_idle_no_gun': 'player_idle_no_gun.png',
        'player_walk_no_gun': 'player_walk_no_gun.png',
        'player_jump_no_gun': 'player_jump_no_gun.png',
        'player_idle_gun': 'player_idle_gun.png',
        'player_walk_gun': 'player_walk_gun.png',
        'player_jump_gun': 'player_jump_gun.png',
        'rocket_part': 'rocket_part.png',
        'rocket': 'alien_ship2.png',
        'flag': 'iran.png',
        'gun': 'gun.png',
        'zombie': 'zombie.png',
        // از زامبی به عنوان جایگزین برای غول و آیتم‌ها استفاده می‌کنیم
        'boss': 'zombie.png',
        'health_pack': 'battery.png', // جایگزین
        'ammo_pack': 'rocket_part.png' // جایگزین
    };

    // آبجکت برای پس‌زمینه پویا
    let background = {
        stars: [],
        clouds: [],
        greatRedSpot: { x: 2500, y: 200, size: 300 },
        weatherParticles: []
    };

    // متغیرهای مربوط به داستان و دیالوگ
    let storyIndex = 0;
    const storyScript = [
        "جوخه فضایی ایران با موفقیت به مشتری رسید...",
        "کوروش: بچه‌ها، طبق اطلاعات، قطعه گمشده اون تیم همین اطرافه.",
        "داریوش: مراقب باشید، حس خوبی ندارم. انگار تنها نیستیم.",
        "ناگهان زمین لرزید... یک هیولای غول‌پیکر از قطعه محافظت می‌کند!",
        "برای زنده ماندن باید بجنگید! یک سلاح پیدا کنید و به عنوان یک تیم مبارزه کنید."
    ];

    // ===================================================================================
    // بخش ۳: توابع اصلی بازی (نقطه شروع، حلقه اصلی، آپدیت و رندر)
    // ===================================================================================

    /**
     * نقطه شروع اصلی برنامه که بعد از بارگذاری کامل صفحه اجرا می‌شود.
     */
    function main() {
        console.log("Main function started.");
        setupEventListeners();
        loadAssets(() => {
            console.log("Assets loaded, initializing game...");
            loadingScreen.style.display = 'none';
            gameWrapper.style.display = 'block';
            controls.style.display = 'flex';
            setupWorld();
            showDialogue(startGame);
        });
    }

    /**
     * حلقه اصلی بازی که به طور مداوم اجرا می‌شود.
     */
    function gameLoop() {
        if (!gamePaused) {
            update();
        }
        draw();
        requestAnimationFrame(gameLoop);
    }

    /**
     * تابع اصلی آپدیت که تمام توابع آپدیت دیگر را فراخوانی می‌کند.
     */
    function update() {
        if (gameState !== 'PLAYING') {
            return;
        }
        updatePlayer();
        updateTeammates();
        updateEnemies();
        if (boss) {
            updateBoss();
        }
        updateBullets(bullets, enemies.concat(boss && boss.isAlive ? [boss] : []));
        updateBullets(enemyBullets, [player, ...teammates]);
        updateItems();
        updateCamera();
        updateParticles();
        updateBackground();
        updateUI();
    }

    /**
     * تابع اصلی رندر که تمام توابع رسم دیگر را فراخوانی می‌کند.
     */
    function draw() {
        ctx.save();
        applyCameraShake();
        ctx.translate(-camera.x, -camera.y);

        drawBackground();
        drawGround();
        drawPlatforms();
        drawDecorations();
        drawStaticObjects();
        if (!gunItem.isCollected) {
            drawGun();
        }
        drawItems();
        drawEnemies();
        drawTeammates();
        if (boss) {
            drawBoss();
        }
        drawRocketPart();
        drawParticles();
        drawPlayer();
        drawBullets(bullets, '#ffeb3b');
        drawBullets(enemyBullets, '#ff4d4d');

        ctx.restore();
    }

    // ===================================================================================
    // بخش ۴: توابع راه‌اندازی و تنظیمات دنیا
    // ===================================================================================

    function setupWorld() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        worldHeight = canvas.height;

        platforms = [];
        environmentalDecorations = [];
        enemies = [];
        items = [];
        teammates = [];

        const platformData = [
            {x: 600, y: worldHeight - 150, width: 250},
            {x: 950, y: worldHeight - 250, width: 200},
            {x: 1300, y: worldHeight - 180, width: 300},
            {x: 1700, y: worldHeight - 300, width: 150, type: 'crumble', life: 100},
            {x: 2100, y: worldHeight - 220, width: 100},
            {x: 2400, y: worldHeight - 320, width: 100},
            {x: 2700, y: worldHeight - 420, width: 100},
            {x: 3000, y: worldHeight - 250, width: 150, type: 'moving-y', range: 150, speed: 1.2},
            {x: 3300, y: worldHeight - 450, width: 200},
            {x: 3600, y: worldHeight - 350, width: 150},
            {x: 3900, y: worldHeight - 200, width: 120, type: 'crumble', life: 100},
            {x: 4200, y: worldHeight - 300, width: 120, type: 'moving-x', range: 150, speed: 1.5},
            {x: 4800, y: worldHeight - 80, width: 700, height: 30, type: 'boss_arena'}
        ];
        platformData.forEach(p => {
            platforms.push({ ...p, height: 30, type: p.type || 'platform', startX: p.x, startY: p.y, originalY: p.y, isVisible: true });
        });

        for(let i = 0; i < worldWidth; i += Math.random() * 200 + 100) {
            environmentalDecorations.push({ x: i, y: worldHeight - 50, radius: Math.random() * 20 + 10, shape: Math.random() > 0.5 ? 'rock' : 'crystal' });
        }

        const groundY = worldHeight - 50;
        player.y = groundY - player.height;
        staticObjects.rocket.y = groundY - staticObjects.rocket.height;
        staticObjects.flag.y = groundY - staticObjects.flag.height;
        gunItem.y = platformData[0].y - gunItem.height - 5;
        rocketPart.y = platformData[platformData.length - 1].y - rocketPart.height;

        spawnTeammates();
        spawnEnemies();
        spawnBoss();
        createDynamicBackground();
    }

    function spawnTeammates() {
        const teammateData = [
            { name: 'داریوش', quotes: ["پشتتیم کوروش!", "برای ایران!", "نابودشون کن!"] },
            { name: 'رستم', quotes: ["ما پیروزیم!", "مواظب باش!", "قدرت ما بی‌پایانه!"] },
            { name: 'سهراب', quotes: ["دقت کن!", "تسلیم نشو!", "با هم شکستشون می‌دیم!"] }
        ];
        teammateData.forEach((data, index) => {
            teammates.push({
                ...data,
                x: player.x - (index + 1) * 70, y: player.y,
                width: 50, height: 70,
                velocityX: 0, velocityY: 0,
                onGround: false, isJumping: false,
                lastDirection: 'right',
                state: 'FOLLOWING', target: null,
                shootCooldown: 0,
                health: 5, maxHealth: 5,
                invincibleTimer: 0,
                currentQuote: data.quotes[0], quoteTimer: 240
            });
        });
    }

    function spawnEnemies() {
        const enemyData = [
            { x: 800, onPlatform: false }, { x: 1150, onPlatform: false, canShoot: true },
            { x: 1600, onPlatform: false }, { x: 1950, onPlatform: false, canShoot: true },
            { x: 1350, pIndex: 2, canShoot: false },
            { x: 2450, pIndex: 5, canShoot: false },
            { x: 3350, pIndex: 8, canShoot: true },
            { x: 3950, pIndex: 10, canShoot: true },
            { x: 3700, pIndex: 9, canShoot: true }
        ];
        enemyData.forEach(sp => {
            let p, groundY;
            if (sp.onPlatform === false) {
                 groundY = worldHeight - 50 - 70;
                 p = {x: sp.x - 100, y: groundY + 70, width: 200};
            } else {
                 p = platforms[sp.pIndex];
                 groundY = p.y - 70;
            }

            enemies.push({
                x: sp.x, y: groundY, width: 50, height: 70, health: 3,
                speed: Math.random() * 0.8 + 0.5, direction: 1,
                patrolRange: p.width / 2 - 30, patrolCenter: p.x + p.width / 2,
                canShoot: sp.canShoot, shootCooldown: Math.random() * 120 + 120
            });
        });
    }

    function spawnBoss() {
        const arena = platforms.find(p => p.type === 'boss_arena');
        boss = {
            x: arena.x + arena.width / 2 - 100, y: arena.y - 200, width: 150, height: 200,
            health: 75, maxHealth: 75, speed: 1.5, direction: -1, velocityY: 0,
            onGround: false, state: 'idle', stateTimer: 180, isAlive: true
        };
    }

    function createDynamicBackground() {
        background.stars = [];
        for(let i = 0; i < 300; i++) {
            background.stars.push({
                x: Math.random() * worldWidth, y: Math.random() * worldHeight,
                size: Math.random() * 2 + 0.5, parallax: Math.random() * 0.4 + 0.1
            });
        }
        background.clouds = [];
        for(let i = 0; i < 20; i++) {
            background.clouds.push({
                x: Math.random() * worldWidth * 2, y: Math.random() * worldHeight * 0.8,
                width: Math.random() * 400 + 300, height: Math.random() * 30 + 20,
                speed: Math.random() * 0.3 + 0.1, opacity: Math.random() * 0.3 + 0.1
            });
        }
        background.weatherParticles = [];
        for(let i = 0; i < 100; i++) {
            background.weatherParticles.push({
                x: Math.random() * canvas.width, y: Math.random() * canvas.height,
                length: Math.random() * 15 + 5, speed: Math.random() * 3 + 2
            });
        }
    }

    function startGame() {
        console.log("Starting game loop...");
        gameState = 'PLAYING';
        gamePaused = false;
        requestAnimationFrame(gameLoop);
    }

    // ===================================================================================
    // بخش ۵: منطق به‌روزرسانی شخصیت‌ها و اشیاء
    // ===================================================================================

     function updatePlayer() {
        const wasOnGround = player.onGround;
        if (player.invincibleTimer > 0) {
            player.invincibleTimer--;
        }

        player.velocityX = 0;
        if (keys.left) {
            player.velocityX = -player.speed;
            player.lastDirection = 'left';
            if (player.onGround) {
                createParticles(player.x + player.width, player.y + player.height, 1, '#D2B48C', 'dust');
            }
        }
        if (keys.right) {
            player.velocityX = player.speed;
            player.lastDirection = 'right';
            if (player.onGround) {
                createParticles(player.x, player.y + player.height, 1, '#D2B48C', 'dust');
            }
        }
        if (keys.jump && !player.isJumping && player.onGround) {
            player.velocityY = jumpPower;
            player.isJumping = true;
            createParticles(player.x + player.width / 2, player.y + player.height, 10, '#ffffff', 'jump');
        }

        if (player.shootTimer > 0) {
            player.shootTimer--;
        }
        if (keys.shoot && player.hasGun && player.ammo > 0 && player.shootTimer === 0) {
            player.ammo--;
            player.shootTimer = 25; // Cooldown
            bullets.push({
                x: player.x + (player.lastDirection === 'right' ? player.width : -10),
                y: player.y + 35,
                width: 10,
                height: 5,
                direction: player.lastDirection,
                owner: 'player'
            });
            createParticles(player.x + (player.lastDirection === 'right' ? player.width : 0), player.y + 37, 3, 'orange', 'muzzle');
        }

        player.x += player.velocityX;
        player.y += player.velocityY;
        player.velocityY += gravity;

        player.onGround = false;
        const groundY = worldHeight - 50;
        if (player.y + player.height > groundY && player.velocityY >= 0) {
            player.y = groundY - player.height;
            player.velocityY = 0;
            player.isJumping = false;
            player.onGround = true;
        }

        platforms.filter(p => p.isVisible).forEach(p => {
            if (p.type === 'moving-x') {
                p.x = p.startX + Math.sin(Date.now() * 0.001 * p.speed) * p.range;
            }
            if (p.type === 'moving-y') {
                p.y = p.startY + Math.sin(Date.now() * 0.001 * p.speed) * p.range;
            }
            if (player.x + player.width > p.x && player.x < p.x + p.width && player.y + player.height > p.y && player.y + player.height < p.y + p.height + player.velocityY) {
                if (player.velocityY >= 0) {
                    player.y = p.y - player.height;
                    player.velocityY = 0;
                    player.isJumping = false;
                    player.onGround = true;
                    if (p.type === 'moving-x') {
                        player.x += (p.x - p.startX) - ( (p.startX + Math.sin((Date.now() - 16) * 0.001 * p.speed) * p.range) - p.startX);
                    }
                    if (p.type === 'crumble' && p.life > 0) {
                        p.life -= 4;
                    }
                }
            }
            if (p.type === 'crumble' && p.life <= 0 && p.isVisible) {
                p.isVisible = false;
                setTimeout(() => {
                    p.isVisible = true;
                    p.life = 100;
                }, 3000);
            }
        });

        if (player.onGround && !wasOnGround) {
            createParticles(player.x + player.width / 2, player.y + player.height, 15, '#ffffff', 'land');
            triggerCameraShake(3, 10);
        }
        if (player.y > worldHeight + 200) {
            player.health = 0;
            gameOver("شما در اعماق سیاره مشتری سقوط کردید!");
        }
        if (player.health <= 0 && gameState !== 'GAMEOVER') {
            gameOver("شما توسط دشمنان شکست خوردید!");
        }

        player.x = Math.max(0, Math.min(player.x, worldWidth - player.width));

        if (!gunItem.isCollected && isColliding(player, gunItem)) {
            gunItem.isCollected = true;
            player.hasGun = true;
            player.ammo += 200; // مهمات بیشتر
            createParticles(gunItem.x, gunItem.y, 30, 'lightblue', 'collect');
            teammates.forEach(t => t.hasGun = true);
        }
        if (!rocketPart.isCollected && isColliding(player, rocketPart) && boss && !boss.isAlive) {
            rocketPart.isCollected = true;
            questUI.innerText = "قطعه موشک: پیدا شد!";
            createParticles(rocketPart.x, rocketPart.y, 50, '#ffff00', 'collect');
            winGame();
        }
    }

    function updateTeammates() {
        teammates.forEach((tm, index) => {
            // START: Bug fix for teammates getting stuck
            const totalDistance = Math.hypot(player.x - tm.x, player.y - tm.y);
            // If teammate is too far away, teleport them behind the player
            if (totalDistance > canvas.width * 0.8) {
                tm.x = player.x - (player.lastDirection === 'right' ? (50 + index * 20) : (-50 - index * 20));
                tm.y = player.y;
                tm.velocityY = 0; // Reset velocity to prevent falling through floor on teleport
                tm.onGround = player.onGround;
            }
            // END: Bug fix for teammates getting stuck

            if (tm.invincibleTimer > 0) tm.invincibleTimer--;

            let closestEnemy = null;
            let minDistance = 400;
            const allTargets = enemies.concat(boss && boss.isAlive ? [boss] : []);
            allTargets.forEach(e => {
                if(e.health > 0) {
                    const dist = Math.hypot(e.x - tm.x, e.y - tm.y);
                    if (dist < minDistance) {
                        minDistance = dist;
                        closestEnemy = e;
                    }
                }
            });

            if (closestEnemy && player.hasGun) {
                tm.state = 'ATTACKING';
                tm.target = closestEnemy;
            } else {
                tm.state = 'FOLLOWING';
                tm.target = null;
            }

            if (tm.state === 'ATTACKING') {
                tm.lastDirection = tm.target.x > tm.x ? 'right' : 'left';
                if (tm.shootCooldown > 0) tm.shootCooldown--;
                if (tm.shootCooldown <= 0) {
                    tm.shootCooldown = 60;
                    bullets.push({ x: tm.x + (tm.lastDirection === 'right' ? tm.width : -10), y: tm.y + 35, width: 10, height: 5, direction: tm.lastDirection, owner: 'teammate' });
                }
                tm.velocityX = 0;
            } else if (tm.state === 'FOLLOWING') {
                const followDistance = 70 + index * 60;
                const distanceToPlayer = player.x - tm.x;
                if (Math.abs(distanceToPlayer) > followDistance) {
                    tm.velocityX = Math.sign(distanceToPlayer) * (player.speed * 0.8);
                    tm.lastDirection = tm.velocityX > 0 ? 'right' : 'left';
                } else {
                    tm.velocityX = 0;
                }
            }

            tm.x += tm.velocityX;
            tm.y += tm.velocityY;
            tm.velocityY += gravity;
            tm.onGround = false;

            const groundY = worldHeight - 50;
            if (tm.y + tm.height > groundY && tm.velocityY >= 0) {
                tm.y = groundY - tm.height;
                tm.velocityY = 0;
                tm.isJumping = false;
                tm.onGround = true;
            }

            platforms.filter(p => p.isVisible).forEach(p => {
                if (isColliding(tm, p) && tm.velocityY >= 0) {
                    tm.y = p.y - tm.height;
                    tm.velocityY = 0;
                    tm.isJumping = false;
                    tm.onGround = true;
                }
            });

            tm.quoteTimer--;
            if (tm.quoteTimer <= 0) {
                tm.quoteTimer = Math.random() * 300 + 300;
                tm.currentQuote = tm.quotes[Math.floor(Math.random() * tm.quotes.length)];
            }
        });
    }

    function updateEnemies() {
        enemies.forEach(e => {
            e.x += e.speed * e.direction;
            if (e.x < e.patrolCenter - e.patrolRange || e.x > e.patrolCenter + e.patrolRange) {
                e.direction *= -1;
            }
            if (e.canShoot && e.shootCooldown > 0) {
                e.shootCooldown--;
            }
            if (e.canShoot && e.shootCooldown <= 0 && Math.abs(player.x - e.x) < 400) {
                e.shootCooldown = Math.random() * 120 + 180;
                const target = [player, ...teammates][Math.floor(Math.random() * (teammates.length + 1))];
                const angle = Math.atan2(target.y + target.height / 2 - (e.y + e.height / 2), target.x + target.width / 2 - (e.x + e.width / 2));
                enemyBullets.push({
                    x: e.x + e.width / 2, y: e.y + e.height / 2, width: 8, height: 8,
                    vx: Math.cos(angle) * 4, vy: Math.sin(angle) * 4, owner: 'enemy'
                });
            }
        });
    }

    function updateBoss() {
        if (!boss.isAlive) return;
        boss.stateTimer--;
        const arena = platforms.find(p => p.type === 'boss_arena');

        if (boss.stateTimer <= 0) {
            const nextState = Math.random();
            if (nextState < 0.4) {
                boss.state = 'charge';
                boss.stateTimer = 180;
                boss.direction = player.x < boss.x ? -1 : 1;
            } else if (nextState < 0.8) {
                boss.state = 'shoot';
                boss.stateTimer = 240;
            } else {
                boss.state = 'jump';
                boss.stateTimer = 120;
                if (boss.onGround) {
                    boss.velocityY = -15;
                }
            }
        }

        if (boss.state === 'charge') {
            boss.x += boss.speed * boss.direction;
        }
        if (boss.state === 'shoot' && boss.stateTimer % 30 === 0) {
            for(let i = 0; i < 3; i++) {
                const angle = Math.atan2(player.y - boss.y, player.x - boss.x) + (Math.random() - 0.5) * 0.5;
                enemyBullets.push({
                    x: boss.x + boss.width / 2, y: boss.y + boss.height / 2, width: 15, height: 15,
                    vx: Math.cos(angle) * 5, vy: Math.sin(angle) * 5, owner: 'enemy'
                });
            }
        }

        boss.y += boss.velocityY;
        boss.velocityY += gravity;
        boss.onGround = false;

        const groundY = worldHeight - 50;
        if (boss.y + boss.height > groundY && boss.velocityY >= 0) {
            boss.y = groundY - boss.height;
            boss.velocityY = 0;
            boss.onGround = true;
             if (boss.state === 'jump') {
                triggerCameraShake(15, 25);
                boss.state = 'idle';
                boss.stateTimer = 60;
            }
        }

        boss.x = Math.max(arena.x, Math.min(boss.x, arena.x + arena.width - boss.width));
    }

    function updateBullets(bulletArray, targets) {
        for (let i = bulletArray.length - 1; i >= 0; i--) {
            const b = bulletArray[i];
            if (b.direction) {
                b.x += b.direction === 'right' ? 12 : -12;
            } else {
                b.x += b.vx;
                b.y += b.vy;
            }
            if (b.x < camera.x - 50 || b.x > camera.x + canvas.width + 50) {
                bulletArray.splice(i, 1);
                continue;
            }

            for (let j = targets.length - 1; j >= 0; j--) {
                const t = targets[j];
                if (t.health > 0 && isColliding(b, t)) {
                    if (t.invincibleTimer && t.invincibleTimer > 0) continue;
                    bulletArray.splice(i, 1);
                    t.health--;
                    createParticles(b.x, b.y, 10, 'red', 'hit');

                    if (t.name === 'کوروش' || t.name === 'داریوش' || t.name === 'رستم' || t.name === 'سهراب') {
                        t.invincibleTimer = 90;
                        if (t === player) {
                            triggerCameraShake(8, 15);
                        }
                    }
                    if (t.health <= 0) {
                        if (t === boss) {
                            t.isAlive = false;
                            createParticles(t.x + t.width / 2, t.y + t.height / 2, 200, 'orange', 'collect');
                        } else if (!teammates.includes(t)) {
                             enemies.splice(j, 1);
                             createParticles(t.x + t.width / 2, t.y + t.height / 2, 40, 'lightgreen', 'collect');
                             const dropChance = Math.random();
                             if (dropChance < 0.3) { // شانس بیشتر
                                 items.push({x: t.x, y: t.y, type: 'health_pack'});
                             } else if (dropChance < 0.8) { // شانس بیشتر
                                 items.push({x: t.x, y: t.y, type: 'ammo_pack'});
                             }
                        }
                    }
                    break;
                }
            }
        }
    }

    function updateItems() {
        for (let i = items.length - 1; i >= 0; i--) {
            const item = items[i];
            const chars = [player, ...teammates];
            for(const char of chars) {
                if (isColliding(char, item)) {
                    if (item.type === 'health_pack' && char.health < char.maxHealth) {
                        char.health++;
                    }
                    if (item.type === 'ammo_pack' && player.hasGun) { // مهمات همیشه به بازیکن اصلی اضافه می‌شود
                        player.ammo += 50; // مهمات بیشتر
                    }
                    items.splice(i, 1);
                    break;
                }
            }
        }
    }

    function updateCamera() {
        const targetCameraX = player.x - canvas.width / 3;
        camera.x += (targetCameraX - camera.x) * 0.08;
        camera.x = Math.max(0, Math.min(camera.x, worldWidth - canvas.width));
        camera.y = 0;
        if (camera.shake.duration > 0) {
            camera.shake.duration--;
        } else {
            camera.shake.intensity = 0;
        }
    }

    function updateParticles() {
        for(let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vy += p.gravity;
            p.life--;
            if (p.life <= 0) {
                particles.splice(i, 1);
            }
        }
    }

    function updateBackground() {
        background.clouds.forEach(c => {
            c.x -= c.speed;
            if (c.x + c.width < 0) {
                c.x = worldWidth * 2;
            }
        });
        background.weatherParticles.forEach(p => {
            p.y += p.speed;
            p.x -= p.speed / 4;
            if (p.y > canvas.height) {
                p.y = 0;
                p.x = Math.random() * canvas.width;
            }
        });
    }

    function updateUI() {
        healthUI.innerHTML = `سلامتی: ${'❤️'.repeat(Math.max(0, player.health))}${'🖤'.repeat(Math.max(0, player.maxHealth - player.health))}`;
        ammoUI.innerText = `مهمات: ${player.hasGun ? player.ammo : '---'}`;
        if (player.invincibleTimer > 0 && player.health < player.maxHealth / 2) {
            playerUI.classList.add('danger');
        } else {
            playerUI.classList.remove('danger');
        }
    }

    // ===================================================================================
    // بخش ۶: توابع رندر
    // ===================================================================================

    function drawGround() {
        const groundY = worldHeight - 50;
        const grad = ctx.createLinearGradient(0, groundY, 0, worldHeight);
        grad.addColorStop(0, '#6D4C41');
        grad.addColorStop(1, '#4E342E');
        ctx.fillStyle = grad;
        ctx.fillRect(0, groundY, worldWidth, worldHeight - groundY);

        ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
        for (let i = 0; i < worldWidth; i += 50) {
            ctx.beginPath();
            ctx.arc(i + (Math.random() * 20 - 10), groundY + (Math.random() * 40), Math.random() * 15, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function drawBackground() {
        const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
        sky.addColorStop(0, '#2E1F1A');
        sky.addColorStop(0.5, '#5C4033');
        sky.addColorStop(1, '#8B4513');
        ctx.fillStyle = sky;
        ctx.fillRect(camera.x, 0, canvas.width, canvas.height);

        ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
        background.stars.forEach(s => {
            const x = s.x - camera.x * s.parallax;
            ctx.fillRect(x, s.y, s.size, s.size);
        });

        const sx = background.greatRedSpot.x - camera.x * 0.1, sy = background.greatRedSpot.y, ss = background.greatRedSpot.size;
        const spot = ctx.createRadialGradient(sx, sy, ss * 0.1, sx, sy, ss);
        spot.addColorStop(0, '#BF573B');
        spot.addColorStop(0.5, '#9C3E2F');
        spot.addColorStop(1, 'rgba(156, 62, 47, 0)');
        ctx.fillStyle = spot;
        ctx.beginPath();
        ctx.ellipse(sx, sy, ss, ss * 0.7, 0, 0, Math.PI * 2);
        ctx.fill();

        background.clouds.forEach(c => {
            ctx.fillStyle = `rgba(210, 180, 140, ${c.opacity})`;
            ctx.fillRect(c.x - camera.x * 0.8, c.y, c.width, c.height);
        });

        ctx.strokeStyle = 'rgba(210, 180, 140, 0.2)';
        ctx.lineWidth = 2;
        background.weatherParticles.forEach(p => {
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p.x - p.length / 2, p.y - p.length);
            ctx.stroke();
        });
    }

    function drawPlatforms() {
        platforms.forEach(p => {
            if (!p.isVisible) return;
            ctx.save();
            if (p.type === 'crumble' && p.life < 80) {
                ctx.translate(p.x + p.width / 2, p.y + p.height / 2);
                ctx.rotate((Math.random() - 0.5) * 0.05);
                ctx.translate(-(p.x + p.width / 2), -(p.y + p.height / 2));
            }
            const grad = ctx.createLinearGradient(p.x, p.y, p.x, p.y + p.height);
            grad.addColorStop(0, '#BCAAA4');
            grad.addColorStop(1, '#A1887F');
            ctx.fillStyle = grad;
            ctx.globalAlpha = p.life ? p.life / 100 : 1;
            ctx.fillRect(p.x, p.y, p.width, p.height);
            ctx.fillStyle = '#D7CCC8';
            ctx.fillRect(p.x, p.y, p.width, 3);
            ctx.restore();
        });
    }

    function drawDecorations() {
        environmentalDecorations.forEach(d => {
            ctx.fillStyle = d.shape === 'rock' ? '#795548' : '#B2EBF2';
            ctx.beginPath();
            if (d.shape === 'rock') {
                ctx.arc(d.x, d.y, d.radius, Math.PI, Math.PI * 2);
            } else {
                ctx.moveTo(d.x, d.y);
                ctx.lineTo(d.x - d.radius, d.y);
                ctx.lineTo(d.x - d.radius / 2, d.y - d.radius * 1.5);
                ctx.closePath();
            }
            ctx.fill();
        });
    }

    function drawStaticObjects() {
        if (assets.rocket?.complete && assets.rocket.naturalWidth !== 0) {
            ctx.drawImage(assets.rocket, staticObjects.rocket.x, staticObjects.rocket.y, staticObjects.rocket.width, staticObjects.rocket.height);
        }
        if (assets.flag?.complete && assets.flag.naturalWidth !== 0) {
            ctx.drawImage(assets.flag, staticObjects.flag.x, staticObjects.flag.y, staticObjects.flag.width, staticObjects.flag.height);
        }
    }

    function drawGun() {
        if (assets.gun?.complete && assets.gun.naturalWidth !== 0) {
            ctx.save();
            ctx.shadowBlur = 15;
            ctx.shadowColor = "lightblue";
            ctx.drawImage(assets.gun, gunItem.x, gunItem.y, gunItem.width, gunItem.height);
            ctx.restore();
        }
    }

    function drawItems() {
        items.forEach(item => {
            const img = assets[item.type];
            if (img?.complete && img.naturalWidth !== 0) {
                ctx.drawImage(img, item.x, item.y, 30, 30);
            } else {
                ctx.fillStyle = item.type === 'health_pack' ? 'green' : 'yellow';
                ctx.fillRect(item.x, item.y, 30, 30);
            }
        });
    }

    function drawEnemies() {
        enemies.forEach(e => {
            if (assets.zombie?.complete && assets.zombie.naturalWidth !== 0) {
                ctx.drawImage(assets.zombie, e.x, e.y, e.width, e.height);
            } else {
                ctx.fillStyle = 'red';
                ctx.fillRect(e.x, e.y, e.width, e.height);
            }
        });
    }

    function drawBoss() {
        if (boss.isAlive && assets.boss?.complete && assets.boss.naturalWidth !== 0) {
            ctx.drawImage(assets.boss, boss.x, boss.y, boss.width, boss.height);
            // رسم نوار سلامتی بالای سر غول
            const healthBarWidth = 150;
            const healthBarHeight = 10;
            const healthBarX = boss.x + (boss.width - healthBarWidth) / 2;
            const healthBarY = boss.y - 20;

            ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
            ctx.fillRect(healthBarX, healthBarY, healthBarWidth, healthBarHeight);

            const currentHealthWidth = healthBarWidth * (boss.health / boss.maxHealth);
            ctx.fillStyle = '#ff4d4d';
            ctx.fillRect(healthBarX, healthBarY, currentHealthWidth, healthBarHeight);

            ctx.strokeStyle = 'white';
            ctx.lineWidth = 1;
            ctx.strokeRect(healthBarX, healthBarY, healthBarWidth, healthBarHeight);

        } else if (boss.isAlive) {
            ctx.fillStyle = 'purple';
            ctx.fillRect(boss.x, boss.y, boss.width, boss.height);
        }
    }

    function drawRocketPart() {
        if (!rocketPart.isCollected && assets.rocket_part?.complete && assets.rocket_part.naturalWidth !== 0) {
            ctx.save();
            ctx.shadowBlur = 20;
            ctx.shadowColor = (boss && boss.isAlive) ? "red" : "yellow";
            const yBob = Math.sin(Date.now() * 0.003) * 5;
            ctx.drawImage(assets.rocket_part, rocketPart.x, rocketPart.y + yBob, rocketPart.width, rocketPart.height);
            ctx.restore();
        }
    }

    function drawPlayer() {
        drawCharacter(player);
    }

    function drawTeammates() {
        teammates.forEach(tm => {
            if (tm.health <= 0) return;
            drawCharacter(tm);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.strokeStyle = '#D2B48C';
            ctx.lineWidth = 1;
            ctx.font = '12px Vazirmatn';
            const textWidth = ctx.measureText(tm.currentQuote).width;
            const boxX = tm.x + tm.width / 2 - textWidth / 2 - 10;
            const boxY = tm.y - 40;
            ctx.beginPath();
            ctx.roundRect(boxX, boxY, textWidth + 20, 25, [8]);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = 'white';
            ctx.textAlign = 'center';
            ctx.fillText(tm.currentQuote, tm.x + tm.width / 2, tm.y - 23);
        });
    }

    function drawCharacter(char) {
        let state = char.isJumping ? 'jump' : (char.velocityX !== 0 ? 'walk' : 'idle');
        const hasGun = char.hasGun || player.hasGun;
        const imgKey = `player_${state}_${hasGun ? 'gun' : 'no_gun'}`;
        const img = assets[imgKey];
        ctx.save();
        if (char.invincibleTimer > 0 && Math.floor(char.invincibleTimer / 6) % 2 === 0) {
            ctx.globalAlpha = 0.4;
        }

        if (img?.complete && img.naturalWidth !== 0) {
            if (char.lastDirection === 'left') {
                ctx.scale(-1, 1);
                ctx.drawImage(img, -char.x - char.width, char.y, char.width, char.height);
            } else {
                ctx.drawImage(img, char.x, char.y, char.width, char.height);
            }
        } else {
            ctx.fillStyle = char === player ? 'blue' : 'green';
            ctx.fillRect(char.x, char.y, char.width, char.height);
        }
        ctx.restore();
    }

    function drawBullets(bulletArray, color) {
        ctx.fillStyle = color;
        ctx.shadowColor = color;
        ctx.shadowBlur = 10;
        bulletArray.forEach(b => ctx.fillRect(b.x, b.y, b.width, b.height));
        ctx.shadowBlur = 0;
    }

    function drawParticles() {
        particles.forEach(p => {
            ctx.globalAlpha = p.life / p.startLife;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
        });
    }

    // ===================================================================================
    // بخش ۷: توابع کمکی و سیستم‌ها
    // ===================================================================================

    function isColliding(rect1, rect2) {
        if (!rect1 || !rect2) return false;
        return rect1.x < rect2.x + rect2.width &&
               rect1.x + rect1.width > rect2.x &&
               rect1.y < rect2.y + rect2.height &&
               rect1.y + rect1.height > rect2.y;
    }

    function createParticles(x, y, count, color, type) {
        for (let i = 0; i < count; i++) {
            const life = Math.random() * 40 + 20;
            let p = { x, y, life, startLife: life, size: Math.random() * 3 + 1, color, gravity: 0.1, vx: 0, vy: 0 };
            switch (type) {
                case 'dust':
                    p.vx = (Math.random() - 0.5) * 1; p.vy = Math.random() * -1; break;
                case 'jump':
                    p.vx = (Math.random() - 0.5) * 3; p.vy = Math.random() * -2 - 1; break;
                case 'land':
                    p.vx = (Math.random() - 0.5) * 4 * (Math.random() > 0.5 ? 1 : -1); p.vy = Math.random() * -3; break;
                case 'hit':
                    p.vx = (Math.random() - 0.5) * 5; p.vy = (Math.random() - 0.5) * 5; break;
                case 'muzzle':
                    p.vx = (player.lastDirection === 'right' ? 1 : -1) * (Math.random() * 2 + 1); p.vy = (Math.random() - 0.5) * 2; p.gravity = 0; break;
                case 'collect':
                    const angle = Math.random() * Math.PI * 2; const speed = Math.random() * 4 + 2;
                    p.vx = Math.cos(angle) * speed; p.vy = Math.sin(angle) * speed; p.gravity = 0.05; break;
            }
            particles.push(p);
        }
    }

    function triggerCameraShake(intensity, duration) {
        camera.shake.intensity = intensity;
        camera.shake.duration = duration;
    }

    function applyCameraShake() {
        if (camera.shake.duration > 0) {
            const dx = (Math.random() - 0.5) * camera.shake.intensity;
            const dy = (Math.random() - 0.5) * camera.shake.intensity;
            ctx.translate(dx, dy);
        }
    }

    function showDialogue(onCompleteCallback) {
        gamePaused = true;
        gameState = 'DIALOGUE';
        if (!dialogueBox || !dialogueText || !dialogueBtn) {
            console.error("Dialogue elements not found!");
            if (onCompleteCallback) onCompleteCallback();
            return;
        }
        dialogueBox.style.display = 'block';
        function showNextLine() {
            if (storyIndex >= storyScript.length) {
                dialogueBox.style.display = 'none';
                dialogueBtn.onclick = null;
                if (onCompleteCallback) onCompleteCallback();
                return;
            }
            dialogueText.innerText = storyScript[storyIndex];
            if (storyIndex === storyScript.length - 1 && gameState !== 'GAMEOVER' && gameState !== 'WIN') {
                dialogueBtn.innerText = "شروع ماموریت";
            } else {
                 dialogueBtn.innerText = "بعدی";
            }
            storyIndex++;
        }
        dialogueBtn.onclick = showNextLine;
        showNextLine();
    }

    // START: MODIFIED gameOver function
    function gameOver(message) {
        if (gameState === 'GAMEOVER') return;
        gameState = 'GAMEOVER';
        gamePaused = true;

        // Get the new HTML elements
        const gameOverOverlay = document.getElementById('game-over-overlay');
        const gameOverInitial = document.getElementById('game-over-initial');
        const gameOverOptions = document.getElementById('game-over-options');
        const gameOverOkBtn = document.getElementById('game-over-ok-btn');
        const gameOverRestartBtn = document.getElementById('game-over-restart-btn');
        const gameOverBackToMenuBtn = document.getElementById('game-over-back-to-menu-btn');

        // Show the overlay
        gameOverOverlay.style.display = 'flex';
        gameOverInitial.style.display = 'block';
        gameOverOptions.style.display = 'none';

        // Add event listeners
        gameOverOkBtn.onclick = () => {
            gameOverInitial.style.display = 'none';
            gameOverOptions.style.display = 'flex';
        };

        gameOverRestartBtn.onclick = () => {
            window.location.reload();
        };

        gameOverBackToMenuBtn.onclick = () => {
            window.location.href = 'level-select.html';
        };
    }
    // END: MODIFIED gameOver function

    // START: MODIFIED winGame function
    function winGame() {
        if (gameState === 'WIN') return;
        gameState = 'WIN';
        gamePaused = true;

        const winOverlay = document.getElementById('win-overlay');
        const winOkBtn = document.getElementById('win-ok-btn');

        winOverlay.style.display = 'block';

        winOkBtn.onclick = () => {
            try{ window.unlockStageNext && window.unlockStageNext(7); }catch(e){}
            // Fallback in case the module wasn't available
            try{
                const key = 'unlockedLevel';
                const existing = parseInt(localStorage.getItem(key) || '1', 10) || 1;
                const next = Math.max(existing, 7 + 1);
                localStorage.setItem(key, String(next));
            }catch(e){}
            window.location.href = 'level-select.html';
        };
    }
    // END: MODIFIED winGame function

    function loadAssets(callback) {
        let loadedCount = 0;
        const totalAssets = Object.keys(assetPaths).length;
        if (totalAssets === 0) {
            callback();
            return;
        }
        for (const key in assetPaths) {
            const path = `file:///android_asset/${assetPaths[key]}`;
            const img = new Image();
            assets[key] = img;
            img.onload = () => {
                loadedCount++;
                if (loadedCount === totalAssets) {
                    callback();
                }
            };
            img.onerror = () => {
                console.error(`خطا در بارگذاری فایل: ${path}`);
                loadingText.innerText = `خطا در بارگذاری ${assetPaths[key]}`;
                loadedCount++;
                if (loadedCount === totalAssets) {
                    callback();
                }
            }
            img.src = path;
        }
    }

    // ===================================================================================
    // بخش ۸: کنترلرها و Event Listeners
    // ===================================================================================
    function setupEventListeners() {
        const addTouchListeners = (btnId, key) => {
            const btn = document.getElementById(btnId);
            btn.addEventListener('touchstart', e => { e.preventDefault(); keys[key] = true; }, { passive: false });
            btn.addEventListener('touchend', e => { e.preventDefault(); keys[key] = false; }, { passive: false });
        };
        addTouchListeners('left-btn', 'left');
        addTouchListeners('right-btn', 'right');
        addTouchListeners('jump-btn', 'jump');
        addTouchListeners('shoot-btn', 'shoot');

        // per-stage menu event listeners removed — common menu (common.js) will wire onMenuContinue/onMenuRestart/onMenuBack

        window.addEventListener('resize', setupWorld);
    }

    document.addEventListener('DOMContentLoaded', main);
    // include common menu script and callbacks
    (function(){
        const s = document.createElement('script'); s.src='common.js'; document.body.appendChild(s);
        s.onload = function(){
            window.onMenuContinue = window.onMenuContinue || function(){ gamePaused = false; };
            window.onMenuRestart = window.onMenuRestart || function(){ window.location.reload(); };
            window.onMenuBack = window.onMenuBack || function(){ try{ window.unlockStageNext && window.unlockStageNext(7);}catch(e){} window.location.href='level-select.html'; };
        };
    })();
</script>
