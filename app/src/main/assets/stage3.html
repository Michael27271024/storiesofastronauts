<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مرحله ۳: عبور از کمربند سیارکی</title>
    <link rel="stylesheet" href="common.css">
    <style>
        @font-face { font-family: 'Vazirmatn'; src: url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-Regular.woff2') format('woff2'); }
        body, html { margin:0; padding:0; overflow:hidden; width:100%; height:100%; background:#071025; font-family:'Vazirmatn',sans-serif; }
        .game-wrapper{position:relative;width:100%;height:100%;}
        canvas{display:block;background:linear-gradient(#071025,#02020a);} 
        .controls-container{position:absolute;bottom:10px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none}
        .control-group{display:flex;align-items:center;gap:10px;pointer-events:auto;direction:ltr}
        .control-btn{width:50px;height:50px;border-radius:50%;border:2px solid #C78146;background:rgba(199,129,70,0.15);color:#fff}
        .ui-container{position:absolute;top:15px;left:15px;color:#fff;z-index:50}
        .message-box{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.8);padding:20px;border-radius:10px;border:2px solid #C78146;color:#fff;display:none;z-index:200}
        #loading-screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#071025;color:#fff;z-index:1000}
    </style>
</head>
<body>
<div id="loading-screen-stage3">در حال بارگذاری...</div>
<div class="game-wrapper">
    <div class="ui-container" style="display:none;"><div id="timer-ui-stage3">زمان: --:--</div><div id="oxygen-ui-stage3">باتری: ۰ / ۲</div><div id="ammo-ui-stage3">تیر: ۰</div><div id="health-ui-stage3">سلامتی: ❤️</div></div>
    <canvas id="gameCanvas-stage3"></canvas>
    <div id="message-box-stage3" class="message-box"><p id="message-text-stage3"></p><button id="message-ok-btn-stage3" class="message-btn" style="margin-top:15px;">باشه</button></div>
</div>
<div class="controls-container" id="controls-stage3" style="display:none;"><div class="control-group actions"><button class="control-btn" id="shoot-btn-stage3">●</button><button class="control-btn" id="jump-btn-stage3">▲</button></div><div class="control-group movement"><button class="control-btn" id="crouch-btn-stage3">▼</button><button class="control-btn" id="left-btn-stage3">◀</button><button class="control-btn" id="right-btn-stage3">▶</button></div></div>

<script>
(function(){
    const canvas=document.getElementById('gameCanvas-stage3');const ctx=canvas.getContext('2d');let gamePaused=true;const uiContainer=document.querySelector('.ui-container');const timerUI=document.getElementById('timer-ui-stage3');const oxygenUI=document.getElementById('oxygen-ui-stage3');const ammoUI=document.getElementById('ammo-ui-stage3');const messageBox=document.getElementById('message-box-stage3');const messageText=document.getElementById('message-text-stage3');const messageOkBtn=document.getElementById('message-ok-btn-stage3');const controls=document.getElementById('controls-stage3');
    const player={ name:(function(){try{return sessionStorage.getItem('selectedCharacter')||'کوروش';}catch(e){return'کوروش';}})(), x:50,y:0,width:50,height:70,speed:4,velocityX:0,velocityY:0,isJumping:false,isCrouching:false,isShooting:false,shootTimer:0,hasGun:false,ammo:0,batteries:0,health:3 };
    let bullets=[],enemies=[],items=[];const keys={right:false,left:false,jump:false,crouch:false,shoot:false};const platforms=[{x:0,y:0,width:3000,height:40}];
    function spawnEnemies(n){enemies=[];for(let i=0;i<n;i++)enemies.push({x:500+Math.random()*(platforms[0].width-600),y:canvas.height-110,width:50,height:70,hp:2+Math.floor(Math.random()*3),speed:Math.random()*0.7+0.3,direction:Math.random()<0.5?1:-1,shootCooldown:Math.floor(Math.random()*200)+120});}
    function resizeCanvas(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;platforms[0].y=canvas.height-40;player.y=canvas.height-player.height-40}
    function showMessage(text,onConfirm){gamePaused=true;messageText.innerText=text;messageBox.style.display='block';messageOkBtn.addEventListener('click',function once(){messageBox.style.display='none';if(onConfirm)onConfirm();},{once:true});}
    function startGame(){showMessage('کمربند سیارکی پر از دشمن است — عبور کن و مواد لازم را جمع کن.',()=>{gamePaused=false;requestAnimationFrame(gameLoop);});}
    function gameOver(msg){gamePaused=true;showMessage(msg,()=>window.location.href='level-select.html');}
    function winGame(){gamePaused=true;showMessage('تبریک! مرحله تمام شد.',()=>{try{const unlocked=parseInt(localStorage.getItem('unlockedLevel')||'1',10)||1;const next=Math.max(unlocked,4);localStorage.setItem('unlockedLevel',String(next));}catch(e){}window.location.href='level-select.html';});}
    function update(){if(gamePaused)return;bullets.forEach((b,i)=>{b.x+=b.direction==='right'?10:-10;if(b.x<0||b.x>platforms[0].width)bullets.splice(i,1);enemies.forEach((e,ei)=>{if(b.x<e.x+e.width&&b.x+10>e.x&&b.y<e.y+e.height&&b.y+5>e.y){bullets.splice(i,1);e.hp--;if(e.hp<=0){enemies.splice(ei,1);items.push({type:'battery',x:e.x,y:e.y+e.height-20,width:20,height:20,isCollected:false});try{if(window.AM)window.AM.playSfx('enemy_die');}catch(e){} }}})});
    }
    function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#071025';ctx.fillRect(0,0,canvas.width,canvas.height);bullets.forEach(b=>{ctx.fillStyle='#ffeb3b';ctx.fillRect(b.x,b.y,b.width,b.height)});enemies.forEach(e=>{ctx.fillStyle='#c0392b';ctx.fillRect(e.x,e.y,e.width,e.height)})}
    function gameLoop(){if(gamePaused)return;update();draw();requestAnimationFrame(gameLoop)}
    function loadAssets(cb){setTimeout(cb,200)}
    const addTouchListeners=(btn,key)=>{if(!btn)return;btn.addEventListener('touchstart',e=>{e.preventDefault();keys[key]=true},{passive:false});btn.addEventListener('touchend',e=>{e.preventDefault();keys[key]=false},{passive:false})};addTouchListeners(document.getElementById('left-btn-stage3'),'left');addTouchListeners(document.getElementById('right-btn-stage3'),'right');addTouchListeners(document.getElementById('jump-btn-stage3'),'jump');addTouchListeners(document.getElementById('crouch-btn-stage3'),'crouch');const shootBtn=document.getElementById('shoot-btn-stage3');if(shootBtn){shootBtn.addEventListener('touchstart',e=>{e.preventDefault();if(player.hasGun&&player.ammo>0){player.ammo--;bullets.push({x:player.x+10,y:player.y+30,width:10,height:5,direction:'right'});try{if(window.AM)window.AM.playSfx('shoot')}catch(e){} }},{passive:false})}
    window.onload=()=>{loadAssets(()=>{document.getElementById('loading-screen-stage3').style.display='none';uiContainer.style.display='block';controls.style.display='flex';window.addEventListener('resize',resizeCanvas);resizeCanvas();spawnEnemies(7);items.push({type:'gun',x:200,y:canvas.height-80,width:40,height:20,isCollected:false});try{if(window.AM){window.AM.init({assets:{music:{stage3_loop:'stage3_loop.wav',ambient_space:'ambient_space_loop.wav',stage2_loop:'stage2_loop.wav'},sfx:{shoot:'sfx_shoot.wav',enemy_die:'sfx_enemy_die.wav',pickup_battery:'sfx_pickup_battery.wav',pickup_gun:'sfx_pickup_gun.wav',pickup_part:'sfx_pickup_part.wav'}},autoplay:true,defaultMusic:'stage3_loop'});const playlistStage3=['stage3_loop','ambient_space','stage2_loop'];const startPlaylistStage3=function(){try{window.AM.ensurePlayback(playlistStage3,{rotateMs:65000,intervalMs:1200,durationMs:90000});}catch(e){}};document.addEventListener('click',function once(){startPlaylistStage3();document.removeEventListener('click',once)},{once:true});document.addEventListener('touchstart',function once(){startPlaylistStage3();document.removeEventListener('touchstart',once)},{once:true})}}catch(e){} startGame()});setTimeout(()=>{startPlaylistStage3();},1200);document.addEventListener('pointerdown',function once(){startPlaylistStage3();document.removeEventListener('pointerdown',once)},{once:true,passive:true});document.addEventListener('keydown',function once(){startPlaylistStage3();document.removeEventListener('keydown',once)},{once:true});document.addEventListener('mousemove',function once(){startPlaylistStage3();document.removeEventListener('mousemove',once)},{once:true,passive:true})}
    })();
    </script>

<div id="video-overlay-stage3" style="display:none;position:fixed;inset:0;align-items:center;justify-content:center;z-index:5000;background:#000;"></div>
<video id="video-player-stage3" playsinline style="position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:4000;visibility:hidden;"></video>
<script type="module">
    import { attachVideoHandlers } from './video-playback-fix.js';(function(){const vp=attachVideoHandlers({videoSelector:'#video-player-stage3',overlaySelector:'#video-overlay-stage3',redirectTo:'level-select.html'});window.stageVideoHelper=vp;window.playStageVideo=(src)=>vp.playSrc(src);window.freeStageVideo=()=>vp.freeVideo&&vp.freeVideo();window.unlockStageNext=(c)=>vp.unlockNext&&vp.unlockNext(c);window.getUnlockedLevel=()=>vp.getUnlocked?vp.getUnlocked():3})();
</script>

<script src="audio-manager.js"></script>
<script src="common.js"></script>
</body>
</html>
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مرحله ۳: سیاره سرخ</title>
    <link rel="stylesheet" href="common.css">
    <style>
        @font-face {
            font-family: 'Vazirmatn';
            src: url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-Regular.woff2') format('woff2');
            font-weight: normal; font-style: normal;
        }
        body, html {
            margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%;
            background-color: #000; font-family: 'Vazirmatn', sans-serif; color: white;
        }
        .scene-wrapper {
            width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            transition: background-image 1s ease-in-out;
        }
        #loading-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000; z-index: 1000; display: flex;
            justify-content: center; align-items: center; text-align: center;
            font-size: 1.5rem;
        }
        .dialogue-container {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #ff4500; /* Mars-like color */
            border-radius: 15px;
            padding: 15px;
            box-sizing: border-box;
            text-align: center;
            animation: slideUp 0.5s ease-out;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .dialogue-text {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 15px;
        }
        .next-btn {
            padding: 10px 30px;
            font-size: 1.1rem;
            background-color: transparent;
            border: 2px solid #ff4500;
            color: #ff4500;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        .next-btn:hover {
            background-color: #ff4500;
            color: black;
        }
        .scene-image {
            max-width: 200px;
            max-height: 150px;
            margin-bottom: 15px;
            animation: fadeIn 1s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
<div id="loading-screen-stage3">در حال بارگذاری مرحله ۳...</div>
<div id="scene" class="scene-wrapper">
    <div id="dialogue-box" class="dialogue-container" style="display: none;">
        <img id="scene-img" class="scene-image" style="display: none;">
        <p id="dialogue-text" class="dialogue-text"></p>
        <button id="next-button" class="next-btn">بعدی</button>
    </div>
</div>

<script>
    const scene = document.getElementById('scene');
    const dialogueBox = document.getElementById('dialogue-box');
    const dialogueText = document.getElementById('dialogue-text');
    const nextButton = document.getElementById('next-button');
    const sceneImg = document.getElementById('scene-img');
    const loadingScreen = document.getElementById('loading-screen-stage3');

    const assets = {};
    const assetPaths = {
        'mars_bg': 'mars_background.png',
        'base_bg': 'alien_base.png',
        'flag': 'starspawn_flag.png'
    };

    let storyIndex = 0;
    const storyScript = [
        { text: "پس از شکست ارتش محافظان ماه، رئیس آن‌ها مجبور شد با دشمن قدیمی خود، ارتش ستارگان، متحد شود." },
        { text: "این دو ارتش با هم متحد شدند و نام خود را «ارتش ستاره‌زادگان» گذاشتند تا شما را نابود کنند.", image: 'flag' },
        { text: "در همین حال، شما با موفقیت از ماه به سیاره مریخ سفر کردید.", background: 'mars_bg' },
        { text: "به محض رسیدن، با یک پایگاه عظیم و ترسناک مواجه شدید که پر از سربازان دشمن بود.", background: 'base_bg' },
        { text: "تصمیم گرفتید به پایگاه حمله کنید، اما قبل از آن باید با قوانین این سیاره و فضا بیشتر آشنا می‌شدید." },
        { text: "شما متوجه یک قانون حیاتی شدید: زمان در فضا سریع‌تر می‌گذرد!", style: 'important' },
        { text: "برای اینکه بتوانید به زمین برگردید، باید کل ماموریت خود را در کمتر از ۱۲۰ دقیقه زمینی به پایان برسانید!", style: 'important' },
        { text: "این مرحله به پایان رسید. در مراحل بعد، نبرد برای تسخیر پایگاه آغاز خواهد شد..." }
    ];

    function showNextScene() {
        if (storyIndex >= storyScript.length) {
            try{ window.unlockStageNext && window.unlockStageNext(3); }catch(e){}
            // Fallback: ensure next level unlocked even if the module import failed
            try {
                const cur = 3;
                const key = 'unlockedLevel';
                const existing = parseInt(localStorage.getItem(key) || '1', 10) || 1;
                const next = Math.max(existing, cur + 1);
                localStorage.setItem(key, String(next));
            } catch (e) {}
            window.location.href = 'level-select.html';
            return;
        }

        const currentScene = storyScript[storyIndex];

        if (currentScene.background) {
            scene.style.backgroundImage = `url(${assets[currentScene.background].src})`;
        }

        if (currentScene.image) {
            sceneImg.src = assets[currentScene.image].src;
            sceneImg.style.display = 'block';
        } else {
            sceneImg.style.display = 'none';
        }

        dialogueText.textContent = currentScene.text;
        dialogueText.style.color = currentScene.style === 'important' ? '#ff4500' : 'white';

        if (storyIndex === storyScript.length - 1) {
            nextButton.textContent = "پایان مرحله";
        }

        storyIndex++;
    }

    function loadAssetsAndStart() {
        let loadedCount = 0;
        const totalAssets = Object.keys(assetPaths).length;
        if (totalAssets === 0) {
            init();
            return;
        }
        for (const key in assetPaths) {
            const path = `file:///android_asset/${assetPaths[key]}`;
            assets[key] = new Image();
            assets[key].onload = () => {
                loadedCount++;
                if (loadedCount === totalAssets) {
                    init();
                }
            };
            assets[key].onerror = () => {
                loadingScreen.innerHTML = `خطا: فایل ${assetPaths[key]} پیدا نشد.`;
            };
            assets[key].src = path;
        }
    }

    function init() {
        loadingScreen.style.display = 'none';
        dialogueBox.style.display = 'block';
        scene.style.backgroundImage = `url(${assets.mars_bg.src})`; // Start with Mars bg
        showNextScene();
    }

    nextButton.addEventListener('click', showNextScene);
    window.onload = loadAssetsAndStart;
</script>

  <!-- injected video player -->
  <video id="video-player" playsinline></video>

  <!-- injected: integrate video-playback-fix.js -->
  <script type="module">
    import { attachVideoHandlers } from './video-playback-fix.js';
        (function(){
            const vp = attachVideoHandlers({ videoSelector: '#video-player', overlaySelector: null, redirectTo: 'level-select.html' });
            window.stageVideoHelper = vp;
            // expose a simple global helper used to play stage videos from existing code
            window.playStageVideo = function(src){ vp.playSrc(src); };
            // also expose freeVideo
            window.freeStageVideo = function(){ vp.freeVideo && vp.freeVideo(); };
            window.unlockStageNext = function(current){ vp.unlockNext && vp.unlockNext(current); };
            window.getUnlockedLevel = function(){ return vp.getUnlocked ? vp.getUnlocked() : 1; };
        })();
  </script>
  <!-- end injected -->
    <script src="common.js"></script>
    <script>
        // Menu callbacks for stage 3
        window.onMenuContinue = function(){ try{ if(typeof gamePaused !== 'undefined') gamePaused = false; if(typeof gameLoop === 'function') requestAnimationFrame(gameLoop);}catch(e){} };
        window.onMenuRestart = function(){ window.location.reload(); };
        window.onMenuBack = function(){ try{ window.unlockStageNext && window.unlockStageNext(3); }catch(e){} window.location.href = 'level-select.html'; };
    </script>
  </body>
</html>
