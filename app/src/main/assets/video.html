<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ویدیو لوگو</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #000000 !important;
      overflow: hidden;
      font-family: 'Vazirmatn', sans-serif;
    }
    #splash {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 10;
      background: #000000 !important;
      background-image: none !important;
      /* مخفی بودن ویدیو تا لحظه پخش قطعی اولین فریم */
      opacity: 0;
      transition: opacity 0.15s ease-in-out;
    }

    /* غیرفعال کردن و مخفی‌سازی کامل دکمه‌ها و منوهای اضافه روی ویدیو */
    #common-menu-open,
    #common-menu-overlay,
    #game-audio-toggle,
    #page-shell-badge,
    .common-menu-open-btn,
    .common-menu-overlay,
    .game-audio-toggle,
    .page-pill {
      display: none !important;
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }

    /* مخفی کردن دکمه پخش پیش‌فرض مرورگر */
    video::-webkit-media-controls,
    video::-webkit-media-controls-start-playback-button,
    video::-webkit-media-controls-overlay-play-button,
    video::-webkit-media-controls-play-button,
    video::-webkit-media-controls-enclosure {
      display: none !important;
      -webkit-appearance: none !important;
      opacity: 0 !important;
    }
  </style>
</head>
<body>
<video id="splash" 
       autoplay 
       muted 
       playsinline 
       webkit-playsinline 
       preload="auto" 
       poster="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
  <source src="videos/logo.mp4" type="video/mp4">
  مرورگر شما از تگ ویدیو پشتیبانی نمی‌کند.
</video>

<script src="scripts/common.js"></script>

<script>
  (function(){
    const v = document.getElementById('splash');
    let redirected = false;
    let fallbackTimer = null;

    // نمایش ویدیو فقط هنگام شروع قطعی پخش
    v.addEventListener('playing', () => {
      v.style.opacity = '1';
    });

    function cleanupUI() {
      const idsToHide = ['common-menu-open', 'common-menu-overlay', 'game-audio-toggle', 'page-shell-badge'];
      idsToHide.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.remove();
      });
    }

    function clearFallbackTimer() {
      if (fallbackTimer) {
        clearTimeout(fallbackTimer);
        fallbackTimer = null;
      }
    }

    function goIndex() {
      if (redirected) return;
      redirected = true;
      clearFallbackTimer();
      window.location.href = 'index.html';
    }

    function startPlayback() {
      if (redirected) return;
      cleanupUI();
      if (window.GameAudio) {
        window.GameAudio.unlockAudio();
        window.GameAudio.playPageTheme('ambient', 0.22);
      }
      const playPromise = v.play();
      if (playPromise && typeof playPromise.then === 'function') {
        playPromise.then(() => {
          clearFallbackTimer();
          fallbackTimer = window.setTimeout(goIndex, 10000);
        }).catch(error => {
          console.warn('Video playback start failed:', error);
          clearFallbackTimer();
          fallbackTimer = window.setTimeout(goIndex, 10000);
        });
      } else {
        clearFallbackTimer();
        fallbackTimer = window.setTimeout(goIndex, 10000);
      }
    }

    v.addEventListener('ended', goIndex);
    v.addEventListener('error', () => {
      console.warn('Video playback error; continuing after fallback timeout.');
      clearFallbackTimer();
      fallbackTimer = window.setTimeout(goIndex, 10000);
    });
    
    if (v.readyState >= 2) {
      startPlayback();
    } else {
      v.addEventListener('loadeddata', startPlayback);
    }

    document.addEventListener('DOMContentLoaded', cleanupUI);
    window.addEventListener('load', cleanupUI);

    window.addEventListener('pointerdown', startPlayback, { once: true });
    window.addEventListener('touchstart', startPlayback, { once: true });
    window.addEventListener('keydown', startPlayback, { once: true });

    startPlayback();
  })();
</script>
</body>
</html>
