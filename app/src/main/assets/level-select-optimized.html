<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>انتخاب مرحله</title>
    <style>
        :root { --accent:#06b6d4; --accent-2:#00d9ff; --accent-alt:#00ff88; --danger:#ff6b6b; --warning:#ffeb3b }
        *{ box-sizing:border-box; margin:0; padding:0 }
        body{ font-family:'Vazirmatn',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:radial-gradient(ellipse at bottom,#1B2735,#090A0F); color:#E0E0E0; overflow:hidden; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale }
        .content{ position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; padding:0.8rem; text-align:center }
        h1{ font-size:clamp(1.5rem,5vw,2rem); font-weight:800; color:#fff; margin-bottom:1.5rem; text-shadow:0 0 12px var(--accent-2) }
        .level-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(60px,1fr)); gap:0.8rem; width:100%; max-width:90vw; margin-bottom:1.5rem }
        .level-card{ aspect-ratio:1; background:linear-gradient(135deg,rgba(255,255,255,0.08),rgba(0,217,255,0.05)); border:2px solid rgba(0,217,255,0.3); border-radius:0.8rem; cursor:pointer; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:clamp(0.9rem,3vw,1.2rem); transition:all 0.3s; color:var(--accent) }
        .level-card:hover{ background:linear-gradient(135deg,rgba(0,217,255,0.15),rgba(0,217,255,0.1)); border-color:var(--accent-2); transform:scale(1.08) }
        .level-card.locked{ opacity:0.5; cursor:not-allowed; color:#666 }
        .level-card.completed{ border-color:var(--accent-alt); color:var(--accent-alt) }
        .back-btn{ position:absolute; bottom:1rem; left:1rem; padding:0.6rem 1.2rem; background:var(--accent); color:#000; border:none; border-radius:0.6rem; font-weight:600; cursor:pointer; font-size:clamp(0.9rem,2vw,1rem); transition:all 0.3s }
        .back-btn:hover{ transform:translateY(-2px); box-shadow:0 0 15px var(--accent) }
        .info{ position:absolute; bottom:1rem; right:1rem; font-size:clamp(0.8rem,2vw,0.95rem); color:#b0b5c0 }
        @media (max-height:600px){ .content { padding:0.5rem } h1 { margin-bottom:1rem } .level-grid { gap:0.6rem } }
    </style>
</head>
<body>
<div class="content">
    <h1>🎮 انتخاب مرحله</h1>
    <div class="level-grid" id="levelGrid"></div>
    <button class="back-btn" onclick="window.location.href='index.html'">← بازگشت</button>
    <div class="info">💫 تمام مراحل را تمام کنید</div>
</div>

<script src="audio-manager.js"></script>
<script src="common.js"></script>
<script>
const grid=document.getElementById('levelGrid');
const completed=parseInt(sessionStorage.getItem('lastCompletedStage')||'0');

for(let i=1;i<=10;i++){
    const card=document.createElement('div');
    card.className='level-card'+(i<=completed+1?'':' locked')+(i<=completed?' completed':'');
    card.textContent=`${i}`;
    
    if(i<=completed+1){
        card.style.cursor='pointer';
        card.onclick=()=>window.location.href=`stages/stage${i}-refactored.html`;
    }
    grid.appendChild(card);
}

try{
    if(sessionStorage.getItem('selectedCharacter')){document.body.style.opacity='1'}
}catch(e){}
</script>
</body>
</html>
