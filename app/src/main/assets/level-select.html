<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>انتخاب مرحله</title>
    <style>
        @font-face {
            font-family: 'Vazirmatn';
            src: url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-Regular.woff2') format('woff2');
            font-weight: normal; font-style: normal;
        }
        body {
            font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #000;
            color: #E0E0E0;
            margin: 0;
            overflow: hidden;
            background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
        }
        .content-wrapper {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1rem;
            box-sizing: border-box;
            text-align: center;
        }
        h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 2rem;
            text-shadow: 0 0 8px #00d9ff, 0 0 16px #00d9ff;
        }
        .level-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 1rem;
            width: 100%;
            max-width: 600px;
            margin-bottom: 2rem;
            direction: ltr;
        }
        .level-card {
            aspect-ratio: 1 / 1;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 1rem;
            text-decoration: none;
            color: #fff;
        }
        .level-card.locked {
            opacity: 0.5;
            cursor: default;
            pointer-events: auto;
            position: relative;
        }
        .level-card.locked::after {
            content: '\f023'; /* lock icon (will render as fallback text) */
            font-family: Arial, Helvetica, sans-serif;
            position: absolute;
            font-size: 1rem;
            right: 8px;
            top: 8px;
            color: rgba(255,255,255,0.7);
        }
        .level-card:hover {
            transform: scale(1.05);
            border-color: #00d9ff;
            box-shadow: 0 0 15px rgba(0, 217, 255, 0.5);
        }
        .level-number {
            font-size: 2rem;
            font-weight: bold;
        }
        .back-btn {
            background-color: transparent;
            color: #06b6d4;
            border: 2px solid #06b6d4;
            font-weight: 700;
            padding: 0.75rem 2rem;
            border-radius: 0.5rem;
            font-size: 1.125rem;
            transition: all 0.3s ease;
            text-decoration: none;
        }
        .back-btn:hover {
            background-color: #06b6d4;
            color: #fff;
        }
        @media (orientation: landscape) and (max-height: 500px) {
            h1 { font-size: 1.5rem; margin-bottom: 1rem; }
            .level-grid { grid-template-columns: repeat(5, 1fr); gap: 0.75rem; }
            .level-card { border-radius: 0.75rem; }
            .level-number { font-size: 1.5rem; }
            .back-btn { padding: 0.5rem 1.5rem; font-size: 1rem; }
        }
    </style>
</head>
<body>
<div class="content-wrapper">
    <header>
        <h1>انتخاب مرحله</h1>
    </header>
    <main>
        <div class="level-grid" id="level-grid-container">
            <!-- Levels will be inserted by JavaScript -->
        </div>
        <div style="margin-top:1rem; display:flex; gap:0.5rem; justify-content:center;">
            <button id="reset-progress" class="back-btn" style="background:transparent;">بازنشانی پیشرفت</button>
            <a href="index.html" class="back-btn">بازگشت</a>
        </div>
    </main>
</div>

<script>
    try {
        document.addEventListener('DOMContentLoaded', function() {
            const levelGrid = document.getElementById('level-grid-container');
            if (!levelGrid) {
                console.error("Level grid container not found!");
                return;
            }
            const totalLevels = 10;
            const unlocked = parseInt(localStorage.getItem('unlockedLevel') || '1', 10) || 1;

            levelGrid.innerHTML = ''; // Clear any existing content

            for (let i = 1; i <= totalLevels; i++) {
                const levelCard = document.createElement('a');
                levelCard.className = 'level-card';
                levelCard.innerHTML = `<span class="level-number">${i}</span>`;

                if (i <= unlocked) {
                    levelCard.href = `stage${i}.html`;
                } else {
                    levelCard.href = '#';
                    levelCard.classList.add('locked');
                    levelCard.addEventListener('click', (e) => {
                        e.preventDefault();
                        // simple inline message for locked level
                        alert('این مرحله هنوز باز نشده است. ابتدا مراحل قبلی را کامل کنید.');
                    });
                }

                levelGrid.appendChild(levelCard);
            }

            // Reset progress button
            const resetBtn = document.getElementById('reset-progress');
            if(resetBtn){
                resetBtn.addEventListener('click', () => {
                    if(confirm('آیا مطمئنید که می‌خواهید پیشرفت را بازنشانی کنید؟')){
                        localStorage.setItem('unlockedLevel', '1');
                        location.reload();
                    }
                });
            }
        });
    } catch (e) {
        console.error("A critical error occurred in the level select script:", e);
        const container = document.getElementById('level-grid-container');
        if(container) {
            container.innerHTML = '<p style="color: red; width: 100%;">خطا در بارگذاری مراحل!</p>';
        }
    }
</script>
<!-- audio manager and shared scripts -->
<script src="audio-manager.js"></script>
<script>
    try{
        if(window.AM){
            window.AM.init({
                assets: {
                    music: {
                        level_select_bgm: 'level_select_loop.wav',
                        menu_bgm: 'menu_bgm_loop.wav',
                        ambient_space: 'ambient_space_loop.wav'
                    },
                    sfx: {
                        click: 'sfx_ui_click.wav',
                        select: 'sfx_ui_select.wav',
                        hover: 'sfx_button_hover.wav',
                        locked: 'sfx_ui_locked.wav'
                    }
                },
                autoplay: true,
                defaultMusic: 'level_select_bgm'
            });
            const selectPlaylist = ['level_select_bgm', 'menu_bgm', 'ambient_space'];
            const startSelectMusic = () => { try{ window.AM.ensurePlayback(selectPlaylist, { rotateMs: 60000, intervalMs: 1200, durationMs: 90000 }); }catch(e){} };
            document.addEventListener('click', function once(){ startSelectMusic(); document.removeEventListener('click', once); }, { once: true });
            document.addEventListener('touchstart', function once(){ startSelectMusic(); document.removeEventListener('touchstart', once); }, { once: true, passive: true });
            document.addEventListener('pointerdown', function once(){ startSelectMusic(); document.removeEventListener('pointerdown', once); }, { once: true, passive: true });
            document.addEventListener('keydown', function once(){ startSelectMusic(); document.removeEventListener('keydown', once); }, { once: true });
            document.addEventListener('mousemove', function once(){ startSelectMusic(); document.removeEventListener('mousemove', once); }, { once: true, passive: true });
            setTimeout(startSelectMusic, 800);
            window.addEventListener('load', startSelectMusic, { once: true });
            setTimeout(startSelectMusic, 800);
            window.addEventListener('load', startSelectMusic, { once: true });
        }
    }catch(e){ console.warn(e); }

        setTimeout(()=>{ try{ window.AM && window.AM.startPlaylist(['level_select_bgm','menu_bgm','ambient_space'],60000); }catch(e){} }, 1500);
</script>
<script src="common.js"></script>
</body>
</html>
