    function drawCharacter(c, type) {
        let state = c.isJumping ? 'jump' : (c.velocityX !== 0 ? 'walk' : 'idle');
        let hasGun = c.hasGun || (type === 'player' && player.hasGun);
        let imgKey = (type === 'player' && hasGun) ? `player_${state}` : 'teammate_idle';
        let img = assets[imgKey];

        ctx.save();
        if (c.invincibleTimer > 0 && Math.floor(c.invincibleTimer / 6) % 2 === 0) {
            ctx.globalAlpha = 0.4;
        }

        if (c.lastDirection === 'left') {
            ctx.scale(-1, 1);
            if (img && img.complete) {
                ctx.drawImage(img, -c.x - c.width, c.y, c.width, c.height);
            } else {
                ctx.fillStyle = (type === 'player') ? 'blue' : 'green';
                ctx.fillRect(-c.x - c.width, c.y, c.width, c.height);
            }
        } else {
            if (img && img.complete) {
                ctx.drawImage(img, c.x, c.y, c.width, c.height);
            } else {
                ctx.fillStyle = (type === 'player') ? 'blue' : 'green';
                ctx.fillRect(c.x, c.y, c.width, c.height);
            }
        }
        ctx.restore();
    }

    function drawEnemy(e) {
        let imgKey = 'alien_zombie';
        if (e.type === 'flyer') imgKey = 'enemy_flyer';
        else if (e.type === 'splitter') imgKey = 'enemy_splitter';

        let img = assets[imgKey];
        let color = 'red';
        if (e.type === 'flyer') color = '#ff00ff';
        else if (e.type === 'splitter') color = '#FFA500';

        if (img && img.complete) {
            ctx.save();
            if(e.direction < 0) {
                ctx.scale(-1, 1);
                ctx.drawImage(img, -e.x - e.width, e.y, e.width, e.height);
            } else {
                ctx.drawImage(img, e.x, e.y, e.width, e.height);
            }
            ctx.restore();
        } else {
            ctx.fillStyle = color;
            ctx.fillRect(e.x, e.y, e.width, e.height);
        }
        // نوار سلامتی
        ctx.fillStyle = '#333';
        ctx.fillRect(e.x, e.y - 10, e.width, 5);
        ctx.fillStyle = '#ff4d4d';
        ctx.fillRect(e.x, e.y - 10, e.width * (e.health / e.maxHealth), 5);
        // hearts above enemy
        try{
            ctx.fillStyle = 'white';
            ctx.font = '12px Vazirmatn';
            ctx.textAlign = 'center';
            ctx.fillText(formatHearts(e.health, e.maxHealth), e.x + e.width/2, e.y - 18);
        }catch(e){}
    }

    function drawItem(item) {
        let imgKey = (item.type === 'equipment') ? 'equipment_cache' : (item.type === 'health' ? 'health_pack' : 'ammo_pack');
        let img = assets[imgKey];
        let color = (item.type === 'equipment') ? '#00ffc3' : (item.type === 'health' ? '#00ff00' : '#ffff00');

        // (نور توسط سیستم نورپردازی انجام می‌شود)
        if (img && img.complete) {
            ctx.drawImage(img, item.x, item.y, item.width, item.height);
        } else {
            ctx.fillStyle = color;
            ctx.fillRect(item.x, item.y, item.width, item.height);
        }
    }

    function drawBullet(b) {
        if (b.owner === 'enemy') {
            ctx.fillStyle = '#ff4d4d';
        } else {
            ctx.fillStyle = '#00ffc3';
        }
        ctx.fillRect(b.x, b.y, b.width, b.height);
    }

    // (drawParticle توسط ParticleManager انجام می‌شود)

    // ===================================================================================
    // بخش ۱۳: توابع کمکی و سیستم‌ها (بازنویسی شده)
    // ===================================================================================

    function isColliding(rect1, rect2) {
        if (!rect1 || !rect2) return false;
        return rect1.x < rect2.x + (rect2.width || 0) &&
               rect1.x + (rect1.width || 0) > rect2.x &&
               rect1.y < rect2.y + (rect2.height || 0) &&
               rect1.y + (rect1.height || 0) > rect2.y;
    }

    // Helper: check whether a teammate would fall if it moves one step in the given direction
    function willFallIfMove(tm, dirSign) {
        try{
            // probe a point slightly ahead of the teammate's feet
            const probeX = tm.x + (dirSign > 0 ? tm.width + 8 : -8);
            const probeY = tm.y + tm.height + 4; // slightly below feet

            // if there is any platform directly under probeX within a reasonable vertical distance, it's safe
            for (let p of platforms) {
                if (!p) continue;
                if (probeX >= p.x && probeX <= p.x + p.width) {
                    // platform top is p.y; if it's not far below the probe point, consider safe
                    if (p.y - probeY < 80) return false; // safe (platform close enough)
                }
            }
            return true; // no platform found ahead
        }catch(e){ return false; }
    }

    function showFloatingDialogue(key, text, duration) {
        let elem = dialogueElements[key];
        if (!elem) return;

        let target;
        if (key === 'blocker') target = player;
        else target = teammates.find(t => t.name.toLowerCase().includes(key));
        if (!target) target = player;

        elem.innerText = text;
        elem.style.display = 'block';

        function updatePosition() {
            if (elem.style.display !== 'block') return;
            let x = (target.x + target.width / 2) - camera.x;
            let y = target.y - 60;
            elem.style.left = `${x}px`;
            elem.style.top = `${y}px`;
            requestAnimationFrame(updatePosition);
        }
        updatePosition();

        setTimeout(() => {
            elem.style.display = 'none';
        }, duration);
    }

    // (createParticles توسط ParticleManager جایگزین شد)

    function triggerCameraShake(intensity, time) {
        camera.shakeIntensity = Math.max(camera.shakeIntensity, intensity); // لرزش‌های قوی‌تر جایگزین ضعیف‌تر می‌شوند
        camera.shakeTime = Math.max(camera.shakeTime, time);
    }

    // [FEATURE] توقف بازی برای افکت ضربه
    function triggerHitStop() {
        hitStopTimer = CONSTANTS.HIT_STOP_DURATION;
    }

    /**
     * [FEATURE] تابع متمرکز برای آسیب زدن به بازیکن
     */
    function dealPlayerDamage(amount, source) {
        if (player.health <= 0) return; // قبلا مرده

        player.health -= amount;
        player.invincibleTimer = 120; // ۲ ثانیه مصونیت
        triggerCameraShake(10, 15);
        particleManager.createBurst(player.x + player.width/2, player.y + player.height/2, 15, 'blood');
        audioManager.playSound('snd_player_hit', 1, 0);

        if (player.health < 2 && player.health > 0) {
            playerUI.classList.add('danger');
        } else {
            playerUI.classList.remove('danger');
        }

        if (player.health <= 0) {
            player.health = 0;
            showEndMessage("شکست خوردی!", true, () => {
                // ریست کردن مرحله پس از مرگ
                gameState = 'DIALOGUE_HUB';
                saveManager.loadGame(); // بارگذاری مجدد مهارت‌ها
                setupWorld('DIALOGUE_HUB');
                gamePaused = false;
            });
            particleManager.createBurst(player.x + player.width/2, player.y + player.height/2, 50, 'explosion');
        }

        // render hearts with support for half-hearts
        try{ healthUI.innerHTML = `سلامتی: ${formatHearts(player.health, player.maxHealth)}`; }catch(e){ healthUI.innerHTML = `سلامتی: ${player.health}`; }
    }

    // playFinalVideo(videoKey, shouldUnlock=false)
    function playFinalVideo(videoKey, shouldUnlock = false) {
        videoShouldUnlock = !!shouldUnlock;
        gamePaused = true;
        gameState = 'VIDEO';
        gameWrapper.style.display = 'none';
        controls.style.display = 'none';
        videoOverlay.style.display = 'flex';
        audioManager.stopMusic();

        let video = assets[videoKey];
        if (video && video.src) {
            if (window.playStageVideo) {
                try { window.playStageVideo(video.src); } catch(e) { console.warn(e); videoPlayer.src = video.src; videoPlayer.play(); }
            } else {
                videoPlayer.src = video.src;
                videoPlayer.play();
            }
        } else {
            console.error(`Video not found: ${videoKey}`);
            // if video not found, follow the non-unlock path for safety
            if (videoShouldUnlock) goToNextStep(); else goToLevelSelect();
        }
    }

    function showEndMessage(text, isGameOver, callback) {
        gamePaused = true;
        endMessageText.innerText = text;
        endMessageBox.style.display = 'block';

        endMessageBtn.onclick = () => {
            endMessageBox.style.display = 'none';
            if (isGameOver) {
                // در صورت شکست، تابع callback (که ریست کننده مرحله است) اجرا می‌شود
                if(callback) callback();
            } else if (callback) {
                // در صورت موفقیت (مثل پایان دوستی)، تابع callback (رفتن به منو) اجرا می‌شود
                callback();
            }
        };
    }

    // [USER-REQ] تابع جدید برای رفتن به منوی انتخاب مرحله
    function goToLevelSelect() {
        window.location.href = '../level-select.html';
    }

    // [USER-REQ] تابع قدیمی اکنون به تابع جدید اشاره می‌کند
    function goToNextStep() {
        try{ window.unlockStageNext && window.unlockStageNext(9); }catch(e){}
        try{
            const key = 'unlockedLevel';
            const existing = parseInt(localStorage.getItem(key) || '1', 10) || 1;
            const next = Math.max(existing, 9 + 1);
            localStorage.setItem(key, String(next));
        }catch(e){}
        goToLevelSelect();
    }

    // [FIX] تابع جدید برای نمایش مودال تایید
    function showConfirmation(text, onConfirm) {
        confirmText.innerText = text;
        currentConfirmCallback = onConfirm;
        confirmModal.style.display = 'flex';
        // بازی از قبل در مودال مهارت یا منوی همبرگری متوقف شده است
        // اما اگر جای دیگری استفاده شود، این خط لازم است:
        // gamePaused = true;
    }


    // ===================================================================================
    // بخش ۱۴: [FEATURE] منطق درخت مهارت (Skill Tree)
    // ===================================================================================

    function addXP(amount) {
        if (gameState !== 'PLAYING_FRIENDSHIP') return;

        // اعمال بونوس XP
        let gainMultiplier = 1 + (skillTree['xp_gain'].level * 0.1);
        player.xp += Math.round(amount * gainMultiplier);

        checkLevelUp();
        updateXPUI();
    }

    function checkLevelUp() {
        while (player.xp >= CONSTANTS.XP_TO_LEVEL_UP) {
            player.level++;
            player.xp -= CONSTANTS.XP_TO_LEVEL_UP;
            player.skillPoints++;
            // (افکت لول آپ)
            particleManager.createBurst(player.x + player.width/2, player.y + player.height/2, 40, 'pickup');
            // در آینده CONSTANTS.XP_TO_LEVEL_UP را سخت‌تر کن
        }
    }

    function updateXPUI() {
        let percent = (player.xp / CONSTANTS.XP_TO_LEVEL_UP) * 100;
        xpBar.style.width = `${percent}%`;
        skillPointsUI.innerText = `امتیاز مهارت: ${player.skillPoints}`;
        skillPointsModalUI.innerText = `امتیاز: ${player.skillPoints}`;
    }

    function openSkillTree() {
        if (gameState === 'SKILL_TREE') return;

        // توقف موقت بازی
        gamePaused = true;
        let oldState = gameState;
        gameState = 'SKILL_TREE';
        controls.style.display = 'none'; // مخفی کردن کنترل‌ها

        renderSkillTree();
        skillTreeModal.style.display = 'flex';
        updateXPUI(); // اطمینان از به‌روز بودن امتیازها

        // بازگرداندن وضعیت قبلی هنگام بستن
        skillTreeCloseBtn.onclick = () => {
             closeSkillTree(oldState);
        };
    }

    function closeSkillTree(previousState) {
        skillTreeModal.style.display = 'none';
        gameState = previousState; // بازگشت به وضعیت قبلی
        gamePaused = false;
        controls.style.display = 'flex'; // نمایش مجدد کنترل‌ها
        saveManager.saveGame(); // ذخیره تغییرات
    }

    function renderSkillTree() {
        skillTreeList.innerHTML = ''; // پاک کردن لیست قبلی

        for (const key in skillTree) {
            const skill = skillTree[key];
            const canAfford = player.skillPoints >= skill.cost;
            const isMaxLevel = skill.level >= skill.maxLevel;
            const isDisabled = skill.disabled || false;

            let levelFill = (skill.level / skill.maxLevel) * 100;

            const row = document.createElement('div');
            row.className = 'skill-row';
            row.innerHTML = `
                <div class="skill-info">
                    <strong>${skill.name}</strong> (سطح ${skill.level}/${skill.maxLevel})
                    <small>${skill.desc}</small>
                    <div class="skill-level-bar">
                        <div class="skill-level-fill" ></div>
                    </div>
                </div>
                <button class="skill-buy-btn" data-skill-key="${key}" ${isDisabled || isMaxLevel || !canAfford ? 'disabled' : ''}>
                    ${isDisabled ? 'قفل' : (isMaxLevel ? 'MAX' : `خرید (${skill.cost})`)}
                </button>
            `;
            skillTreeList.appendChild(row);
        }

        // افزودن ایونت لیسنر به دکمه‌های خرید
        skillTreeList.querySelectorAll('.skill-buy-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                buySkill(btn.dataset.skillKey);
            });
        });
    }

    function buySkill(key) {
        const skill = skillTree[key];
        if (!skill || skill.level >= skill.maxLevel || player.skillPoints < skill.cost || skill.disabled) {
            return; // امکان خرید نیست
        }

        player.skillPoints -= skill.cost;
        skill.level++;

        console.log(`Skill purchased: ${key}, New Level: ${skill.level}`);

        // اعمال فوری تغییرات
        saveManager.applyLoadedStats();

        // رندر مجدد UI
        renderSkillTree();
        updateXPUI();
    }


    // ===================================================================================
    // بخش ۱۵: کنترلرها و Event Listeners (بازنویسی شده)
    // ===================================================================================

    function setupEventListeners() {
        const addTouchListeners = (btn, key) => {
            btn.addEventListener('touchstart', e => { e.preventDefault(); keys[key] = true; }, { passive: false });
            btn.addEventListener('touchend', e => { e.preventDefault(); keys[key] = false; }, { passive: false });
        };
        addTouchListeners(leftBtn, 'left');
        addTouchListeners(rightBtn, 'right');
        addTouchListeners(jumpBtn, 'jump');
        addTouchListeners(shootBtn, 'shoot');
        addTouchListeners(specialActionBtn, 'special');

        // [FEATURE] ایونت‌های درخت مهارت
        skillTreeBtn.addEventListener('touchstart', e => {
            e.preventDefault();
            openSkillTree();
        }, { passive: false });

        // skillTreeCloseBtn در openSkillTree مدیریت می‌شود

        // [FIX] استفاده از مودال تایید برای ریست سیو
        resetSaveBtn.addEventListener('click', () => {
            showConfirmation("آیا مطمئن هستید که می‌خواهید تمام پیشرفت مهارت‌ها را پاک کنید؟", () => {
                saveManager.resetSave();
            });
        });

        // [FIX] ایونت‌های مودال تایید
        confirmYesBtn.addEventListener('click', () => {
            if (currentConfirmCallback) {
                currentConfirmCallback();
            }
            confirmModal.style.display = 'none';
            // بازی در مودال مهارت متوقف می‌ماند اگر باز باشد
            if (gameState !== 'SKILL_TREE') gamePaused = false;
        });

        confirmNoBtn.addEventListener('click', () => {
            confirmModal.style.display = 'none';
            if (gameState !== 'SKILL_TREE') gamePaused = false;
        });


        // common menu integration: common.js will call window.onMenuOpen / onMenuContinue / onMenuRestart / onMenuBack
        window.onMenuOpen = window.onMenuOpen || function(){ gamePaused = true; controls.style.display = 'none'; };
        window.onMenuContinue = window.onMenuContinue || function(){ controls.style.display = 'flex'; gamePaused = false; };
        window.onMenuRestart = window.onMenuRestart || function(){ saveManager.loadGame(); setupWorld('DIALOGUE_HUB'); gamePaused = false; };
        window.onMenuBack = window.onMenuBack || function(){ try{ window.unlockStageNext && window.unlockStageNext(9);}catch(e){} window.location.href = '../level-select.html'; };


        // Decide what to do when a video ends based on the last playFinalVideo(...) call
        videoPlayer.addEventListener('ended', function(){
            if (window.shouldAutoExitOnVideoEnd !== true) return;
            try{
                if (videoShouldUnlock) {
                    goToNextStep();
                } else {
                    goToLevelSelect();
                }
            }catch(e){
                console.error(e);
                goToLevelSelect();
            }
        });

        // ری‌سایز کردن هر دو کانواس
        window.addEventListener('resize', () => {
            if (gameState !== 'LOADING' && gameState !== 'VIDEO') {
                setupWorld(gameState);
            }
        });
    }

    // ===================================================================================
    // بخش ۱۶: شروع بازی
    // ===================================================================================

    window.onload = () => {
        // [FEATURE] مقداردهی اولیه موتورها
        audioManager = new AudioManager();
        saveManager = new SaveManager();

                // ۱. بارگذاری سیو بازی (برای اعمال مهارت‌ها)
                // include common menu
                (function(){
                    const s=document.createElement('script'); s.src='../scripts/common.js'; document.body.appendChild(s);
                    s.onload = function(){
                        window.onMenuContinue = window.onMenuContinue || function(){ gamePaused = false; };
                        window.onMenuRestart = window.onMenuRestart || function(){ window.location.reload(); };
                        window.onMenuBack = window.onMenuBack || function(){ try{ window.unlockStageNext && window.unlockStageNext(9);}catch(e){} window.location.href='../level-select.html'; };
                    };
                })();
        saveManager.loadGame();

        // ۲. بارگذاری دارایی‌ها
        loadAssets(() => {
            // ۳. شروع بازی
            loadingScreen.style.display = 'none';
            gameWrapper.style.display = 'block';
            controls.style.display = 'flex';
            gameState = 'DIALOGUE_HUB';
            setupWorld('DIALOGUE_HUB');
            setupEventListeners();
            gamePaused = false;
            gameLoop();
        });
    };

</script>

<script src="../scripts/common.js"></script>
