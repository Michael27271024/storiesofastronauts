<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مرحله ۹: نسخه حماسی (V3.1)</title>
    <link rel="stylesheet" href="../styles/common.css">
    <style>
        /*
            مرحله ۹: نسخه کامل گیم‌پلی (V3.1 - The Story Update)
            توسعه دهنده: جمینای برای اوستا حسن زاده

            =======================================================================
            === توضیحات نسخه ۳.۱ - اعمال درخواست‌های کاربر ===
            =======================================================================

            - [USER-REQ] افزایش روشنایی: AMBIENT_LIGHT از 0.85 به 0.65 کاهش یافت.
            - [USER-REQ] منوی همبرگری: یک منوی توقف (Pause Menu) با گزینه‌های ادامه،
              ری‌استارت و بازگشت به منوی انتخاب مرحله اضافه شد.
            - [USER-REQ] مسیر دوستی: به جای پخش ویدیو، اکنون داستان تعریف می‌شود
              و سپس به level-select.html می‌رود.
            - [USER-REQ] مسیر خیانت: پس از اتمام ویدیو به level-select.html می‌رود.
            - [FIX] جایگزینی confirm(): تابع confirm() جاوااسکریپت با یک مودال
              سفارشی (Custom Modal) جایگزین شد تا از خطاهای محیطی جلوگیری شود.
        */

        @font-face {
            font-family: 'Vazirmatn';
            src: url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-Regular.woff2') format('woff2');
            font-weight: normal; font-style: normal;
        }
        body, html {
            margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%;
            background-color: #000; font-family: 'Vazirmatn', sans-serif; color: white;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }
        .game-wrapper {
            position: relative; width: 100%; height: 100%;
            background-color: #000; /* پس زمینه سیاه برای نورپردازی */
        }
        canvas {
            display: block; width: 100%; height: 100%;
            position: absolute; top: 0; left: 0;
        }
        #gameCanvas {
            z-index: 10;
            background-color: transparent; /* کانواس اصلی شفاف است */
        }
        #lightingCanvas {
            z-index: 20; /* کانواس نورپردازی بالای بازی قرار میگیرد */
            pointer-events: none; /* اجازه عبور کلیک‌ها */
            background-color: transparent;
        }

        /* --- لودینگ --- */
        #loading-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000; z-index: 3000; display: flex;
            justify-content: center; align-items: center; text-align: center;
            flex-direction: column; gap: 20px;
        }
        .loader {
            width: 50px; height: 50px; border: 5px solid #333;
            border-top: 5px solid #00ffc3; /* رنگ فسفری عطارد */
            border-radius: 50%; animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* --- ویدیو --- */
        #video-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000; z-index: 4000; display: none;
            justify-content: center; align-items: center;
        }
        #video-player {
             width: 100%; height: 100%; object-fit: cover;
        }

        /* --- UI --- */
        .ui-container {
            position: absolute; top: 15px; left: 15px; color: white;
            font-size: 1.1rem; text-shadow: 2px 2px 4px black; z-index: 50;
            background-color: rgba(0, 10, 20, 0.8); padding: 10px;
            border-radius: 8px; border: 1px solid #00ffc3;
            display: flex; flex-direction: column; gap: 5px;
            transition: box-shadow 0.2s;
        }
        .ui-container.danger {
            box-shadow: 0 0 15px 3px rgba(255, 0, 0, 0.7);
        }
        #objective-ui {
            position: absolute; top: 15px; right: 15px; color: #00ffc3;
            font-size: 1.1rem; text-shadow: 1px 1px 3px black; z-index: 50;
            background-color: rgba(0, 10, 20, 0.8); padding: 10px;
            border-radius: 8px; border: 1px solid #00ffc3;
            max-width: 50%; text-align: left;
        }
        /* [FEATURE] نوار XP */
        #xp-ui {
            width: 150px; height: 10px; background-color: #333;
            border: 1px solid #888; border-radius: 5px;
            margin-top: 5px;
        }
        #xp-bar {
            width: 0%; height: 100%; background-color: #ff00ff;
            border-radius: 5px; transition: width 0.3s;
        }
        #skill-points-ui {
            color: #ff00ff; font-weight: bold;
        }

        @keyframes batteryPulse {
            0% { box-shadow: 0 0 5px #ffff99; }
            50% { box-shadow: 0 0 15px 5px #ffff99; }
            100% { box-shadow: 0 0 5px #ffff99; }
        }
        #battery-ui.ready {
            animation: batteryPulse 1.5s infinite;
            color: #ffff99;
            border-color: #ffff99;
        }

        /* --- دیالوگ‌های شناور --- */
        .floating-dialogue {
            position: absolute;
            background-color: rgba(0, 10, 20, 0.9);
            border: 1px solid #00ffc3;
            border-radius: 8px;
            padding: 10px 15px;
            font-size: 0.9rem;
            z-index: 100;
            display: none;
            transform: translateX(-50%);
            text-align: center;
            max-width: 200px;
            box-shadow: 0 0 15px rgba(0, 255, 195, 0.3);
            pointer-events: none;
        }

        /* --- کنترل‌ها (دکمه‌های حماسی‌تر) --- */
        .controls-container {
            position: absolute; bottom: 15px; left: 15px; right: 15px;
            display: flex; justify-content: space-between; align-items: flex-end;
            user-select: none; -webkit-user-select: none; pointer-events: none;
            z-index: 100;
        }
        .control-group {
            display: flex; align-items: flex-end; gap: 10px; pointer-events: auto;
        }
        .control-btn {
            width: 60px; height: 60px;
            background: radial-gradient(circle, rgba(0, 255, 195, 0.3) 0%, rgba(0, 100, 80, 0.2) 100%);
            border: 2px solid #00ffc3;
            border-radius: 50%; display: flex;
            align-items: center; justify-content: center;
            font-size: 24px; color: white;
            transition: background-color 0.1s, transform 0.1s, box-shadow 0.1s;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5), inset 0 0 5px rgba(0, 255, 195, 0.2);
            text-shadow: 0 0 5px #00ffc3;
        }
        .control-btn:active {
            background: radial-gradient(circle, rgba(0, 255, 195, 0.5) 0%, rgba(0, 100, 80, 0.4) 100%);
            transform: scale(0.95);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.5), inset 0 0 10px rgba(0, 255, 195, 0.5);
        }

        /* دکمه‌های ویژه */
        #special-action-btn {
            width: 75px; height: 75px;
            background-color: rgba(255, 255, 100, 0.15);
            border: 2px solid #ffff99;
            font-size: 28px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5), inset 0 0 5px rgba(255, 255, 150, 0.2);
            text-shadow: 0 0 5px #ffff99;
        }
        #special-action-btn:active { background-color: rgba(255, 255, 100, 0.4); }

        /* [FEATURE] دکمه درخت مهارت */
        #skill-tree-btn {
            width: 50px; height: 50px; font-size: 20px;
            position: absolute;
            top: 15px; right: calc(50% - 25px);
            z-index: 100;
            background-color: rgba(255, 0, 255, 0.15);
            border: 2px solid #ff00ff;
            color: #ff00ff;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5), inset 0 0 5px rgba(255, 0, 255, 0.2);
            text-shadow: 0 0 5px #ff00ff;
            display: none; /* در ابتدا مخفی */
            pointer-events: auto;
        }
        #skill-tree-btn:active { background-color: rgba(255, 0, 255, 0.4); }


        /* --- پیام پایان --- */
        .end-message-box {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background-color: rgba(0, 10, 20, 0.95); padding: 25px;
            border-radius: 15px; border: 2px solid #00ffc3; text-align: center;
            color: white; z-index: 2000; display: none; max-width: 90%;
            box-shadow: 0 0 20px rgba(0, 255, 195, 0.5);
            max-height: 80vh; overflow-y: auto; /* برای داستان طولانی */
        }
        .end-message-btn {
            padding: 10px 30px; font-size: 1.1rem; background-color: #00ffc3;
            border: none; color: #0a0f1a; border-radius: 8px;
            margin-top: 20px; cursor: pointer;
        }

        /* --- [FEATURE] مودال درخت مهارت --- */
        #skill-tree-modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 2500;
            display: none; /* در ابتدا مخفی */
            justify-content: center;
            align-items: center;
            color: white;
            backdrop-filter: blur(5px);
        }
        .skill-tree-content {
            background-color: rgba(10, 20, 30, 0.95);
            border: 2px solid #ff00ff;
            border-radius: 15px;
            padding: 20px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 0 30px rgba(255, 0, 255, 0.5);
        }
        .skill-tree-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #ff00ff; padding-bottom: 10px; margin-bottom: 20px;
        }
        #skill-tree-close-btn {
            background: #ff00ff; color: black; border: none; border-radius: 50%;
            width: 30px; height: 30px; font-size: 18px; cursor: pointer;
        }
        .skill-row {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px; border-radius: 8px;
        }
        .skill-info {
            flex-grow: 1;
        }
        .skill-info small {
            color: #aaa; display: block;
        }
        .skill-level-bar {
            width: 100px; height: 10px; background: #333;
            border-radius: 5px; overflow: hidden;
            border: 1px solid #555;
        }
        .skill-level-fill {
            width: 0%; height: 100%; background: #ff00ff;
        }
        .skill-buy-btn {
            background: #ff00ff; color: black; border: none;
            border-radius: 5px; padding: 8px 12px;
            font-size: 1rem; cursor: pointer;
            min-width: 60px;
        }
        .skill-buy-btn:disabled {
            background: #555; color: #888; cursor: not-allowed;
        }
        #reset-save-btn {
            background: #ff4d4d; color: white; border: none;
            border-radius: 5px; padding: 8px 12px;
            font-size: 0.9rem; cursor: pointer; margin-top: 20px;
        }

        /* per-stage hamburger/menu CSS removed — use common.css & common.js for unified menu */

        /* --- [FIX] مودال تایید (جایگزین confirm()) --- */
        #confirm-modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 2700; /* بالاتر از همه چیز */
            display: none; /* در ابتدا مخفی */
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }
        .confirm-content {
            background-color: rgba(10, 20, 30, 0.95);
            border: 2px solid #ff4d4d;
            border-radius: 15px;
            padding: 20px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.5);
        }
        #confirm-text {
            margin-bottom: 20px;
            font-size: 1.1rem;
        }
        .confirm-btn-group {
            display: flex;
            justify-content: space-around;
            gap: 15px;
        }
        .confirm-btn {
            flex-grow: 1;
            padding: 10px;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        #confirm-yes-btn {
            background-color: #ff4d4d;
            color: white;
        }
        #confirm-no-btn {
            background-color: #555;
            color: white;
        }

    </style>
</head>
<body>

<div id="loading-screen"><div class="loader"></div><p>در حال بارگذاری مرحله ۹ (نسخه حماسی)...</p></div>

<div id="video-overlay"><video poster="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" id="video-player" playsinline></video></div>

<div class="game-wrapper" id="game-wrapper" >

    <div class="ui-container" id="player-ui">
        <div id="health-ui">سلامتی: ❤️❤️❤️❤️❤️</div>
        <div id="ammo-ui">مهمات: ---</div>
        <div id="battery-ui">سپر باتری: 🔋 (آماده نیست)</div>
        <!-- [FEATURE] UI درخت مهارت -->
        <div id="skill-points-ui">امتیاز مهارت: 0</div>
        <div id="xp-ui"><div id="xp-bar"></div></div>
    </div>

    <!-- per-stage hamburger button removed; common menu open control provided by common.js -->
    <!-- objective-ui به زیر دکمه منو منتقل شد تا تداخل نکند -->
    <div id="objective-ui" >هدف: با اعضای تیم صحبت کن</div>


    <canvas id="gameCanvas"></canvas>
    <!-- [FEATURE] کانواس نورپردازی -->
    <canvas id="lightingCanvas"></canvas>

    <!-- دیالوگ‌های شناور برای شخصیت‌ها -->
    <div id="dialogue-sohrab" class="floating-dialogue"></div>
    <div id="dialogue-rostam" class="floating-dialogue"></div>
    <div id="dialogue-dariush" class="floating-dialogue"></div>
    <div id="dialogue-blocker" class="floating-dialogue"></div>

    <div class="end-message-box" id="end-message-box">
        <p id="end-message-text" ></p>
        <button id="end-message-btn" class="end-message-btn">ادامه</button>
    </div>
</div>

<!-- [FEATURE] مودال درخت مهارت -->
<div id="skill-tree-modal">
    <div class="skill-tree-content">
        <div class="skill-tree-header">
            <h2>درخت مهارت</h2>
            <h3 id="skill-points-modal-ui">امتیاز: 0</h3>
            <button id="skill-tree-close-btn">&times;</button>
        </div>
        <div id="skill-tree-list">
            <!-- مهارت‌ها به صورت داینامیک اینجا رندر می‌شوند -->
        </div>
        <button id="reset-save-btn">ریست کردن سیو</button>
    </div>
</div>

<!-- per-stage pause menu removed; unified common menu will be used instead -->

<!-- [FIX] مودال تایید -->
<div id="confirm-modal">
    <div class="confirm-content">
        <p id="confirm-text">آیا مطمئن هستید؟</p>
        <div class="confirm-btn-group">
            <button class="confirm-btn" id="confirm-no-btn">خیر</button>
            <button class="confirm-btn" id="confirm-yes-btn">بله</button>
        </div>
    </div>
</div>


<div class="controls-container" id="controls" >
    <div class="control-group actions">
        <button class="control-btn" id="shoot-btn" >&#x25CE;</button>
        <button class="control-btn" id="special-action-btn" >🛡️</button>
        <button class="control-btn" id="jump-btn">&#x25B2;</button>
    </div>
    <!-- [FEATURE] دکمه مهارت -->
    <button class="control-btn" id="skill-tree-btn" >مهارت</button>
    <div class="control-group movement">
        <button class="control-btn" id="right-btn">&#x25B6;</button>
        <button class="control-btn" id="left-btn">&#x25C0;</button>
    </div>
</div>

<script>
    // ===================================================================================
    // بخش ۱: مقداردهی اولیه و دریافت عناصر DOM
    // ===================================================================================
    console.log("Stage 9 (Epic Update - V3.1) Initializing...");

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const gameWrapper = document.getElementById('game-wrapper');
    const loadingScreen = document.getElementById('loading-screen');
    const controls = document.getElementById('controls');
    const videoOverlay = document.getElementById('video-overlay');
    const videoPlayer = document.getElementById('video-player');

    // controls which determine whether the video end should unlock the next level
    let videoShouldUnlock = false;

    // [FEATURE] کانواس نورپردازی
    const lightingCanvas = document.getElementById('lightingCanvas');
    const lightCtx = lightingCanvas.getContext('2d');

    // UI
    const playerUI = document.getElementById('player-ui');
    const healthUI = document.getElementById('health-ui');
    const ammoUI = document.getElementById('ammo-ui');
    const batteryUI = document.getElementById('battery-ui');
    const objectiveUI = document.getElementById('objective-ui');
    const skillPointsUI = document.getElementById('skill-points-ui');
    const xpBar = document.getElementById('xp-bar');

    // Floating Dialogues
    const dialogueElements = {
        sohrab: document.getElementById('dialogue-sohrab'),
        rostam: document.getElementById('dialogue-rostam'),
        dariush: document.getElementById('dialogue-dariush'),
        blocker: document.getElementById('dialogue-blocker')
    };

    // Controls
    const shootBtn = document.getElementById('shoot-btn');
    const specialActionBtn = document.getElementById('special-action-btn');
    const jumpBtn = document.getElementById('jump-btn');
    const leftBtn = document.getElementById('left-btn');
    const rightBtn = document.getElementById('right-btn');
    const skillTreeBtn = document.getElementById('skill-tree-btn'); // [FEATURE]

    // End Message
    const endMessageBox = document.getElementById('end-message-box');
    const endMessageText = document.getElementById('end-message-text');
    const endMessageBtn = document.getElementById('end-message-btn');

    // [FEATURE] Skill Tree Modal
    const skillTreeModal = document.getElementById('skill-tree-modal');
    const skillTreeCloseBtn = document.getElementById('skill-tree-close-btn');
    const skillTreeList = document.getElementById('skill-tree-list');
    const skillPointsModalUI = document.getElementById('skill-points-modal-ui');
    const resetSaveBtn = document.getElementById('reset-save-btn');

    // per-stage menu elements removed; common menu will provide unified behavior via window.onMenuContinue / onMenuRestart / onMenuBack

    // [FIX] مودال تایید
    const confirmModal = document.getElementById('confirm-modal');
    const confirmText = document.getElementById('confirm-text');
    const confirmYesBtn = document.getElementById('confirm-yes-btn');
    const confirmNoBtn = document.getElementById('confirm-no-btn');
    let currentConfirmCallback = null;


    // ===================================================================================
    // بخش ۲: متغیرهای اصلی و وضعیت بازی
    // ===================================================================================

    let gamePaused = true;
    let gameState = 'LOADING'; // LOADING, DIALOGUE_HUB, PLAYING_FRIENDSHIP, PLAYING_BETRAYAL, VIDEO, SKILL_TREE, MENU
    let hitStopTimer = 0; // [FEATURE] Hit-Stop

    let camera = { x: 0, y: 0, shakeTime: 0, shakeIntensity: 0 };
    let worldWidth = 3000;
    let worldHeight = 800;

    // --- ثابت‌های بازی ---
    const CONSTANTS = {
        PLAYER_BASE_SPEED: 4,
    PLAYER_BASE_JUMP_POWER: -9, // reduced jump height to be less floaty (was -12)
        GRAVITY: 0.4,
        TERMINAL_VELOCITY: 8,
        PLAYER_SHOOT_COOLDOWN: 20,
        TEAMMATE_SHOOT_COOLDOWN: 80,
        BATTERY_CHARGE_TIME: 600, // 10 ثانیه
        SHIELD_DURATION: 300, // 5 ثانیه
        EQUIPMENT_TO_COLLECT: 5,
        ENEMY_HEALTH: 3,
        ENEMY_SHOOTER_HEALTH: 2,
        ENEMY_FLYER_HEALTH: 1, // [FEATURE]
        ENEMY_SPLITTER_HEALTH: 2, // [FEATURE]
        BOSS_HEALTH: 25,
        HEALTH_DROP_CHANCE: 0.2,
        AMMO_DROP_CHANCE: 0.5,
        HIT_STOP_DURATION: 3, // [FEATURE] 3 فریم توقف
        XP_PER_KILL: 15,
        XP_TO_LEVEL_UP: 100,
        AMBIENT_LIGHT: 'rgba(0, 3, 10, 0.65)' // [USER-REQ] روشنایی بیشتر (قبلا 0.85 بود)
    };

    // Jump behavior tuning: multiplier applied to gravity while player is airborne to shorten jump time
    // Increase this to make jumps quicker (higher gravity during flight). 1 = normal, >1 = quicker
    CONSTANTS.JUMP_GRAVITY_MULT = 1.6;
    // Enemy spawner tuning (milliseconds)
    CONSTANTS.ENEMY_SPAWN_INTERVAL = 3000;
    CONSTANTS.ENEMY_MAX_ACTIVE = 14;

    // current gravity (can be softened for friendship path)
    let currentGravity = CONSTANTS.GRAVITY;

    // helper to render hearts (supports half-hearts)
    function formatHearts(value, max) {
        try {
            const full = Math.floor(value);
            const half = (Math.abs(value - full) >= 0.5) ? 1 : 0;
            const empty = Math.max(0, Math.ceil(max - value));
            return '❤️'.repeat(full) + (half ? '💔' : '') + '🖤'.repeat(Math.max(0, max - full - half));
        } catch (e) { return '' + value; }
    }

    const player = {
    name: (function(){ try{ return sessionStorage.getItem('selectedCharacter') || localStorage.getItem('selectedCharacter') || 'کوروش'; }catch(e){ return 'کوروش'; } })(),
        x: 200, y: 0, width: 50, height: 70,
        speed: CONSTANTS.PLAYER_BASE_SPEED,
        jumpPower: CONSTANTS.PLAYER_BASE_JUMP_POWER,
        velocityX: 0, velocityY: 0, isJumping: false, onGround: false, lastDirection: 'right',
        health: 5, maxHealth: 5, ammo: 0, maxAmmo: 200,
        shootTimer: 0, invincibleTimer: 0, shieldTimer: 0,
        baseShieldChargeTime: CONSTANTS.BATTERY_CHARGE_TIME,
        // [FEATURE] آمار مهارت‌ها
        xp: 0,
        level: 1,
        skillPoints: 0
    };

    // [FEATURE] درخت مهارت
    let skillTree = {
        'max_health': { name: "سلامتی", desc: "افزایش ۱ قلب به حداکثر سلامتی", level: 0, maxLevel: 5, cost: 1 },
        'speed': { name: "سرعت", desc: "افزایش ۱۰٪ سرعت حرکت", level: 0, maxLevel: 5, cost: 1 },
        'jump': { name: "پرش", desc: "افزایش قدرت پرش", level: 0, maxLevel: 3, cost: 1 },

    // بخش ۴: [FEATURE] موتور ذخیره سازی (SaveManager)
    // ===================================================================================
    class SaveManager {
        constructor(saveKey = 'stage9_epic_save_avesta') {
            this.saveKey = saveKey;
            console.log("SaveManager Initialized. Ready to load/save progress.");
        }

        saveGame() {
            try {
                const saveData = {
                    xp: player.xp,
                    skillPoints: player.skillPoints,
                    skillTree: skillTree,
                    playerLevel: player.level,
                    // ما سلامتی و مهمات را ذخیره نمی‌کنیم تا بازیکن با شروع مجدد مرحله ریست شود
                };
                localStorage.setItem(this.saveKey, JSON.stringify(saveData));
                console.log("Game Saved!", saveData);
            } catch (e) {
                console.error("Failed to save game:", e);
            }
        }

        loadGame() {
            try {
                const dataString = localStorage.getItem(this.saveKey);
                if (!dataString) {
                    console.log("No save file found. Starting fresh.");
                    this.applyLoadedStats(); // اعمال پیش‌فرض‌ها
                    return;
                }

                const saveData = JSON.parse(dataString);
                player.xp = saveData.xp || 0;
                player.skillPoints = saveData.skillPoints || 0;
                player.level = saveData.playerLevel || 1;

                // مهم: skillTree را با داده‌های ذخیره شده ادغام کنید تا مهارت‌های جدید اضافه شوند
                if (saveData.skillTree) {
                    Object.keys(skillTree).forEach(key => {
                        if (saveData.skillTree[key]) {
                            skillTree[key].level = saveData.skillTree[key].level || 0;
                        }
                    });
                }

                console.log("Game Loaded!", saveData);
                this.applyLoadedStats(); // اعمال مهارت‌های بارگذاری شده

            } catch (e) {
                console.error("Failed to load game:", e);
                this.applyLoadedStats(); // اعمال پیش‌فرض‌ها در صورت خطا
            }
        }

        // این تابع مهارت‌های بارگذاری شده را روی بازیکن اعمال می‌کند
        applyLoadedStats() {
            // اعمال مهارت‌های سطح‌بندی شده
            player.maxHealth = 5 + (skillTree['max_health'].level * 1);
            player.speed = CONSTANTS.PLAYER_BASE_SPEED + (CONSTANTS.PLAYER_BASE_SPEED * (skillTree['speed'].level * 0.1));
            player.jumpPower = CONSTANTS.PLAYER_BASE_JUMP_POWER - (skillTree['jump'].level * 0.5);
            player.maxAmmo = 200 + (skillTree['ammo_capacity'].level * 50);
            player.baseShieldChargeTime = CONSTANTS.BATTERY_CHARGE_TIME - (skillTree['shield_recharge'].level * 60); // 1 ثانیه

            // به‌روزرسانی UI
            player.health = player.maxHealth; // سلامتی کامل در شروع
            healthUI.innerHTML = `سلامتی: ${'❤️'.repeat(player.health)}${'🖤'.repeat(player.maxHealth - player.health)}`;
            ammoUI.innerText = `مهمات: ${player.ammo}/${player.maxAmmo}`;
            updateXPUI();
        }

        resetSave() {
            try {
                localStorage.removeItem(this.saveKey);
                // ریست کردن متغیرهای در حال اجرا
                player.xp = 0;
                player.skillPoints = 0;
                player.level = 1;
                Object.keys(skillTree).forEach(key => {
                    skillTree[key].level = 0;
                });
                this.applyLoadedStats(); // اعمال وضعیت ریست شده
                renderSkillTree(); // رندر مجدد UI مهارت‌ها
                console.log("Save file reset!");
            } catch (e) {
                console.error("Failed to reset save:", e);
            }
        }
    }

    // بخش ۵: [FEATURE] موتور صوتی (AudioManager)
    // ===================================================================================
    class AudioManager {
        constructor() {
            this.audioContext = null;
            this.soundBuffers = {};
            this.musicSource = null;
            this.musicGain = null;
            try {
                this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                console.log("AudioContext Initialized.");
            } catch (e) {
                console.error("Web Audio API is not supported in this browser.", e);
            }
        }

        loadSound(key, path, isMusic = false) {
            if (!this.audioContext) return;

            // برای فایل‌های صوتی، ما فقط مسیر را ذخیره می‌کنیم
            // برای موسیقی، آن را به عنوان عنصر <audio> بارگذاری می‌کنیم (برای loop بهتر)
            if (isMusic) {
                const audio = new Audio();
                audio.src = path;
                audio.loop = true;
                this.soundBuffers[key] = audio;
            } else {
                 // بارگذاری افکت‌های صوتی
                 // (در یک پروژه واقعی، از fetch و decodeAudioData استفاده می‌کنیم)
                 // برای سادگی اینجا، ما از عناصر Audio استفاده می‌کنیم
                 const audio = new Audio();
                 audio.src = path;
                 this.soundBuffers[key] = audio;
            }
        }

        // بارگذاری دارایی‌های صوتی در loadAssets
        loadAudioAssets(callback) {
            let loadedCount = 0;
            const audioKeys = Object.keys(assetPaths).filter(k => k.startsWith('snd_'));
            const totalAudio = audioKeys.length;
            if (totalAudio === 0) { callback(); return; }

            audioKeys.forEach(key => {
                const isMusic = key.includes('music');
                this.loadSound(key, assetPaths[key], isMusic);
                // فرض می‌کنیم بارگذاری سریع است (در دنیای واقعی به 'canplaythrough' گوش می‌دهیم)
                loadedCount++;
            });

            if (loadedCount === totalAudio) {
                console.log("All audio assets (placeholders) registered.");
                callback();
            }
        }

        playSound(key, volume = 1, pan = 0) {
            if (!this.audioContext || !this.soundBuffers[key] || this.soundBuffers[key].loop) {
                return; // موسیقی را با این تابع پخش نکن
            }

            try {
                 // کلون کردن نود صدا برای پخش همزمان چندباره
                const audio = this.soundBuffers[key].cloneNode();
                audio.volume = volume;

                // (پشتیبانی از Panning در Audio ساده وجود ندارد، برای WebAudio API کامل نیاز است)
                // در حال حاضر pan را نادیده می‌گیریم
                audio.play();

            } catch(e) {
                console.error(`Error playing sound: ${key}`, e);
            }
        }

        playMusic(key, volume = 0.5) {
            if (!this.soundBuffers[key] || !this.soundBuffers[key].loop) {
                console.warn(`Music track not found or not music: ${key}`);
                return;
            }
            if (this.musicSource) {
                this.stopMusic();
            }
            try {
                this.musicSource = this.soundBuffers[key];
                this.musicSource.volume = volume;
                this.musicSource.play();
                console.log(`Playing music: ${key}`);
            } catch (e) {
                console.error(`Error playing music: ${key}`, e);
            }
        }

        stopMusic() {
            if (this.musicSource) {
                this.musicSource.pause();
                this.musicSource.currentTime = 0;
                this.musicSource = null;
            }
        }

        // محاسبه پن (چپ/راست) بر اساس موقعیت دوربین
        getPan(entityX) {
            if (!canvas) return 0;
            const screenX = entityX - camera.x;
            const normalizedX = (screenX / canvas.width) * 2 - 1; // -1 (left) to 1 (right)
            return Math.max(-1, Math.min(1, normalizedX));
        }
    }

    // کلاس یک ذره (Particle)
    class Particle {
        constructor(x, y, options = {}) {
            this.x = x;
            this.y = y;
            this.vx = options.vx || (Math.random() - 0.5) * 4;
            this.vy = options.vy || (Math.random() - 0.5) * 4;
            this.life = options.life || Math.random() * 50 + 30;
            this.startLife = this.life;
            this.color = options.color || '#ffffff';
            this.size = options.size || Math.random() * 3 + 2;
            this.startSize = this.size;
            this.gravity = options.gravity === undefined ? CONSTANTS.GRAVITY * 0.1 : options.gravity;
            this.drag = options.drag || 0.98; // اصطکاک هوا
            this.behavior = options.behavior || 'fade'; // 'fade', 'shrink', 'none'
        }

        update() {
            this.life--;
            this.x += this.vx;
            this.y += this.vy;
            this.vy += this.gravity;
            this.vx *= this.drag;
            this.vy *= this.drag;

            if (this.behavior === 'shrink') {
                this.size = (this.life / this.startLife) * this.startSize;
            }
        }

        draw(ctx, cameraX) {
            if (this.life <= 0 || this.size <= 0) return;

            let alpha = 1;
            if (this.behavior === 'fade') {
                alpha = this.life / this.startLife;
            }

            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x - cameraX, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
    }

    // کلاس مدیریت ذرات
    class ParticleManager {
        constructor() {
            this.particles = [];
            console.log("ParticleManager Initialized.");
        }

        update() {
            for (let i = this.particles.length - 1; i >= 0; i--) {
                this.particles[i].update();
                if (this.particles[i].life <= 0) {
                    this.particles.splice(i, 1);
                }
            }
        }

        draw(ctx, cameraX) {
            // بهینه‌سازی: فقط ذرات روی صفحه را رسم کن
            const viewStart = cameraX - 100;
            const viewEnd = cameraX + canvas.width + 100;

            // (بهینه‌سازی نورپردازی: ذرات نورانی را در یک pass جداگانه رسم می‌کنیم)
            // در حال حاضر همه را با هم رسم می‌کنیم
            ctx.globalCompositeOperation = 'lighter'; // افکت حماسی

            for (let i = this.particles.length - 1; i >= 0; i--) {
                const p = this.particles[i];
                if (p.x > viewStart && p.x < viewEnd) {
                    p.draw(ctx, cameraX);
                }
            }
            ctx.globalCompositeOperation = 'source-over'; // بازگشت به حالت عادی
        }

    /**
     * [FEATURE] تابع کمکی برای افزودن Prefab به دنیا
     */
    function addPrefabToWorld(prefab, startX, startY) {
        prefab.platforms.forEach(p => {
            platforms.push({
                ...p, // کپی کردن تمام ویژگی‌های پلتفرم
                x: p.x + startX,
                y: p.y + startY,
                startX: p.x + startX, // برای پلتفرم‌های متحرک
                startY: p.y + startY,
                life: 100 // برای شکننده
            });
        });
        prefab.enemies.forEach(e => {
            enemies.push(createEnemy(e.x + startX, e.y + startY, e.type));
        });
        prefab.items.forEach(i => {
            items.push(createItem(i.x + startX, i.y + startY, i.type));
        });
    }

    function loadAssets(callback) {
        let loadedImgCount = 0;
        const imgPaths = {};
        const audioPaths = {};

        // جدا کردن دارایی‌ها
        for (const key in assetPaths) {
            if (key.startsWith('snd_')) {
                audioPaths[key] = assetPaths[key];
            } else if (!assetPaths[key].endsWith('.mp4')) {
                imgPaths[key] = assetPaths[key];
            } else {
                 assets[key] = { src: assetPaths[key], type: 'video' };
            }
        }

        const totalImgAssets = Object.keys(imgPaths).length;
        if (totalImgAssets === 0) {
            loadAudio(callback);
            return;
        }

        // ۱. بارگذاری تصاویر
        for (const key in imgPaths) {
             const path = imgPaths[key];
             const img = new Image();
             assets[key] = img;
             img.onload = () => {
                loadedImgCount++;
                if (loadedImgCount === totalImgAssets) loadAudio(callback);
             };
             img.onerror = () => {
                console.log(`خطا در بارگذاری ${path}. استفاده از جایگزین.`);
                if(placeholderAssetPaths[key]) {
                    img.src = placeholderAssetPaths[key];
                } else {
                    loadedImgCount++;
                    if (loadedImgCount === totalImgAssets) loadAudio(callback);
                }
             };
             img.src = path;
        }

        // ۲. بارگذاری صداها (بعد از تصاویر)
        function loadAudio(finalCallback) {
            audioManager.loadAudioAssets(() => {
                console.log("All assets loaded.");
                finalCallback();
            });
        }
    }

            isTeammate: true
        };
    }

    /**
     * ساخت یک دشمن (بازنویسی شده)
     */
    function createEnemy(x, y, type = 'walker') {
        let health, width, height, speed, ignoresGravity, splitsOnDeath = false;

        switch(type) {
            case 'boss':
                health = CONSTANTS.BOSS_HEALTH; width = 100; height = 120; speed = 1;
                break;
            case 'shooter':
                health = CONSTANTS.ENEMY_SHOOTER_HEALTH; width = 50; height = 70; speed = Math.random() * 0.5 + 0.2;
                break;
            case 'flyer': // [FEATURE]
                health = CONSTANTS.ENEMY_FLYER_HEALTH; width = 40; height = 40; speed = Math.random() * 1 + 1;
                ignoresGravity = true;
                break;
            case 'splitter': // [FEATURE]
                health = CONSTANTS.ENEMY_SPLITTER_HEALTH; width = 60; height = 60; speed = Math.random() * 0.8 + 0.5;
                splitsOnDeath = true;
                break;
            case 'walker':
            default:
                health = CONSTANTS.ENEMY_HEALTH; width = 50; height = 70; speed = Math.random() * 1 + 0.5;
                break;
        }

        const enemy = {
            x: x, y: y, width: width, height: height, health: health, maxHealth: health,
            speed: speed, direction: -1, type: type,
            patrolRange: 100, patrolCenter: x,
            shootCooldown: Math.random() * 60 + 120,
            state: 'PATROL', stateTimer: 0,
            ignoresGravity: ignoresGravity || false,
            splitsOnDeath: splitsOnDeath || false
        };

        // [FEATURE] نور برای دشمنان
        let lightColor = type === 'flyer' ? 'rgba(255, 0, 255, 0.6)' : 'rgba(255, 50, 50, 0.4)';
        addLightSource(enemy, 150, lightColor, 1, true);

        return enemy;
    }

    /**
     * ساخت یک آیتم
     */
    function createItem(x, y, type) {
         const item = {
            x: x, y: y, width: 30, height: 30, type: type,
            startY: y, bobSpeed: Math.random() * 0.05 + 0.02
        };

        // [FEATURE] نور برای آیتم‌ها
        let lightColor = (type === 'equipment') ? 'rgba(0, 255, 195, 0.7)' : (type === 'health' ? 'rgba(0, 255, 0, 0.7)' : 'rgba(255, 255, 0, 0.7)');
        addLightSource(item, 100, lightColor, 1, true);

        return item;
    }

    // ===================================================================================
    // بخش ۹: حلقه اصلی بازی (Game Loop) - (بازنویسی شده)
    // ===================================================================================

    function gameLoop() {
        // [FEATURE] منطق Hit-Stop
        if (hitStopTimer > 0) {
            hitStopTimer--;
            // ما update() را فراخوانی نمی‌کنیم، فقط draw()
        } else if (!gamePaused) {
            update();
        }

        draw();
        requestAnimationFrame(gameLoop);
    }

    // ===================================================================================
    // بخش ۱۰: منطق به‌روزرسانی (Update) - (بازنویسی شده)
    // ===================================================================================

    function update() {
        updatePlayer();

        if (gameState === 'DIALOGUE_HUB') {
            updateHub();
        } else if (gameState === 'PLAYING_FRIENDSHIP') {
            updateTeammates(true);
            updateEnemies(); // <--- [FIX-3.0] شامل حمله زامبی
            // periodic enemy spawner: spawn ahead of player if below max active
            try{
                const now = Date.now();
                if ((now - enemySpawner.lastSpawn > CONSTANTS.ENEMY_SPAWN_INTERVAL && enemies.length < CONSTANTS.ENEMY_MAX_ACTIVE) || enemies.length === 0) {
                    enemySpawner.lastSpawn = now;
                    // spawn near forward area but inside world bounds
                    let spawnX = Math.min(worldWidth - 200, player.x + canvas.width * 0.9 + (Math.random() * 200 - 100));
                    if (spawnX < player.x + 200) spawnX = player.x + 300;
                    let kindRand = Math.random();
                    let kind = kindRand < 0.5 ? 'walker' : (kindRand < 0.85 ? 'shooter' : 'flyer');
                    let en = createEnemy(spawnX, worldHeight - 130 - (Math.random() * 120), kind);
                    en.maxHealth = (kind === 'flyer') ? 3 : 4;
                    en.health = en.maxHealth;
                    en.shootCooldown = Math.random() * 80 + 40;
                    enemies.push(en);
                    if (enemies.length === 0) {
                        console.log('Stage9: spawned enemy because list was empty');
                    }
                }
            }catch(e){/* ignore spawner errors */}
            updateBullets();
            updateItems();
            particleManager.update(); // [FEATURE]
        } else if (gameState === 'PLAYING_BETRAYAL') {
            updateTeammates(false);
            updateDoors();
            particleManager.update(); // [FEATURE]
        }

        updatePhysics([player, ...teammates, ...enemies]);
        updatePlatforms();
        updateCamera();
        updateBattery();
        updateLightSources(); // [FEATURE]
    }

    /**
     * آپدیت بازیکن (بازنویسی شده)
     */
    function updatePlayer() {
        if (player.health <= 0) {
            player.velocityX = 0;
            return;
        }

        // تایمرها
        if (player.invincibleTimer > 0) player.invincibleTimer--;
        if (player.shootTimer > 0) player.shootTimer--;
        if (player.shieldTimer > 0) player.shieldTimer--;

        // حرکت
        player.velocityX = 0;
        if (keys.left) { player.velocityX = -player.speed; player.lastDirection = 'left'; }
        if (keys.right) { player.velocityX = player.speed; player.lastDirection = 'right'; }

        // پرش
        if (keys.jump && player.onGround) {
            player.velocityY = player.jumpPower; // [FEATURE] استفاده از قدرت پرش
            player.isJumping = true;
            player.onGround = false;
            particleManager.createBurst(player.x + player.width/2, player.y + player.height, 5, 'jump');
            audioManager.playSound('snd_jump', 0.5);
        }

        // گرد و غبار
        if (player.onGround && (keys.left || keys.right) && Math.random() < 0.3) {
             particleManager.createBurst(player.x + player.width/2, player.y + player.height, 1, 'dust');
        }

        // jump-pad interaction: if standing on a jumpPad, launch upwards
        if (gameState === 'PLAYING_FRIENDSHIP') {
            try{
                for (let p of platforms) {
                    if (p && p.jumpPad && isColliding(player, p) && player.velocityY >= 0) {
                        player.velocityY = player.jumpPower * 1.05; // weaker jump-pad boost (softer)
                        player.isJumping = true;
                        player.onGround = false;
                        particleManager.createBurst(player.x + player.width/2, player.y + player.height, 8, 'jump');
                        audioManager.playSound('snd_jump', 0.6);
                    }
                }
            }catch(e){}
        }

        // شلیک
        if (keys.shoot && player.hasGun && player.ammo > 0 && player.shootTimer === 0) {
            player.ammo--;
            player.shootTimer = CONSTANTS.PLAYER_SHOOT_COOLDOWN;
            const bullet = createBullet(player.x + (player.lastDirection === 'right' ? player.width : -10), player.y + 35, player.lastDirection, 'player');
            bullets.push(bullet);

            // [FEATURE] نورپردازی و صدا
            addLightSource(bullet, 80, 'rgba(255, 255, 0, 0.8)', 1, false, 30); // نور موقت
            particleManager.createBurst(bullet.x, bullet.y, 3, 'muzzle');
            audioManager.playSound('snd_shoot', 0.7, audioManager.getPan(bullet.x));

            ammoUI.innerText = `مهمات: ${player.ammo}/${player.maxAmmo}`;
        }

        // سپر ویژه
        if (keys.special && gameState === 'PLAYING_FRIENDSHIP' && battery.chargeCooldown === 0) {
            battery.charge = 0;
            battery.chargeCooldown = player.baseShieldChargeTime; // [FEATURE]
            player.shieldTimer = CONSTANTS.SHIELD_DURATION;
            teammates.forEach(t => t.shieldTimer = CONSTANTS.SHIELD_DURATION);
            batteryUI.classList.remove('ready');
            particleManager.createBurst(player.x + player.width/2, player.y + player.height/2, 50, 'shield_burst');
        }

        // برخورد با درها (Hub)
        if (gameState === 'DIALOGUE_HUB') {
            if (isColliding(player, doors.friendship_door) && !choiceMade) {
                choiceMade = true;
                saveManager.saveGame(); // ذخیره مهارت‌ها قبل از ورود
                gameState = 'PLAYING_FRIENDSHIP';
                setupWorld('PLAYING_FRIENDSHIP');
            }
            if (isColliding(player, doors.betrayal_door) && !choiceMade) {
                choiceMade = true;
                saveManager.saveGame(); // ذخیره مهارت‌ها قبل از ورود
                gameState = 'PLAYING_BETRAYAL';
                setupWorld('PLAYING_BETRAYAL');
            }
        }

        // برخورد با کنسول (خیانت)
        if (gameState === 'PLAYING_BETRAYAL') {
            if (isColliding(player, doors.launch_console)) {
                gamePaused = true;
                // betrayal path should NOT unlock the next stage
                playFinalVideo('betrayal_video', false);
            }
        }

        // چک کردن سقوط
        // چک کردن سقوط
        if (player.y > worldHeight + 200) {
            if (gameState === 'PLAYING_FRIENDSHIP') {
                // soft recovery: teleport the player back to ground with a small penalty instead of instant death
                player.x = Math.max(50, player.x - 200);
                player.y = worldHeight - 60 - player.height;
                player.velocityY = 0;
                // small damage for the fall
                try{ player.health = Math.max(0, player.health - 1); }catch(e){}
                particleManager.createBurst(player.x + player.width/2, player.y + player.height/2, 30, 'pickup');
                if (player.health <= 0) {
                    dealPlayerDamage(999, 'fall');
                } else {
                    try{ healthUI.innerHTML = `سلامتی: ${formatHearts(player.health, player.maxHealth)}`;}catch(e){}
                }
            } else {
                dealPlayerDamage(999, 'fall'); // آسیب کشنده
            }
        }
    }

    /**
     * آپدیت بخش Hub
     */
    function updateHub() {
        let spokenCount = 0;
        Object.keys(dialogueTriggers).forEach(key => {
            let trigger = dialogueTriggers[key];
            if (isColliding(player, trigger) && !trigger.triggered) {
                trigger.triggered = true;
                showFloatingDialogue(key, trigger.text, 2500);
            }
            if (trigger.triggered) spokenCount++;
        });

        if (spokenCount === 3 && !choiceMade) {
            objectiveUI.innerText = "هدف: یک مسیر را انتخاب کن (به درها برو)";
        }
    }

    /**
     * آپدیت هم‌تیمی‌ها (بدون تغییر عمده، فیکس پرش حفظ شده)
     */
    function updateTeammates(isCombatAI) {
        // if teammates mysteriously drop below 3, respawn missing teammates near player
        try{
            if (gameState === 'PLAYING_FRIENDSHIP' && teammates.length < 3) {
                const names = ['سهراب','رستم','داریوش'];
                for (let i = teammates.length; i < 3; i++) {
                    const nx = Math.max(50, player.x - 60 - (i * 60));
                    teammates.push(createTeammate(names[i], nx, player.y));
                }
                console.log('Stage9: respawned missing teammates, count=', teammates.length);
            }
        }catch(e){console.warn('teammate respawn check failed', e);}

        teammates.forEach((tm, index) => {
            // quick recovery if a teammate fell far off the world (soft rescue)
            if (tm.y > worldHeight + 150) {
                // reposition near the player and apply a small penalty
                tm.x = Math.max(50, player.x - 120 - index * 60);
                tm.y = worldHeight - 60 - tm.height;
                tm.velocityY = 0;
                tm.onGround = true;
                tm.isJumping = false;
                try{ tm.health = Math.max(0, (typeof tm.health === 'number' ? tm.health : 5) - 1); }catch(e){}
                particleManager.createBurst(tm.x + tm.width/2, tm.y + tm.height/2, 12, 'pickup');
                return; // skip further AI this frame
            }
            if (tm.shieldTimer > 0) tm.shieldTimer--;

            if (isCombatAI) {
                // --- AI جنگجو ---
                let closestEnemy = null;
                let minDistance = 500;
                enemies.forEach(e => {
                    const dist = Math.hypot(e.x - tm.x, e.y - tm.y);
                    if (dist < minDistance) {
                        minDistance = dist;
                        closestEnemy = e;
                    }
                });

                if (closestEnemy) {
                    tm.state = 'ATTACKING';
                    tm.target = closestEnemy;
                } else {
                    tm.state = 'FOLLOWING';
                    tm.target = null;
                }

                if (tm.state === 'ATTACKING') {
                    tm.lastDirection = tm.target.x > tm.x ? 'right' : 'left';
                    if (tm.shootCooldown > 0) tm.shootCooldown--;
                    if (tm.shootCooldown <= 0 && tm.hasGun) {
                        tm.shootCooldown = CONSTANTS.TEAMMATE_SHOOT_COOLDOWN;
                        const bullet = createBullet(tm.x + (tm.lastDirection === 'right' ? tm.width : -10), tm.y + 35, tm.lastDirection, 'teammate');
                        bullets.push(bullet);
                        addLightSource(bullet, 80, 'rgba(0, 255, 195, 0.7)', 1, false, 30); // [FEATURE]
                    }
                    tm.velocityX = 0;
                } else { // FOLLOWING
                    const followDistance = 80 + (index * 20);
                    const distanceToPlayer = player.x - tm.x;
                    const yDistance = player.y - tm.y;

                    // edge-avoidance: probe ahead before moving
                    const dirSign = Math.sign(distanceToPlayer) || 1;
                    if (Math.abs(distanceToPlayer) > followDistance) {
                        // if moving would cause teammate to fall, try to jump or hold position
                        if (willFallIfMove(tm, dirSign)) {
                            // attempt a controlled jump if on ground and close enough
                            if (tm.onGround && Math.abs(distanceToPlayer) < 180) {
                                tm.velocityY = CONSTANTS.PLAYER_BASE_JUMP_POWER * 0.85;
                                tm.onGround = false;
                                tm.isJumping = true;
                            }
                            tm.velocityX = 0;
                        } else {
                            tm.velocityX = dirSign * (player.speed * 0.9);
                            tm.lastDirection = tm.velocityX > 0 ? 'right' : 'left';
                        }
                    } else {
                        tm.velocityX = 0;
                    }

                    // improved teammate jump logic: jump to follow player vertically if needed
                    if (yDistance < -50 && tm.onGround && Math.abs(distanceToPlayer) < 200) {
                        tm.velocityY = CONSTANTS.PLAYER_BASE_JUMP_POWER * 0.9;
                        tm.onGround = false;
                        tm.isJumping = true;
                    }
                }

            } else {
                // --- AI مسدود کننده/گشت‌زن ---
                if (tm.isBlocker) {
                    tm.x += tm.speed * tm.direction;
                    if (tm.x < tm.patrolCenter - tm.patrolRange || tm.x > tm.patrolCenter + tm.patrolRange) {
                        tm.direction *= -1;
                    }
                    tm.lastDirection = tm.direction > 0 ? 'right' : 'left';

                    // چک کردن دید
                    let sightX = tm.lastDirection === 'right' ? tm.x + tm.width : tm.x;
                    let sightY = tm.y + tm.height / 2;
                    let playerCenterX = player.x + player.width / 2;
                    let playerCenterY = player.y + player.height / 2;

                    if (Math.abs(playerCenterY - sightY) < 50 &&
                        ((tm.lastDirection === 'right' && playerCenterX > sightX && playerCenterX < sightX + 200) ||
                         (tm.lastDirection === 'left' && playerCenterX < sightX && playerCenterX > sightX - 200)))
                    {
                        showFloatingDialogue('blocker', "کوروش! ایست! داری چه کار می‌کنی؟!", 2000);
                        Object.values(doors).filter(d => d.isLocked).forEach(d => {
                            d.isActivated = false;
                            d.activation = 0;
                        });
                    }
                }
            }
        });
    }

    /**
     * آپدیت دشمنان (بازنویسی شده برای AI جدید و فیکس حمله)
     */
    function updateEnemies() {
        for (let eIndex = enemies.length - 1; eIndex >= 0; eIndex--) {
            let e = enemies[eIndex];

            if (e.health <= 0) {
                // [FEATURE] منطق XP و Splitter
                addXP(CONSTANTS.XP_PER_KILL);
                particleManager.createBurst(e.x + e.width/2, e.y + e.height/2, 20, 'blood');

                if (e.splitsOnDeath) {
                    enemies.push(createEnemy(e.x - 10, e.y, 'walker'));
                    enemies.push(createEnemy(e.x + 10, e.y, 'walker'));
                }

                // دراپ آیتم
                if (Math.random() < CONSTANTS.HEALTH_DROP_CHANCE) {
                    items.push(createItem(e.x, e.y + e.height - 30, 'health'));
                } else if (Math.random() < CONSTANTS.AMMO_DROP_CHANCE) {
                    items.push(createItem(e.x, e.y + e.height - 30, 'ammo'));
                }

                enemies.splice(eIndex, 1);
                continue;
            }

            // منطق AI
            if (e.type === 'boss') {
                if (e.stateTimer > 0) e.stateTimer--;

                if (e.stateTimer <= 0) {
                    let rand = Math.random();
                    if (rand < 0.3) {
                        e.state = 'JUMP_ATTACK';
                        e.velocityY = -15;
                        e.stateTimer = 180;
                    } else if (rand < 0.7) {
                        e.state = 'SHOOT_BURST';
                        e.stateTimer = 120;
                    } else {
                        e.state = 'IDLE';
                        e.stateTimer = 60;
                    }
                }

                if (e.state === 'JUMP_ATTACK') {
                    e.velocityX = Math.sign(player.x - e.x) * e.speed * 2;
                    if (e.onGround) {
                        triggerCameraShake(15, 20);
                        e.state = 'IDLE';
                        e.velocityX = 0;
                    }
                } else if (e.state === 'SHOOT_BURST') {
                    if (e.stateTimer % 20 === 0) {
                        const bullet = createBullet(e.x + e.width / 2, e.y + e.height / 2, e.direction > 0 ? 'right' : 'left', 'enemy');
                        bullets.push(bullet);
                        addLightSource(bullet, 80, 'rgba(255, 0, 0, 0.8)', 1, false, 30); // [FEATURE]
                    }
                } else {
                    e.velocityX = 0;
                }
                // [FIX-3.0] حمله تماسی باس
                if (isColliding(e, player) && player.invincibleTimer === 0 && player.shieldTimer === 0) {
                    dealPlayerDamage(2, 'boss'); // باس ۲ تا دمیج میده
                }

            }
            else if (e.type === 'flyer') { // [FEATURE]
                const distanceToPlayer = Math.hypot(player.x - e.x, player.y - e.y);
                if (distanceToPlayer < 600 && distanceToPlayer > 20) { // در محدوده دید
                    const angle = Math.atan2((player.y + player.height/2) - (e.y + e.height/2), (player.x + player.width/2) - (e.x + e.width/2));
                    e.velocityX = Math.cos(angle) * e.speed;
                    e.velocityY = Math.sin(angle) * e.speed;
                } else {
                    e.velocityX *= 0.9; // کند شدن
                    e.velocityY *= 0.9;
                }
                // اعمال حرکت (فیزیک جداگانه است)
                // [FIX-3.0] حمله تماسی
                if (isColliding(e, player) && player.invincibleTimer === 0 && player.shieldTimer === 0) {
                    dealPlayerDamage(1, 'flyer');
                    e.health = 0; // خودکشی
                }

            }
            else {
                // منطق دشمنان زمینی (walker, shooter, splitter)
                const distanceToPlayer = Math.abs(player.x - e.x);
                const yDistance = Math.abs(player.y - e.y);
                let canSeePlayer = (distanceToPlayer < 400 && yDistance < 100 && player.health > 0);

                if (canSeePlayer) {
                    // بازیکن نزدیک است، به سمت او حرکت کن
                    e.direction = (player.x < e.x) ? -1 : 1;
                    e.velocityX = e.speed * e.direction;

                    // [FIX-1] & [FIX-3.0] منطق حمله برای 'walker'
                    if (e.type === 'walker' || e.type === 'splitter') {
                        if (isColliding(e, player) && player.invincibleTimer === 0 && player.shieldTimer === 0) {
                            dealPlayerDamage(1, e.type);
                        }
                    }

                    // منطق تیراندازی برای "shooter"
                    if (e.type === 'shooter') {
                        e.velocityX = 0; // تیرانداز ثابت می‌ماند
                        if (e.shootCooldown > 0) e.shootCooldown--;
                        if (e.shootCooldown <= 0) {
                            e.shootCooldown = Math.random() * 60 + 120;
                            const bullet = createBullet(e.x + (e.direction > 0 ? e.width : -10), e.y + 35, e.direction > 0 ? 'right' : 'left', 'enemy');
                            // enemy bullets deal half a heart
                            bullet.damage = 0.5;
                            bullets.push(bullet);
                            addLightSource(bullet, 80, 'rgba(255, 0, 0, 0.8)', 1, false, 30); // [FEATURE]
                        }
                    }

                } else {
                    // بازیکن دور است، گشت بزن
                    e.x += e.speed * e.direction;
                    if (e.x < e.patrolCenter - e.patrolRange || e.x > e.patrolCenter + e.patrolRange) {
                        e.direction *= -1;
                    }
                    e.velocityX = 0; // گشت‌زنی توسط فیزیک انجام نمی‌شود
                }
            }
        }
    }

    /**
     * آپدیت فیزیک (بازنویسی شده)
     */
    function updatePhysics(entities) {
        entities.forEach(e => {
            if (!e || (e.health <= 0 && e !== player)) return;

            // اعمال گرانش
            if (!e.ignoresGravity) { // [FEATURE]
                e.y += e.velocityY;
                // allow softer gravity for friendship path and slightly gentler gravity for teammates
                let gravityToApply = currentGravity * (e.isTeammate ? 0.75 : 1);
                // make player's airborne time shorter by increasing gravity while in air
                if (e === player && !e.onGround) {
                    gravityToApply *= (CONSTANTS.JUMP_GRAVITY_MULT || 1);
                } else if (e.isTeammate && !e.onGround) {
                    gravityToApply *= 1.15; // teammates have slightly stronger pull while airborne to reduce hang time
                }
                e.velocityY += gravityToApply;
                if (e.velocityY > CONSTANTS.TERMINAL_VELOCITY) e.velocityY = CONSTANTS.TERMINAL_VELOCITY;
            } else {
                e.y += e.velocityY; // flyerها سرعت عمودی خود را دارند
            }

            e.onGround = false;

            // برخورد عمودی با پلتفرم‌ها
            if (!e.ignoresGravity) {
                platforms.forEach(p => {
                    if (isColliding(e, p)) {
                        if (e.velocityY >= 0 && e.y + e.height - e.velocityY <= p.y + 1) {
                            // soft landing: small bounce when landing fast on friendship path
                            const landingSpeed = e.velocityY;
                            e.y = p.y - e.height;
                            if (gameState === 'PLAYING_FRIENDSHIP' && landingSpeed > 2) {
                                // small rebound to give a soft ground feeling
                                e.velocityY = -landingSpeed * 0.18;
                                e.onGround = false;
                                e.isJumping = true;
                            } else {
                                e.velocityY = 0;
                                e.onGround = true;
                                e.isJumping = false;
                            }
                            if(p.type === 'crumbling' && e === player) p.life -= 4;
                        }
                        else if (e.velocityY < 0 && e.y >= p.y + p.height - 1) {
                            e.y = p.y + p.height;
                            e.velocityY = 0.1;
                        }
                    }
                });
            }

            // اعمال سرعت افقی (از AI)
            e.x += e.velocityX || 0;
            // برخورد افقی با پلتفرم‌ها
            platforms.forEach(p => {
                 if (isColliding(e, p)) {
                    // فقط با دیوارهایی که واقعا دیوار هستند برخورد کن
                    if (p.type === 'wall' || (e.onGround && p.type !== 'platform' && p.type !== 'crumbling' && p.type !== 'moving_v' && p.type !== 'moving_h'))
                    {
                        if ((e.velocityX || 0) > 0) {
                            e.x = p.x - e.width;
                        } else if ((e.velocityX || 0) < 0) {
                            e.x = p.x + p.width;
                        }
                    }
                 }
            });

            // محدودیت‌های دنیا
            if (e.x < 0) e.x = 0;
            if (e.x + e.width > worldWidth) e.x = worldWidth - e.width;
        });
    }

    /**
     * آپدیت پلتفرم‌های متحرک
     */
    function updatePlatforms() {
        let time = Date.now() * 0.001;
        for (let index = platforms.length - 1; index >= 0; index--) {
            let p = platforms[index];
            if (p.type === 'moving_v') {
                p.y = p.startY + Math.sin(time * p.moveSpeed) * p.moveRange;
            } else if (p.type === 'moving_h') {
                p.x = p.startX + Math.sin(time * p.moveSpeed) * p.moveRange;
            } else if (p.type === 'crumbling' && p.life <= 0) {
                p.originalProperties = { ...p };
                platforms.splice(index, 1);
                setTimeout(() => {
                    platforms.push({ ...p.originalProperties, life: 100 });
                }, 3000);
            }
        }
    }

    /**
     * آپدیت درها و ترمینال‌ها
     */
    function updateDoors() {
        Object.values(doors).forEach(d => {
            if (d.label === "ترمینال" && !d.isActivated) {
                if (isColliding(player, d)) {
                    d.activation += 1;
                    if (d.activation >= 100) {
                        d.isActivated = true;
                        doors[d.linkedDoor].isLocked = false;
                        // [FEATURE] تغییر نور ترمینال
                        let light = lightSources.find(ls => ls.entity === d);
                        if (light) light.color = 'rgba(0, 255, 0, 0.7)';
                    }
                } else {
                    d.activation = 0;
                }
            }
        });
    }

    /**
     * ساخت گلوله
     */
    function createBullet(x, y, direction, owner) {
        return {
            x, y, width: 10, height: 5,
            speed: 10,
            direction: direction,
            owner: owner,
            damage: 1 // [FEATURE] (می‌تواند از مهارت‌ها بیاید)
        };
    }

    /**
     * آپدیت گلوله‌ها (بازنویسی شده)
     */
    function updateBullets() {
        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i];
            b.x += b.direction === 'right' ? b.speed : -b.speed;

            if (b.x < camera.x - 50 || b.x > camera.x + canvas.width + 50) {
                bullets.splice(i, 1);
                continue;
            }

            let hit = false;

            if (b.owner === 'player' || b.owner === 'teammate') {
                for(let e of enemies) {
                    if (isColliding(b, e)) {
                        e.health -= b.damage;
                        hit = true;
                        particleManager.createBurst(b.x, b.y, 5, 'hit_enemy');
                        triggerHitStop(); // [FEATURE]
                        audioManager.playSound('snd_hit', 1, audioManager.getPan(e.x));
                        break;
                    }
                };
            }

            if (b.owner === 'enemy') {
                if (isColliding(b, player) && player.invincibleTimer === 0 && player.shieldTimer === 0) {
                    hit = true;
                    // enemy bullets deal fractional damage (half heart)
                    dealPlayerDamage(b.damage || 0.5, 'bullet');
                }

                teammates.forEach(t => {
                    if (isColliding(b, t) && t.shieldTimer === 0) {
                        hit = true;
                        // damage teammate health
                        try{ t.health = (typeof t.health === 'number' ? t.health : 5) - (b.damage || 0.5); }catch(e){}
                        particleManager.createBurst(b.x, b.y, 5, 'hit_teammate');
                        if (t.health <= 0) {
                            // teammate down
                            t.health = 0;
                            // play small explosion
                            particleManager.createBurst(t.x + t.width/2, t.y + t.height/2, 20, 'explosion');
                        }
                    }
                });
            }

            if(hit) {
                bullets.splice(i, 1);
            }
        }
    }

    /**

                        // unlock next level before returning to level-select (friendship path should unlock)
                        showEndMessage(friendshipStory, false, function(){
                            try{ window.unlockStageNext && window.unlockStageNext(9); }catch(e){}
                            try{ const key = 'unlockedLevel'; const existing = parseInt(localStorage.getItem(key) || '1', 10) || 1; const next = Math.max(existing, 9 + 1); localStorage.setItem(key, String(next)); }catch(e){}
                            goToLevelSelect();

                } else if (item.type === 'ammo' && player.ammo < player.maxAmmo) {

    /**
     * آپدیت دوربین
     */
    function updateCamera() {
        let targetX = player.x - canvas.width / 3;
        camera.x += (targetX - camera.x) * 0.08;

        if (camera.x < 0) camera.x = 0;
        if (camera.x > worldWidth - canvas.width) camera.x = worldWidth - canvas.width;

        if (camera.shakeTime > 0) camera.shakeTime--;
    }

    /**
     * آپدیت باتری
     */
    function updateBattery() {
        battery.glow += battery.glowDir * 0.02;
        if (battery.glow > 0.5 || battery.glow < 0) battery.glowDir *= -1;

        if (gameState === 'PLAYING_FRIENDSHIP' && battery.chargeCooldown > 0) {
            battery.chargeCooldown--;
            if (battery.chargeCooldown === 0) {
                battery.charge = 100;
                batteryUI.innerText = "سپر باتری: 🔋 (آماده)";
                batteryUI.classList.add('ready');
            } else if (battery.chargeCooldown % 60 === 0) {
                 batteryUI.innerText = `شارژ سپر: ${Math.floor(battery.chargeCooldown / 60)} ثانیه`;
            }
        }
    }

    // ===================================================================================
    // بخش ۱۱: [FEATURE] سیستم نورپردازی (Lighting)
    // ===================================================================================

    /**
     * افزودن منبع نور
     * @param {object} entity - موجودیتی که نور به آن متصل است (یا null برای نور ثابت)
     * @param {number} radius - شعاع نور
     * @param {string} color - رنگ (می‌تواند گرادیانت باشد)
     * @param {number} intensity - شدت (استفاده نشده، در رنگ است)
     * @param {boolean} flicker - آیا نور چشمک می‌زند؟
     * @param {number} life - عمر نور (فریم)، -1 برای بی‌نهایت
     */
    function addLightSource(entity, radius, color, intensity = 1, flicker = false, life = -1) {
        lightSources.push({
            entity: entity,
            x: entity ? entity.x + entity.width / 2 : 0,
            y: entity ? entity.y + entity.height / 2 : 0,
            radius: radius,
            color: color,
            baseRadius: radius,
            flicker: flicker,
            life: life
        });
    }

    function updateLightSources() {
        for(let i = lightSources.length - 1; i >= 0; i--) {
            let light = lightSources[i];

            if (light.life > 0) {
                light.life--;
            }
            if (light.life === 0) {
                lightSources.splice(i, 1);
                continue;
            }

            if (light.entity) {
                // اگر موجودیت نور از بین رفته (مثل گلوله یا دشمن)، نور را حذف کن
                if (light.entity.health <= 0 || (bullets.indexOf(light.entity) === -1 && light.entity.speed)) {
                     lightSources.splice(i, 1);
                     continue;
                }
                light.x = light.entity.x + (light.entity.width || 0) / 2;
                light.y = light.entity.y + (light.entity.height || 0) / 2;
            }

            if (light.flicker) {
                light.radius = light.baseRadius + (Math.random() - 0.5) * (light.baseRadius * 0.1);
            }
        }
    }

    function drawLighting(cameraX) {
        lightCtx.clearRect(0, 0, canvas.width, canvas.height);

        // ۱. رسم تاریکی محیط
        lightCtx.globalCompositeOperation = 'source-over';
        lightCtx.fillStyle = CONSTANTS.AMBIENT_LIGHT;
        lightCtx.fillRect(0, 0, canvas.width, canvas.height);

        // ۲. "بریدن" سوراخ‌ها برای نورها
        lightCtx.globalCompositeOperation = 'destination-out';

        for(let light of lightSources) {
            const x = light.x - cameraX;
            const y = light.y; // دوربین ما y ندارد

            if (x + light.radius < 0 || x - light.radius > canvas.width) {
                continue; // نور خارج از صفحه است
            }

            const gradient = lightCtx.createRadialGradient(x, y, 0, x, y, light.radius);
            gradient.addColorStop(0, light.color);
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

            lightCtx.fillStyle = gradient;
            lightCtx.beginPath();
            lightCtx.arc(x, y, light.radius, 0, Math.PI * 2);
            lightCtx.fill();
        }

        lightCtx.globalCompositeOperation = 'source-over'; // بازگشت به حالت عادی
    }


    // ===================================================================================
    // بخش ۱۲: منطق رندر (Draw) - (بازنویسی شده)
    // ===================================================================================

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height); // پاک کردن کانواس اصلی

        ctx.save();

        // اعمال لرزش دوربین
        if (camera.shakeTime > 0) {
            let shakeX = (Math.random() - 0.5) * camera.shakeIntensity;
            let shakeY = (Math.random() - 0.5) * camera.shakeIntensity;
            ctx.translate(shakeX, shakeY);
        }

        // اعمال دوربین اصلی
        ctx.translate(-camera.x, 0);

        // --- شروع رندر لایه‌ها ---
        drawBackground();
        platforms.forEach(drawPlatform);

        if (gameState === 'DIALOGUE_HUB') {
            drawHub();
        } else if (gameState === 'PLAYING_FRIENDSHIP') {
            items.forEach(drawItem);
            enemies.forEach(drawEnemy);
        } else if (gameState === 'PLAYING_BETRAYAL') {
             drawDoorsAndTerminals();
        }

        teammates.forEach(drawTeammate);
        if(player.health > 0) drawPlayer();

        bullets.forEach(drawBullet);

        // [FEATURE] رندر ذرات
        particleManager.draw(ctx, camera.x);
        // --- پایان رندر لایه‌ها ---

        ctx.restore();

        // [FEATURE] رندر نورپردازی در پایان
        drawLighting(camera.x);
    }

    /**
     * رسم پس‌زمینه (بدون تغییر)
     */
    function drawBackground() {
        // لایه پایه (آسمان)
        ctx.fillStyle = (gameState === 'PLAYING_FRIENDSHIP') ? '#000' : '#222'; // سیاه برای نورپردازی
        ctx.fillRect(camera.x, 0, canvas.width, canvas.height);

        backgroundLayers.forEach(layer => {
            let img = assets[layer.imgKey];
            if (img && img.complete && img.width > 0) {
                if (gameState === 'PLAYING_FRIENDSHIP' && layer.parallax === 0.0) {
                    ctx.drawImage(img, camera.x, 0, canvas.width, canvas.height);
                } else {
                    let bgWidth = canvas.height * (img.width / img.height);
                    let parallaxX = camera.x * layer.parallax;
                    let startX = Math.floor(parallaxX / bgWidth) * bgWidth;
                    for (let x = startX; x < camera.x + canvas.width; x += bgWidth) {
                        ctx.drawImage(img, x - parallaxX, layer.y, bgWidth, canvas.height);
                    }
                }
            } else if (layer.color) {
                ctx.fillStyle = layer.color;
                ctx.fillRect(camera.x, layer.y, canvas.width, canvas.height);
            }
        });
    }

    function drawPlatform(p) {
        if(p.type === 'crumbling') ctx.globalAlpha = p.life / 100;

        if (p.type === 'ground') {
            ctx.fillStyle = (gameState === 'PLAYING_FRIENDSHIP') ? '#545252' : '#555';
        } else if (p.type === 'vent') {
            ctx.fillStyle = '#3a4a5a';
        } else {
            ctx.fillStyle = (gameState === 'PLAYING_FRIENDSHIP') ? '#666' : '#444';
        }
        ctx.fillRect(p.x, p.y, p.width, p.height);

        if(p.type === 'crumbling') ctx.globalAlpha = 1;
    }

    function drawHub() {
        let img = assets['battery_glowing'];
        // (نورپردازی توسط سیستم نور انجام می‌شود)
        if (img && img.complete) {
            ctx.drawImage(img, battery.x, battery.y, battery.width, battery.height);
        } else {
            ctx.fillStyle = '#ffff99';
            ctx.fillRect(battery.x, battery.y, battery.width, battery.height);
        }
        drawDoorsAndTerminals();
    }

    function drawDoorsAndTerminals() {
        Object.values(doors).forEach(d => {
            if (d.label === "ترمینال") {
                ctx.fillStyle = d.isActivated ? '#00ff00' : '#ff4d4d';
                ctx.fillRect(d.x, d.y, d.width, d.height);
                ctx.fillRect(d.x + 5, d.y + 5, d.width - 10, 10);
                if (d.activation > 0 && !d.isActivated) {
                    ctx.fillStyle = 'rgba(255,255,255,0.5)';
                    ctx.fillRect(d.x, d.y - 10, d.width, 5);
                    ctx.fillStyle = '#00ffc3';
                    ctx.fillRect(d.x, d.y - 10, d.width * (d.activation / 100), 5);
                }
            } else if (d.isLocked === true) {
                ctx.fillStyle = '#ff4d4d';
                ctx.fillRect(d.x, d.y, d.width, d.height);
            } else if (d.isLocked === false) {
                 ctx.fillStyle = '#00ff00';
                 ctx.fillRect(d.x, d.y, d.width, d.height);
            } else {
                ctx.fillStyle = '#00ffc3';
                ctx.fillRect(d.x, d.y, d.width, d.height);
            }

            ctx.fillStyle = 'white';
            ctx.font = '14px Vazirmatn';
            ctx.textAlign = 'center';
            ctx.fillText(d.label, d.x + d.width / 2, d.y - 15);
        });
    }

    function drawPlayer() {
        drawCharacter(player, 'player');
        // draw player name and hearts above
        try{
            ctx.fillStyle = 'white';
            ctx.font = '16px Vazirmatn';
            ctx.textAlign = 'center';
            ctx.fillText(player.name || 'بازیکن', player.x + player.width/2, player.y - 18);
            ctx.fillText(formatHearts(player.health, player.maxHealth), player.x + player.width/2, player.y - 34);
        }catch(e){}
        if (player.shieldTimer > 0) {
            ctx.fillStyle = `rgba(255, 255, 150, ${0.3 + (player.shieldTimer % 10) * 0.03})`;
            ctx.strokeStyle = `rgba(255, 255, 200, 0.8)`;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(player.x + player.width/2, player.y + player.height/2, player.width/2 + 10, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
        }
    }

    function drawTeammate(tm) {
        drawCharacter(tm, 'teammate');
        // draw teammate name and hearts
        try{
            ctx.fillStyle = '#fff';
            ctx.font = '14px Vazirmatn';
            ctx.textAlign = 'center';
            ctx.fillText(tm.name || 'هم‌تیمی', tm.x + tm.width/2, tm.y - 18);
            ctx.fillText(formatHearts(tm.health || (tm.maxHealth||5), tm.maxHealth || 5), tm.x + tm.width/2, tm.y - 32);
        }catch(e){}
        if (tm.shieldTimer > 0) {
            ctx.fillStyle = `rgba(255, 255, 150, 0.3)`;
            ctx.beginPath();
            ctx.arc(tm.x + tm.width/2, tm.y + tm.height/2, tm.width/2 + 10, 0, Math.PI * 2);
            ctx.fill();
        }
