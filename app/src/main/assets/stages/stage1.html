<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مرحله ۱: ماموریت ماه</title>
    <link rel="stylesheet" href="../styles/common.css">
    <link rel="stylesheet" href="../styles/common.css">
    <style>
        @font-face {
            font-family: 'Vazirmatn';
            src: url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-Regular.woff2') format('woff2');
            font-weight: normal; font-style: normal;
        }
        body, html {
            margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%;
            background-color: #0c0a18; font-family: 'Vazirmatn', sans-serif;
        }
        .game-wrapper { position: relative; width: 100%; height: 100%; }
        canvas { display: block; background: #0c0a18; }
        .controls-container {
            position: absolute; bottom: 10px; left: 10px; right: 10px; display: flex;
            justify-content: space-between; user-select: none; -webkit-user-select: none;
            pointer-events: none;
        }
        .control-group {
            display: flex; align-items: center; gap: 10px; pointer-events: auto;
            direction: ltr;
        }
        .control-btn {
            width: 50px; height: 50px; background-color: rgba(199, 129, 70, 0.2);
            border: 2px solid #C78146; border-radius: 50%; display: flex;
            align-items: center; justify-content: center; font-size: 20px; color: white;
            transition: background-color 0.1s, transform 0.1s;
        }
        .control-btn:active { background-color: rgba(199, 129, 70, 0.5); transform: scale(0.95); }

        /* per-stage menu styles removed; common.css provides unified menu styles */
        .menu-btn {
            padding: 1rem 2rem; font-size: 1.2rem; background-color: transparent;
            border: 2px solid #C78146; color: #C78146; border-radius: 8px; width: 200px; text-align: center;
        }
        /* keep a separate class for message buttons so common.js doesn't hide them */
        .message-btn {
            padding: 1rem 2rem; font-size: 1.2rem; background-color: transparent;
            border: 2px solid #C78146; color: #C78146; border-radius: 8px; width: 200px; text-align: center;
        }
        .ui-container {
            position: absolute; top: 15px; left: 15px; color: white;
            font-size: 16px; text-shadow: 1px 1px 2px black; z-index: 50;
        }
        .message-box {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background-color: rgba(0,0,0,0.8); padding: 20px; border-radius: 10px;
            border: 2px solid #C78146; text-align: center; color: white; z-index: 200;
            display: none; max-width: 90%;
        }
        #loading-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #0c0a18; z-index: 1000; display: flex;
            justify-content: center; align-items: center; color: white; font-size: 1.5rem;
            text-align: center;
        }
    </style>
</head>
<body>
<div id="loading-screen">در حال بارگذاری...</div>
<div class="game-wrapper">
    <div class="ui-container" >
        <div id="timer-ui">زمان: --:--</div>
        <div id="oxygen-ui">باتری: ۰ / ۲</div>
        <div id="ammo-ui">تیر: ۰</div>
        <div id="health-ui">سلامتی: ❤️</div>
    </div>
    <canvas id="gameCanvas"></canvas>
    <!-- per-stage menu removed: unified menu (common.js) now controls pause/restart/back-to-menu -->
    <div id="message-box" class="message-box">
        <p id="message-text"></p>
    <button id="message-ok-btn" class="message-btn" >باشه</button>
    </div>
</div>

<div class="controls-container" id="controls" >
    <div class="control-group actions">
        <button class="control-btn" id="shoot-btn">&#x25CE;</button>
        <button class="control-btn" id="jump-btn">&#x25B2;</button>
    </div>
    <div class="control-group movement">
        <button class="control-btn" id="crouch-btn">&#x25BC;</button>
        <button class="control-btn" id="left-btn">&#x25C0;</button>
        <button class="control-btn" id="right-btn">&#x25B6;</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let gamePaused = true;

    const uiContainer = document.querySelector('.ui-container');
    const timerUI = document.getElementById('timer-ui');
    const oxygenUI = document.getElementById('oxygen-ui');
    const ammoUI = document.getElementById('ammo-ui');
    const messageBox = document.getElementById('message-box');
    const messageText = document.getElementById('message-text');
    const messageOkBtn = document.getElementById('message-ok-btn');
    // per-stage menu button removed; common menu will provide a floating open button
    const menuBtn = null;
    const controls = document.getElementById('controls');

    let gameState = 'INTRO';
    let oxygenTimerInterval, partTimerInterval;

    const player = { name: (function(){ try{ return sessionStorage.getItem('selectedCharacter') || localStorage.getItem('selectedCharacter') || 'کوروش'; }catch(e){ return 'کوروش'; } })(), x: 50, y: 0, width: 50, height: 70, speed: 4, velocityX: 0, velocityY: 0, isJumping: false, isCrouching: false, isShooting: false, shootTimer: 0, hasGun: false, ammo: 0, batteries: 0, health: 3, maxHealth: 3 };
    // Teammates: three other astronauts who actively assist
    const allCharacterNames = ['کوروش', 'داریوش', 'سهراب', 'رستم'];
    const teammates = [];
    const keys = { right: false, left: false, jump: false, crouch: false, shoot: false };
    const gravity = 0.4;
    const jumpPower = -10;
    let lastDirection = 'right';
    let cameraX = 0;
    let currentImage;

    const assets = {};
    const assetPaths = {
        'idle_no_gun': '../images/player_idle_no_gun.png', 'idle_gun': '../images/player_idle_gun.png',
        'walk_no_gun': '../images/player_walk_no_gun.png', 'walk_gun': '../images/player_walk_gun.png',
        'jump_no_gun': '../images/player_jump_no_gun.png', 'jump_gun': '../images/player_jump_gun.png',
        'crouch_no_gun': '../images/player_crouch_no_gun.png', 'crouch_gun': '../images/player_crouch_gun.png',
        'zombie': '../images/zombie.png', 'gun': '../images/gun.png', 'battery': '../images/battery.png', 'rocket_part': '../images/rocket_part.png'
    };

    let bullets = [], enemies = [], items = [];
    let enemyBullets = [];
    const platforms = [{ x: 0, y: 0, width: 3000, height: 40 }];
    let stars = [];

    function generateStars() {
        for(let i = 0; i < 200; i++) {
            stars.push({
                x: Math.random() * platforms[0].width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2 + 0.5,
                parallax: Math.random() * 0.5 + 0.1
            });
        }
    }

    function showMessage(text, onConfirm) {
        gamePaused = true;
        messageText.innerText = text;
        messageBox.style.display = 'block';
        const confirmHandler = () => {
            messageBox.style.display = 'none';
            if(onConfirm) onConfirm();
        };
        messageOkBtn.addEventListener('click', confirmHandler, { once: true });
    }

    function startGame() {
         showMessage("موشک خراب شده! برای زنده موندن، باید کپسول اکسیژنت رو شارژ کنی. تفنگ رو بردار و با کشتن آدم فضایی‌ها باتری جمع کن. برای شارژ کامل به ۲ باتری نیاز داری.", () => {
            gameState = 'OXYGEN_QUEST';
            startTimer(300, timerUI, () => gameOver("زمان تموم شد! اکسیژن کافی جمع نکردی."));
            gamePaused = false;
            requestAnimationFrame(gameLoop);
        });
    }

    function startPartQuest() {
        stopTimer('oxygen');
        showMessage("عالیه! اکسیژن شارژ شد. حالا باید قطعه گمشده موشک رو پیدا کنی. فقط ۳ دقیقه وقت داری!", () => {
            gameState = 'PART_QUEST';
            items.push({ type: 'rocket_part', x: platforms[0].width - 150, y: canvas.height - 150, width: 40, height: 40, isCollected: false });
            startTimer(180, timerUI, () => gameOver("وقت تموم شد! نتونستی قطعه رو پیدا کنی."));
            gamePaused = false;
            requestAnimationFrame(gameLoop);
        });
    }

    function startTimer(duration, element, onEnd) {
        let timer = duration;
        const update = () => {
            let minutes = parseInt(timer / 60, 10);
            let seconds = parseInt(timer % 60, 10);
            minutes = minutes < 10 ? "0" + minutes : minutes;
            seconds = seconds < 10 ? "0" + seconds : seconds;
            element.textContent = `زمان: ${minutes}:${seconds}`;
            if (--timer < 0 && gameState !== 'GAME_OVER' && gameState !== 'WIN') {
                onEnd();
                if(gameState === 'OXYGEN_QUEST') stopTimer('oxygen'); else stopTimer('part');
            }
        };
        update();
        const intervalId = setInterval(update, 1000);
        if (gameState === 'OXYGEN_QUEST' || gameState === 'INTRO') oxygenTimerInterval = intervalId; else partTimerInterval = intervalId;
    }

    function stopTimer(type) {
        if (type === 'oxygen' && oxygenTimerInterval) clearInterval(oxygenTimerInterval);
        if (type === 'part' && partTimerInterval) clearInterval(partTimerInterval);
    }

    function playTransitionVideo(videoSrc) {
        try {
            window.shouldAutoExitOnVideoEnd = true;
            if (videoOverlay) videoOverlay.style.display = 'flex';
            if (window.playStageVideo) {
                window.playStageVideo(videoSrc);
            } else if (videoPlayer) {
                videoPlayer.src = videoSrc;
                videoPlayer.play();
            }
        } catch (e) {
            console.warn(e);
            window.location.href = '../level-select.html';
        }
    }

    function handleWinAndSave() {
        // Unlock next level and play the transition video before returning to level select.
        try{
            const unlocked = parseInt(localStorage.getItem('unlockedLevel') || '1', 10) || 1;
            const next = Math.max(unlocked, 2);
            localStorage.setItem('unlockedLevel', String(next));
        }catch(e){ console.warn(e); }
        playTransitionVideo('../videos/moon_to_mars.mp4');
    }

    function winGame() {
        if (gameState === 'WIN') return;
        gameState = 'WIN';
        stopTimer('part');
        showMessage("موفق شدی! قطعه رو پیدا کردی و موشک تعمیر شد. آماده برای مرحله بعد!", handleWinAndSave);
    }

    function gameOver(message) {
        if (gameState === 'GAME_OVER') return;
        gameState = 'GAME_OVER';
        stopTimer('oxygen');
        stopTimer('part');
        showMessage(message, () => window.location.href = '../level-select.html');
    }

    function spawnEnemies(count) {
        enemies = [];
        for(let i=0; i<count; i++){
            enemies.push({ x: 500 + Math.random() * (platforms[0].width - 600), y: canvas.height - 40 - 70, width: 50, height: 70, hp: 3, speed: Math.random() * 0.6 + 0.3, direction: Math.random() < 0.5 ? 1 : -1, shootCooldown: Math.floor(Math.random()*200)+120 });
        }
    }

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        platforms[0].y = canvas.height - 40;
        player.y = canvas.height - player.height - 40;
    }

    function gameLoop() {
        if (gamePaused) return;
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    function update() {
        if (player.health <= 0) return;
        ammoUI.textContent = `تیر: ${player.ammo}`;
        oxygenUI.textContent = `باتری: ${player.batteries} / 2`;

        if (player.shootTimer > 0) player.shootTimer--; else player.isShooting = false;

        player.velocityX = 0;
        if (keys.left && !player.isCrouching) player.velocityX = -player.speed;
        if (keys.right && !player.isCrouching) player.velocityX = player.speed;
        if (player.velocityX !== 0) lastDirection = player.velocityX > 0 ? 'right' : 'left';

        player.isCrouching = keys.crouch && !player.isJumping;

        if (keys.jump && !player.isJumping) {
            player.velocityY = jumpPower;
            player.isJumping = true;
        }

        player.y += player.velocityY;
        player.x += player.velocityX;
        player.velocityY += gravity;

        platforms.forEach(p => {
            if (player.x < p.x + p.width && player.x + player.width > p.x && player.y + player.height > p.y && player.y + player.height < p.y + p.height + player.velocityY) {
                player.y = p.y - player.height;
                player.velocityY = 0;
                if(player.isJumping) player.isJumping = false;
            }
        });

        if (player.x < 0) player.x = 0;
        if (player.x + player.width > platforms[0].width) player.x = platforms[0].width - player.width;

        bullets.forEach((b, bIndex) => {
            b.x += b.direction === 'right' ? 10 : -10;
            if (b.x < cameraX || b.x > cameraX + canvas.width) { bullets.splice(bIndex, 1); return; }
            enemies.forEach((e, eIndex) => {
                if (b.x < e.x + e.width && b.x + 10 > e.x && b.y < e.y + e.height && b.y + 5 > e.y) {
                    bullets.splice(bIndex, 1);
                    e.hp--;
                    if(e.hp <= 0) {
                        enemies.splice(eIndex, 1);
                        items.push({ type: 'battery', x: e.x, y: e.y + e.height - 20, width: 20, height: 20, isCollected: false });
                        player.ammo += 10;
                    }
                }
            });
        });

        // Update enemy bullets
        enemyBullets.forEach((b, idx) => {
            b.x += b.vx; b.y += b.vy;
            if (b.x < cameraX - 50 || b.x > cameraX + canvas.width + 50) { enemyBullets.splice(idx,1); return; }
            // collision with player
            if (player.x < b.x + b.width && player.x + player.width > b.x && player.y < b.y + b.height && player.y + player.height > b.y) {
                player.health -= b.damage || 0.25;
                enemyBullets.splice(idx,1);
                if (player.health <= 0) gameOver('مراقب باش! آدم فضایی‌ها تو رو گرفتن.');
            }
            // collision with teammates
            teammates.forEach((tm) => {
                if (tm.x < b.x + b.width && tm.x + 35 > b.x && tm.y < b.y + b.height && tm.y + 35 > b.y) {
                    tm.health -= b.damage || 0.25;
                    enemyBullets.splice(idx,1);
                }
            });
        });

        enemies.forEach(e => {
            e.x += e.speed * e.direction;
            if(e.x < 100 || e.x > platforms[0].width - 100) e.direction *= -1;
            // enemy shooting
            if (!e.shootCooldown) e.shootCooldown = Math.floor(Math.random()*200)+120;
            e.shootCooldown--;
            if (e.shootCooldown <= 0) {
                // shoot toward player
                const dir = (player.x + player.width/2) - (e.x + e.width/2);
                const angle = Math.atan2((player.y + player.height/2) - (e.y + e.height/2), dir);
                enemyBullets.push({ x: e.x + e.width/2, y: e.y + e.height/2, vx: Math.cos(angle)*6, vy: Math.sin(angle)*6, width:6, height:4, damage: 0.25 });
                e.shootCooldown = Math.floor(Math.random()*200)+180;
            }
            if (player.x < e.x + e.width && player.x + player.width > e.x && player.y < e.y + e.height && player.y + player.height > e.y) {
                player.health = 0;
                gameOver("مراقب باش! آدم فضایی‌ها تو رو گرفتن.");
            }
        });

        // Teammates: follow & engage enemies actively
        teammates.forEach(tm => {
            // if any enemy nearby, move toward them and shoot
            let nearest = null; let nd = Infinity;
            enemies.forEach(e => { const d = Math.hypot((e.x - tm.x),(e.y - tm.y)); if (d < nd) { nd = d; nearest = e; } });
            if (nearest && nd < 800) {
                // move towards enemy but keep offset from player
                const dir = nearest.x - tm.x;
                tm.x += Math.sign(dir) * Math.min(tm.speed*2, Math.abs(dir));
                if (!tm.shootTimer) tm.shootTimer = Math.floor(Math.random()*60)+30;
                tm.shootTimer--;
                if (tm.shootTimer <= 0) {
                    bullets.push({ x: tm.x + 35, y: tm.y + 30, width: 8, height:4, direction: (nearest.x>tm.x?'right':'left'), isPlayer: true });
                    tm.shootTimer = Math.floor(Math.random()*80)+40;
                }
            } else {
                // idle follow player
                const followDist = (tm.indexOffset || 1) * 80;
                const targetX = player.x - followDist + (Math.random()*20-10);
                if (Math.abs(tm.x - targetX) > 2) tm.x += Math.sign(targetX - tm.x) * Math.min(2, Math.abs(targetX - tm.x));
            }
            // clamp
            if (tm.x < 0) tm.x = 0;
            if (tm.x > platforms[0].width) tm.x = platforms[0].width;
            if (tm.health <= 0) tm.dead = true;
        });

        items.forEach((item) => {
            if (player.x < item.x + item.width && player.x + player.width > item.x && player.y < item.y + item.height && player.y + player.height > item.y && !item.isCollected) {
                item.isCollected = true;
                if (item.type === 'gun') {
                    player.hasGun = true;
                    player.ammo += 5;
                } else if (item.type === 'battery' && gameState === 'OXYGEN_QUEST') {
                    player.batteries++;
                    if (player.batteries >= 2) startPartQuest();
                } else if (item.type === 'rocket_part' && gameState === 'PART_QUEST') {
                    winGame();
                }
            }
        });
        items = items.filter(item => !item.isCollected);

        let state = 'idle';
        if (player.isJumping) state = 'jump';
        else if (player.isCrouching) state = 'crouch';
        else if (keys.left || keys.right) state = 'walk';

        state += player.hasGun ? '_gun' : '_no_gun';
        currentImage = assets[state];

        cameraX = player.x - canvas.width / 3;
        if (cameraX < 0) cameraX = 0;
        if (cameraX > platforms[0].width - canvas.width) cameraX = platforms[0].width - canvas.width;
    }

    function draw() {
        ctx.save();
        ctx.translate(-cameraX, 0);

        ctx.fillStyle = '#0c0a18';
        ctx.fillRect(cameraX, 0, canvas.width, canvas.height);
        stars.forEach(star => {
            const x = star.x - cameraX * star.parallax;
            ctx.fillStyle = `rgba(255, 255, 255, 0.8)`;
            ctx.fillRect(x, star.y, star.size, star.size);
        });

        ctx.fillStyle = '#616161';
        ctx.fillRect(platforms[0].x, platforms[0].y, platforms[0].width, platforms[0].height);
        ctx.fillStyle = '#545454';
        for (let i = 0; i < platforms[0].width; i += 200) {
             ctx.beginPath();
             ctx.arc(i + 50 + (i % 400), platforms[0].y + 10, 30, 0, Math.PI, false);
             ctx.fill();
        }

        if (currentImage && currentImage.complete) {
            ctx.save();
            if (lastDirection === 'left') {
                ctx.scale(-1, 1);
                ctx.drawImage(currentImage, -player.x - player.width, player.y, player.width, player.height);
            } else {
                ctx.drawImage(currentImage, player.x, player.y, player.width, player.height);
            }
            ctx.restore();
        }

        enemies.forEach(e => {
            if (assets.zombie && assets.zombie.complete) ctx.drawImage(assets.zombie, e.x, e.y, e.width, e.height);
        });

        items.forEach(item => {
            let img = assets[item.type];
            if (img && img.complete) ctx.drawImage(img, item.x, item.y, item.width, item.height);
        });

        ctx.fillStyle = '#ffeb3b';
        bullets.forEach(b => ctx.fillRect(b.x, b.y, b.width, b.height));

        // draw enemy bullets
        ctx.fillStyle = '#ff8a65';
        enemyBullets.forEach(b => ctx.fillRect(b.x, b.y, b.width, b.height));

        // draw teammates
        teammates.forEach(tm => {
            if (tm.dead) return;
            const img = assets['idle_gun'] || null;
            if (img && img.complete) ctx.drawImage(img, tm.x, tm.y, 70, 70);
            else { ctx.fillStyle = 'green'; ctx.fillRect(tm.x, tm.y, 35, 35); }

            // name & health
            ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(tm.x-10, tm.y-40, 90, 36);
            ctx.fillStyle = '#fff'; ctx.font = '14px Vazirmatn'; ctx.textAlign = 'center';
            ctx.fillText(tm.name, tm.x + 35, tm.y - 22);
            ctx.fillText('❤'.repeat(Math.max(0, Math.round(tm.health))) , tm.x + 35, tm.y - 6);
        });

        ctx.restore();
    }

    function init() {
        document.getElementById('loading-screen').style.display = 'none';
    uiContainer.style.display = 'block';
    // per-stage menu button removed; common menu open button will be created by common.js
    try { if (menuBtn) menuBtn.style.display = 'block'; } catch(e) { /* ignore if removed */ }
        controls.style.display = 'flex';

        window.addEventListener('resize', resizeCanvas, false);
        resizeCanvas();
        generateStars();
        items.push({ type: 'gun', x: 200, y: canvas.height - 40 - 40, width: 40, height: 20, isCollected: false });
        // initialize teammates based on selected character
        try {
            const others = allCharacterNames.filter(n => n !== player.name);
            teammates.length = 0;
            for (let i = 0; i < Math.min(3, others.length); i++) {
                teammates.push({ name: others[i], x: player.x - 120 + i*120 + 50, y: canvas.height - 40 - 70, health: 3, maxHealth:3, speed: 1 + Math.random(), shootTimer: Math.floor(Math.random()*60), indexOffset: i+1, dead: false, quotes: [] });
            }
        } catch (e) { console.warn(e); }
        spawnEnemies(5);
        startGame();
    }

    function loadAssets(callback) {
        const loadingScreen = document.getElementById('loading-screen');
        let loadedCount = 0;
        const totalAssets = Object.keys(assetPaths).length;
        if (totalAssets === 0) { callback(); return; }
        const loadingTimeout = setTimeout(() => {
            loadingScreen.innerHTML = `خطا در بارگذاری!`;
        }, 10000);

        for (const key in assetPaths) {
            assets[key] = new Image();
            assets[key].onload = () => {
                loadedCount++;
                if (loadedCount === totalAssets) {
                    clearTimeout(loadingTimeout);
                    callback();
                }
            };
            assets[key].onerror = () => {
                clearTimeout(loadingTimeout);
                loadingScreen.innerHTML = `خطا: فایل ${assetPaths[key]} پیدا نشد!`;
            };
            assets[key].src = assetPaths[key];
        }
    }

    const addTouchListeners = (btn, key) => {
        btn.addEventListener('touchstart', e => { e.preventDefault(); keys[key] = true; }, { passive: false });
        btn.addEventListener('touchend', e => { e.preventDefault(); keys[key] = false; }, { passive: false });
    };
    addTouchListeners(document.getElementById('left-btn'), 'left');
    addTouchListeners(document.getElementById('right-btn'), 'right');
    addTouchListeners(document.getElementById('jump-btn'), 'jump');
    addTouchListeners(document.getElementById('crouch-btn'), 'crouch');
    document.getElementById('shoot-btn').addEventListener('touchstart', e => {
        e.preventDefault();
        if (player.hasGun && player.ammo > 0 && !player.isShooting) {
            player.isShooting = true;
            player.shootTimer = 15;
            player.ammo--;
            bullets.push({
                x: player.x + (lastDirection === 'right' ? player.width : -10),
                y: player.y + (player.isCrouching ? 45 : 30),
                width: 10, height: 5,
                direction: lastDirection
            });
        }
    }, { passive: false });
