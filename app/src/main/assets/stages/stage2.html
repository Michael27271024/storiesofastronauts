<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مرحله ۲: دفاع از ایستگاه</title>
    <link rel="stylesheet" href="../styles/common.css">
    <style>
        @font-face {
            font-family: 'Vazirmatn';
            src: url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-Regular.woff2') format('woff2');
            font-weight: normal; font-style: normal;
        }
        body, html {
            margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%;
            background-color: #000; font-family: 'Vazirmatn', sans-serif; color: white;
        }
        .game-wrapper { position: relative; width: 100%; height: 100%; }
        canvas { display: block; }
        #loading-screen, #video-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000; z-index: 1000; display: flex;
            justify-content: center; align-items: center; text-align: center;
            font-size: 1.5rem;
        }
        .ui-container {
            position: absolute; top: 15px; left: 15px; font-size: 1.2rem;
            text-shadow: 1px 1px 3px #000; z-index: 50;
            background: rgba(0,0,0,0.3); padding: 5px 10px; border-radius: 8px;
        }
        .message-box, #dialogue-box {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background-color: rgba(0,0,0,0.85); padding: 20px; border-radius: 10px;
            border: 2px solid #00d9ff; text-align: center; z-index: 200;
            display: none; max-width: 90%; box-sizing: border-box;
        }
        #dialogue-images { display: flex; justify-content: center; align-items: center; gap: 15px; margin-bottom: 15px; }
        #dialogue-images img { max-width: 80px; max-height: 80px; border-radius: 5px; border: 1px solid #00d9ff; }
        .dialogue-btn, .message-btn {
            padding: 0.75rem 1.5rem; font-size: 1rem; background-color: transparent;
            border: 2px solid #00d9ff; color: #00d9ff; border-radius: 8px; margin-top: 15px; cursor: pointer;
        }
        .controls-container {
            position: absolute; bottom: 20px; width: 100%; display: flex;
            justify-content: space-around; align-items: center; user-select: none; -webkit-user-select: none;
        }
        .control-btn {
            width: 65px; height: 65px;
            background: radial-gradient(circle, rgba(0, 217, 255, 0.2) 0%, rgba(0, 217, 255, 0.1) 70%);
            border: 2px solid #00d9ff; box-shadow: 0 0 10px rgba(0, 217, 255, 0.5);
            border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; color: white;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .control-btn:active { transform: scale(0.95); box-shadow: 0 0 15px rgba(0, 217, 255, 0.8); }
        #video-player { width: 100%; height: 100%; object-fit: cover; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
        .shake { animation: shake 0.3s linear; }
    </style>
</head>
<body>
<div id="loading-screen">در حال بارگذاری مرحله ۲...</div>
<div class="game-wrapper" id="game-wrapper">
    <div class="ui-container">
        <div id="timer-ui">زمان باقی‌مانده: ۰۵:۰۰</div>
        <div id="station-health-ui">سلامت ایستگاه: ۱۰۰%</div>
        <div id="wave-ui">موج: ۱ / ۱۰</div>
    </div>
    <canvas id="gameCanvas"></canvas>
    <div class="message-box" id="message-box">
        <p id="message-text"></p>
        <button id="message-ok-btn" class="message-btn">بعدی</button>
    </div>
    <div id="dialogue-box">
        <div id="dialogue-images"></div>
        <p id="dialogue-text"></p>
        <button id="dialogue-next-btn" class="dialogue-btn">بعدی</button>
    </div>
    <div class="controls-container" id="controls">
        <button class="control-btn" id="right-btn">&#x25B6;</button>
        <button class="control-btn" id="shoot-btn">&#x25CE;</button>
        <button class="control-btn" id="left-btn">&#x25C0;</button>
    </div>
</div>
<div id="video-overlay" style="display:none;">
    <video id="video-player" playsinline></video>
</div>

<script src="../scripts/common.js"></script>
<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const gameWrapper = document.getElementById('game-wrapper');
    let gamePaused = true;
    let gameState = 'LOADING';
    let stars = [];

    const loadingScreen = document.getElementById('loading-screen');
    const uiContainer = document.querySelector('.ui-container');
    const timerUI = document.getElementById('timer-ui');
    const stationHealthUI = document.getElementById('station-health-ui');
    const waveUI = document.getElementById('wave-ui');
    const controls = document.getElementById('controls');
    const messageBox = document.getElementById('message-box');
    const messageText = document.getElementById('message-text');
    const messageOkBtn = document.getElementById('message-ok-btn');
    const videoOverlay = document.getElementById('video-overlay');
    const videoPlayer = document.getElementById('video-player');

    const dialogueBox = document.getElementById('dialogue-box');
    const dialogueImagesContainer = document.getElementById('dialogue-images');
    const dialogueText = document.getElementById('dialogue-text');
    const dialogueNextBtn = document.getElementById('dialogue-next-btn');

    const player = { name: "بازیکن", x: 0, y: 0, width: 80, height: 60, speed: 8, muzzleFlash: 0 };
    let teammates = [];
    const allCharacterNames = ['کوروش', 'داریوش', 'سهراب', 'رستم'];

    const keys = { left: false, right: false };
    let bullets = [], enemies = [], motherShips = [];
    let stationHealth = 100;
    let gameTimer = 300;
    let currentPhase = 1;

    const assets = {};
    const assetPaths = {
        'player': '../images/player_idle_gun.png',
        'enemy': '../images/alien_soldier.png',
        'mothership': '../images/alien_ship.png',
        'hostage': '../images/alien_hostage.png',
        'video': '../videos/moon_to_mars.mp4',
        'army_of_stars': '../images/army_of_stars_logo.png',
        'moon_guardians': '../images/starspawn_flag.png'
    };

    function getQueryParam(param) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(param);
    }

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        player.y = canvas.height - player.height - 10;
        initAstronauts();
        generateStars();
    }

    function initAstronauts() {
        const selectedCharacter = (function(){ try{ return sessionStorage.getItem('selectedCharacter') || localStorage.getItem('selectedCharacter') || getQueryParam('character') || 'کوروش'; }catch(e){ return getQueryParam('character') || 'کوروش'; } })();
        player.name = selectedCharacter;

        teammates = [];
        const remainingNames = allCharacterNames.filter(name => name !== selectedCharacter);
        const positions = [0.2, 0.4, 0.6, 0.8];

        const playerPosIndex = Math.floor(Math.random() * positions.length);
        player.x = canvas.width * positions[playerPosIndex] - player.width / 2;
        positions.splice(playerPosIndex, 1);

        for (let i = 0; i < 3; i++) {
            const posX = canvas.width * positions[i] - player.width / 2;
            teammates.push({
                name: remainingNames[i],
                x: posX,
                y: canvas.height - player.height - 10,
                width: 80,
                height: 60,
                direction: Math.random() < 0.5 ? 1 : -1,
                speed: Math.random() * 1 + 0.5,
                patrolCenter: posX,
                patrolWidth: 50,
                shootCooldown: Math.random() * 100 + 80
            });
        }
    }

    function setPlayerTargetShip() {
        motherShips.forEach(ship => ship.isPlayerTarget = false);
        const aliveShips = motherShips.filter(ship => !ship.isDestroyed);
        if (aliveShips.length > 0) {
            const randomShip = aliveShips[Math.floor(Math.random() * aliveShips.length)];
            randomShip.isPlayerTarget = true;
        }
    }

    function resetMotherShips() {
        motherShips.forEach(ship => {
            ship.isDestroyed = false;
            ship.hp = 3;
            ship.spawnCooldown = Math.random() * 150 + 100;
        });
    }

    function generateStars() {
        stars = [];
        for (let i = 0; i < 150; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2 + 0.5,
                speed: Math.random() * 0.5 + 0.1
            });
        }
    }

    let storyMessageIndex = 0;
    const introStory = [
        "بعد از پایان مرحله یک، فهمیدید که فقط ۱۰۰ کیلومتر با ایستگاه فضایی فاصله دارید. برای همین سوار موشک شدید و به آنجا رفتید.",
        "ایستگاه پر از امکانات و تجهیزات بود. همانطور که در حال گشت و گذار بودید، به یک سفینه فضایی غریبه برخوردید.",
        "ناگهان، با خبر شدن فضایی‌ها از حضور شما، همه چیز به هم ریخت! آنها برای نابودی شما سرباز فرستادند...",
        "آماده شوید! باید در ۱۰ موج از ایستگاه دفاع کنید و نگذارید وارد شوند!"
    ];

    function showNextStoryMessage() {
        gamePaused = true;
        if (storyMessageIndex < introStory.length) {
            messageText.innerText = introStory[storyMessageIndex];
            messageBox.style.display = 'block';
            if (storyMessageIndex === introStory.length - 1) {
                messageOkBtn.innerText = "شروع مبارزه";
            } else {
                messageOkBtn.innerText = "بعدی";
            }
            storyMessageIndex++;
            messageOkBtn.addEventListener('click', showNextStoryMessage, { once: true });
        } else {
            messageBox.style.display = 'none';
            startDefense();
        }
    }

    function startDefense() {
        gameState = 'DEFENDING';
        gamePaused = false;

        const gameTimerInterval = setInterval(() => {
            if (!gamePaused) gameTimer--;
            let minutes = Math.floor(gameTimer / 60).toString().padStart(2, '0');
            let seconds = (gameTimer % 60).toString().padStart(2, '0');
            timerUI.textContent = `زمان باقی‌مانده: ${minutes}:${seconds}`;

            const waveDuration = 30;
            const totalWaves = 10;

            if (!gamePaused && gameTimer % waveDuration === 0 && gameTimer > 0 && gameTimer < 300) {
                gamePaused = true;
                currentPhase++;
                waveUI.textContent = `موج: ${currentPhase} / ${totalWaves}`;

                stationHealth = 100;
                stationHealthUI.textContent = `سلامت ایستگاه: ${stationHealth}%`;

                resetMotherShips();
                const message = currentPhase === totalWaves ? "موج نهایی از راه رسید! مقاومت کنید!" : `موج ${currentPhase} دشمنان در راه است!`;
                showSingleMessage(message, () => {
                    gamePaused = false;
                    setPlayerTargetShip();
                });
            }

            if (gameTimer <= 0) {
                clearInterval(gameTimerInterval);
                winGame();
            }
        }, 1000);

        spawnMotherShips();
        gameLoop();
    }

    function spawnMotherShips() {
        motherShips = [];
        const count = 7;
        for (let i = 0; i < count; i++) {
             motherShips.push({
                x: (canvas.width / (count + 1)) * (i + 1) - 50,
                y: 20,
                width: 100,
                height: 80,
                spawnCooldown: Math.random() * 150 + 100,
                isPlayerTarget: false,
                isDestroyed: false,
                hp: 3
            });
        }
        setPlayerTargetShip();
    }

    function gameLoop() {
        if (gamePaused) {
            requestAnimationFrame(gameLoop);
            return;
        }
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    function update() {
        if (keys.left && player.x > 0) player.x -= player.speed;
        if (keys.right && player.x < canvas.width - player.width) player.x += player.speed;

        teammates.forEach(tm => {
            tm.x += tm.speed * tm.direction;
            const minX = tm.patrolCenter - tm.patrolWidth;
            const maxX = tm.patrolCenter + tm.patrolWidth;
            if ((tm.x < minX && tm.direction < 0) || (tm.x > maxX && tm.direction > 0)) {
                tm.direction *= -1;
            }
        });

        if (player.muzzleFlash > 0) player.muzzleFlash--;

        teammates.forEach(tm => {
            tm.shootCooldown--;
            if (tm.shootCooldown <= 0 && enemies.length > 0) {
                let closestEnemy = enemies[0];
                let minDistance = Infinity;
                enemies.forEach(enemy => {
                    const distance = Math.hypot(enemy.x - tm.x, enemy.y - tm.y);
                    if (distance < minDistance) {
                        minDistance = distance;
                        closestEnemy = enemy;
                    }
                });
                const angle = Math.atan2(closestEnemy.y - tm.y, closestEnemy.x - tm.x);
                bullets.push({
                    x: tm.x + tm.width / 2 - 2.5, y: tm.y, width: 5, height: 15,
                    vx: Math.cos(angle) * 8, vy: Math.sin(angle) * 8
                });
                tm.shootCooldown = Math.random() * 100 + 80;
            }
        });

        bullets.forEach((bullet, bIndex) => {
            bullet.x += bullet.vx || 0;
            bullet.y += bullet.vy || -8;
            if (bullet.y < 0 || bullet.y > canvas.height || bullet.x < 0 || bullet.x > canvas.width) {
                 bullets.splice(bIndex, 1);
            }

            enemies.forEach((enemy, eIndex) => {
                if (bullet.x < enemy.x + enemy.width && bullet.x + bullet.width > enemy.x &&
                    bullet.y < enemy.y + enemy.height && bullet.y + bullet.height > enemy.y) {
                    bullets.splice(bIndex, 1);
                    enemies.splice(eIndex, 1);
                }
            });

            motherShips.forEach((ship) => {
                 if (!ship.isDestroyed && bullet.x < ship.x + ship.width && bullet.x + bullet.width > ship.x &&
                    bullet.y < ship.y + ship.height && bullet.y + bullet.height > ship.y) {
                    bullets.splice(bIndex, 1);
                    ship.hp--;
                    if (ship.hp <= 0) {
                        ship.isDestroyed = true;
                        if (ship.isPlayerTarget) {
                            setPlayerTargetShip();
                        }
                    }
                }
            });
        });

        motherShips.forEach(ship => {
            if (ship.isDestroyed) return;
            ship.spawnCooldown--;
            if (ship.spawnCooldown <= 0) {
                enemies.push({
                    x: ship.x + ship.width / 2 - 15, y: ship.y + ship.height,
                    width: 30, height: 40, speed: Math.random() * 1 + 0.5
                });
                ship.spawnCooldown = Math.random() * 200 + 150;
            }
        });

        enemies.forEach((enemy, eIndex) => {
            enemy.y += enemy.speed;
            if (enemy.y > canvas.height) {
                enemies.splice(eIndex, 1);
                stationHealth -= 5;
                stationHealthUI.textContent = `سلامت ایستگاه: ${Math.max(0, stationHealth)}%`;
                gameWrapper.classList.add('shake');
                setTimeout(() => gameWrapper.classList.remove('shake'), 300);
                if (stationHealth <= 0) gameOver();
            }
        });
    }

    function draw() {
        ctx.fillStyle = '#0c0a18';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
        stars.forEach(star => {
            star.y += star.speed;
            if (star.y > canvas.height) {
                star.y = 0;
                star.x = Math.random() * canvas.width;
            }
            ctx.fillRect(star.x, star.y, star.size, star.size);
        });

        if (assets.player && assets.player.complete) {
            ctx.drawImage(assets.player, player.x, player.y, player.width, player.height);
            ctx.fillStyle = 'white';
            ctx.font = '14px Vazirmatn';
            ctx.textAlign = 'center';
            ctx.fillText(player.name, player.x + player.width / 2, player.y - 10);

            teammates.forEach(tm => {
                ctx.drawImage(assets.player, tm.x, tm.y, tm.width, tm.height);
                ctx.fillText(tm.name, tm.x + tm.width / 2, tm.y - 10);
            });
        }

        if (player.muzzleFlash > 0) {
            ctx.fillStyle = 'rgba(255, 255, 0, 0.8)';
            ctx.beginPath();
            ctx.arc(player.x + player.width / 2, player.y, 10, 0, Math.PI * 2);
            ctx.fill();
        }

        motherShips.forEach(ship => {
            if (assets.mothership && assets.mothership.complete){
                if (ship.isDestroyed) {
                    ctx.globalAlpha = 0.4;
                    ctx.drawImage(assets.mothership, ship.x, ship.y, ship.width, ship.height);
                } else {
                    ctx.globalAlpha = 0.6 + (ship.hp / 3) * 0.4;
                    ctx.drawImage(assets.mothership, ship.x, ship.y, ship.width, ship.height);
                }
                ctx.globalAlpha = 1;
            }
            if (ship.isPlayerTarget && !ship.isDestroyed) {
                ctx.strokeStyle = 'red';
                ctx.lineWidth = 3;
                ctx.setLineDash([5, 5]);
                ctx.strokeRect(ship.x - 5, ship.y - 5, ship.width + 10, ship.height + 10);
                ctx.setLineDash([]);
            }
        });

        enemies.forEach(enemy => {
             if(assets.enemy && assets.enemy.complete){
                ctx.drawImage(assets.enemy, enemy.x, enemy.y, enemy.width, enemy.height);
            }
        });

        bullets.forEach(bullet => {
            ctx.fillStyle = '#00d9ff';
            ctx.shadowColor = '#00d9ff';
            ctx.shadowBlur = 10;
            ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
        });
        ctx.shadowBlur = 0;
    }

    function winGame() {
        gamePaused = true;
        gameState = 'WIN_DIALOGUE';
        startEndDialogue();
    }

    function gameOver() {
        gamePaused = true;
        gameState = 'GAME_OVER';
        showSingleMessage("ایستگاه فضایی نابود شد! دوباره تلاش کن.", () => {
            window.location.href = '../level-select.html';
        });
    }

    let dialogueIndex = 0;
    const endDialogueScript = [
        { text: "شما پیروز شدید! بعد از پایان مبارزه، یک سرباز فضایی زنده پیدا کردید و او را برای بازجویی بردید.", images: [] },
        { text: "ما دو دسته ایم...", images: ['hostage'] },
        { text: "دسته اول ارتش ستارگان که از سیاره مریخ و زحل محافظت می‌کنند.", images: ['hostage', 'army_of_stars'] },
        { text: "و دسته دوم، ارتش محافظان ماه، که ما میشویم.", images: ['hostage', 'moon_guardians'] },
        { text: "با این اطلاعات جدید، ماجراجویی در ماه به پایان رسید و شما برای سفر به سیاره بعدی آماده شدید...", images: [] }
    ];

    function startEndDialogue() {
        dialogueIndex = 0;
        dialogueBox.style.display = 'block';
        controls.style.display = 'none';
        uiContainer.style.display = 'none';
        showNextEndDialogue();
    }

    function showNextEndDialogue() {
        if (dialogueIndex >= endDialogueScript.length) {
            dialogueBox.style.display = 'none';
            playFinalVideo();
            return;
        }
        const line = endDialogueScript[dialogueIndex];
        dialogueText.textContent = line.text;

        dialogueImagesContainer.innerHTML = '';
        if (line.images && line.images.length > 0) {
            line.images.forEach(imgKey => {
                if (assets[imgKey] && assets[imgKey].complete) {
                    const imgElement = document.createElement('img');
                    imgElement.src = assets[imgKey].src;
                    dialogueImagesContainer.appendChild(imgElement);
                }
            });
            dialogueImagesContainer.style.display = 'flex';
        } else {
            dialogueImagesContainer.style.display = 'none';
        }

        dialogueIndex++;
    }

    function playFinalVideo() {
        gameState = 'PLAY_VIDEO';
        videoOverlay.style.display = 'flex';
        if (window.playStageVideo) {
            try { window.playStageVideo(assets.video.src); } catch (e) { console.warn(e); }
        } else {
            videoPlayer.src = assets.video.src;
            videoPlayer.play();
        }
    }

    function goToMenu() {
        try{ window.unlockStageNext && window.unlockStageNext(2); }catch(e){}
        try{ localStorage.setItem('unlockedLevel', String(3)); }catch(e){}
        window.location.href = '../level-select.html';
    }

    function showSingleMessage(text, onConfirm) {
        messageText.innerText = text;
        messageOkBtn.innerText = "باشه";
        messageBox.style.display = 'block';
        const confirmHandler = () => {
            messageBox.style.display = 'none';
            if (onConfirm) onConfirm();
        };
        messageOkBtn.addEventListener('click', confirmHandler, { once: true });
    }

    function loadAssets(callback) {
        let loadedCount = 0;
        const totalAssets = Object.keys(assetPaths).length;
        if(totalAssets === 0) { callback(); return; }

        for (const key in assetPaths) {
            const path = assetPaths[key];
            if (key === 'video') {
                assets[key] = { src: path, complete: true, type: 'video' };
                loadedCount++;
                if (loadedCount === totalAssets) callback();
            } else {
                assets[key] = new Image();
                assets[key].onload = () => {
                    loadedCount++;
                    if (loadedCount === totalAssets) callback();
                };
                assets[key].onerror = () => {
                    loadedCount++;
                    if (loadedCount === totalAssets) callback();
                };
                assets[key].src = path;
            }
        }
    }

    document.getElementById('shoot-btn').addEventListener('click', () => {
        if (gamePaused) return;
        player.muzzleFlash = 5;
        bullets.push({
            x: player.x + player.width / 2 - 2.5, y: player.y,
            width: 5, height: 15, vy: -8
        });
    });

    const addTouchListeners = (btn, stateKey) => {
        btn.addEventListener('touchstart', e => { e.preventDefault(); keys[stateKey] = true; }, { passive: false });
        btn.addEventListener('touchend', e => { e.preventDefault(); keys[stateKey] = false; }, { passive: false });
    };
    addTouchListeners(document.getElementById('left-btn'), 'left');
    addTouchListeners(document.getElementById('right-btn'), 'right');

    dialogueNextBtn.addEventListener('click', showNextEndDialogue);
    videoPlayer.addEventListener('ended', goToMenu);

    window.onload = () => {
        loadAssets(() => {
            loadingScreen.style.display = 'none';
            uiContainer.style.display = 'block';
            controls.style.display = 'flex';
            resizeCanvas();
            showNextStoryMessage();
        });
    };
</script>
<script src="../scripts/video-playback-fix.js"></script>
<script>
    (function(){
        const vp = window.attachVideoHandlers({ videoSelector: '#video-player', overlaySelector: '#video-overlay', redirectTo: '../level-select.html', currentLevel: 2 });
        window.stageVideoHelper = vp;
        window.playStageVideo = function(src){ vp.playSrc(src); };
        window.freeStageVideo = function(){ vp.freeVideo && vp.freeVideo(); };
        window.unlockStageNext = function(current){ vp.unlockNext && vp.unlockNext(current); };
        window.getUnlockedLevel = function(){ return vp.getUnlocked ? vp.getUnlocked() : 1; };
    })();
</script>
</body>
