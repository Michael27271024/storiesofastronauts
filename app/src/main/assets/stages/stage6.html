<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مرحله ۶: مسیر خطرناک</title>
    <link rel="stylesheet" href="../styles/common.css">
    <style>
        @font-face {
            font-family: 'Vazirmatn';
            src: url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-Regular.woff2') format('woff2');
            font-weight: normal; font-style: normal;
        }
        body, html {
            margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%;
            background-color: #000; font-family: 'Vazirmatn', sans-serif; color: white;
        }
        .game-wrapper { position: relative; width: 100%; height: 100%; }
        canvas { display: block; background: #020418; width: 100%; height: 100%; }
        #loading-screen, #video-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000; z-index: 1000; display: flex;
            justify-content: center; align-items: center; text-align: center;
        }
        #loading-screen { font-size: 1.5rem; flex-direction: column; gap: 10px; }
        #video-overlay { z-index: 5000; }
        #video-player { width: 100%; height: 100%; object-fit: cover; }
        .loader {
            width: 50px; height: 50px; border: 5px solid #1a1a1a;
            border-top: 5px solid #00d9ff; border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .ui-container {
            position: absolute; top: 15px; left: 0; right: 0;
            display: flex; justify-content: space-between; padding: 0 15px;
            pointer-events: none; z-index: 100;
        }
        .ui-element {
            background: rgba(0, 25, 41, 0.7); border: 1px solid #00d9ff;
            padding: 8px 15px; border-radius: 8px; font-size: 1rem;
            box-shadow: 0 0 10px rgba(0, 217, 255, 0.3);
        }
        #progress-container {
            position: absolute; bottom: 150px; left: 50%; transform: translateX(-50%);
            width: 70%; height: 20px; background: rgba(0, 25, 41, 0.7);
            border: 1px solid #00d9ff; border-radius: 10px; z-index: 100; padding: 3px;
        }
        #progress-bar {
            width: 0%; height: 100%; background: linear-gradient(90deg, #00d9ff, #008cff);
            border-radius: 7px; transition: width 0.5s ease-out;
        }
        .dialogue-container, .message-box {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 85%; max-width: 500px; background: rgba(0, 15, 25, 0.9);
            border: 2px solid #00d9ff; border-radius: 15px; padding: 20px;
            box-sizing: border-box; text-align: center; z-index: 200; display: none;
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.5);
        }
        .dialogue-text { font-size: 1.1rem; line-height: 1.6; margin-bottom: 20px; }
        .dialogue-btn {
            padding: 10px 30px; font-size: 1rem; background-color: transparent;
            border: 2px solid #00d9ff; color: #00d9ff; border-radius: 8px; cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        .dialogue-btn:hover { background-color: #00d9ff; color: #000; }
        .controls-container {
            position: absolute; bottom: 15px; left: 15px; right: 15px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .joystick {
            width: 120px; height: 120px; position: relative;
            background: rgba(0, 25, 41, 0.5); border-radius: 50%; border: 1px solid #00d9ff;
        }
        #joystick-thumb {
            width: 50px; height: 50px; background: #008cff; border-radius: 50%;
            position: absolute; top: 35px; left: 35px; box-shadow: 0 0 10px #00d9ff;
        }
        #shoot-btn {
             width: 80px; height: 80px; background: rgba(255, 0, 0, 0.3);
             border: 2px solid #ff0000; border-radius: 50%;
             color: white; font-size: 24px; display: flex; justify-content: center; align-items: center;
        }
        #shoot-btn:active { background-color: rgba(255, 0, 0, 0.6); }
        @keyframes shake {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(-3px, 3px); }
            50% { transform: translate(3px, -3px); }
            75% { transform: translate(-3px, -3px); }
        }
        .shake { animation: shake 0.2s linear; }
    </style>
</head>
<body>
<div id="loading-screen">
    <div class="loader"></div>
    <p>در حال بارگذاری مرحله ۶...</p>
</div>
<div id="video-overlay" style="display:none;">
    <video id="video-player" playsinline></video>
</div>
<div class="game-wrapper" id="game-wrapper">
    <div class="ui-container">
        <div id="health-ui" class="ui-element">سلامتی: ❤️❤️❤️❤️❤️</div>
        <div id="score-ui" class="ui-element">امتیاز: ۰</div>
    </div>
    <div id="progress-container">
        <div id="progress-bar"></div>
    </div>
    <canvas id="gameCanvas"></canvas>
    <div class="dialogue-container" id="dialogue-box">
        <p id="dialogue-text" class="dialogue-text"></p>
        <button id="dialogue-next-btn" class="dialogue-btn">بعدی</button>
    </div>
    <div class="message-box" id="end-message-box">
        <p id="end-message-text" class="dialogue-text"></p>
        <button id="end-message-btn" class="dialogue-btn">ادامه</button>
    </div>
</div>
<div class="controls-container" id="controls">
    <button id="shoot-btn">&#x25CE;</button>
    <div class="joystick" id="joystick-container">
        <div id="joystick-thumb"></div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const gameWrapper = document.getElementById('game-wrapper');
    const loadingScreen = document.getElementById('loading-screen');
    const controls = document.getElementById('controls');
    const videoOverlay = document.getElementById('video-overlay');
    const videoPlayer = document.getElementById('video-player');

    let gamePaused = true;
    let gameState = 'LOADING';

    const healthUI = document.getElementById('health-ui');
    const scoreUI = document.getElementById('score-ui');
    const progressBar = document.getElementById('progress-bar');
    const dialogueBox = document.getElementById('dialogue-box');
    const dialogueText = document.getElementById('dialogue-text');
    const dialogueNextBtn = document.getElementById('dialogue-next-btn');
    const endMessageBox = document.getElementById('end-message-box');
    const endMessageText = document.getElementById('end-message-text');
    const endMessageBtn = document.getElementById('end-message-btn');

    const player = {
        x: 100, y: 0, width: 80, height: 60, speed: 4, health: 5, maxHealth: 5,
        dx: 0, dy: 0, invincibleTimer: 0, shootCooldown: 0
    };

    let stars = [], asteroids = [], enemies = [], bullets = [], enemyBullets = [], particles = [];
    let score = 0;
    const journeyLength = 8000;
    let journeyProgress = 0;

    const assets = {};
    const assetPaths = {
        'player_rocket': '../images/alien_ship2.png',
        'enemy_ship': '../images/alien_ship.png',
        'space_station': '../images/space_station.png',
        'win_video': '../videos/saturn_to_jupiter.mp4'
    };

    let storyIndex = 0;
    const storyScript = [
        "بعد از موفقیت در زحل، تیم فضانوردان ایرانی هدف بعدی خود را مشخص کردند: سیاره مشتری!",
        "اما یک خبر نگران‌کننده به آن‌ها رسید: آژانس جهانی فضا و آسمان ایران از ماموریت آن‌ها باخبر شده و قصد دارد قبل از آن‌ها به مشتری برسد.",
        "فضانوردان ما که از این موضوع بی‌خبر بودند، تصمیم گرفتند ابتدا بشر حاوی خاک زحل را به ایستگاه فضایی بین‌راهی تحویل دهند.",
        "اما مسیر ساده نخواهد بود. گزارش‌ها حاکی از وجود میدان شهاب‌سنگ‌های خطرناک و گشت‌زنی سفینه‌های ناشناس در این مسیر است...",
        "آماده شو! باید سفینه را به سلامت از این مسیر عبور دهی. مراقب باش!"
    ];

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        player.y = canvas.height / 2;
    }

    function showDialogue() {
        gamePaused = true;
        if (storyIndex >= storyScript.length) {
            dialogueBox.style.display = 'none';
            startGame();
            return;
        }
        dialogueText.innerText = storyScript[storyIndex];
        dialogueBox.style.display = 'block';
        if (storyIndex === storyScript.length - 1) {
            dialogueNextBtn.innerText = "شروع ماموریت";
        }
        storyIndex++;
    }

    function startGame() {
        gameState = 'PLAYING';
        gamePaused = false;
        requestAnimationFrame(gameLoop);
    }

    function createParticle(x, y, color, count) {
        for (let i = 0; i < count; i++) {
            particles.push({
                x: x, y: y,
                vx: (Math.random() - 0.5) * 4, vy: (Math.random() - 0.5) * 4,
                life: Math.random() * 30 + 20,
                color: color, size: Math.random() * 3 + 1
            });
        }
    }

    function playerHit() {
        if (player.invincibleTimer > 0) return;
        player.health--;
        player.invincibleTimer = 120;
        gameWrapper.classList.add('shake');
        setTimeout(() => gameWrapper.classList.remove('shake'), 200);
        createParticle(player.x + player.width / 2, player.y + player.height / 2, '#ff6a00', 30);
        updateHealthUI();
        if (player.health <= 0) gameOver();
    }

    function updateHealthUI() {
        healthUI.innerHTML = `سلامتی: ${'❤️'.repeat(player.health)}${'🖤'.repeat(player.maxHealth - player.health)}`;
    }

    function gameOver() {
        gameState = 'GAMEOVER';
        gamePaused = true;
        endMessageText.innerText = "ماموریت شکست خورد! سفینه نابود شد. دوباره تلاش کن.";
        endMessageBtn.innerText = "تلاش مجدد";
        endMessageBox.style.display = 'block';
    }

    function winGame() {
        gameState = 'WIN';
        gamePaused = true;
        endMessageText.innerText = "موفق شدی! بشر به ایستگاه فضایی تحویل داده شد. اکنون، به سوی مشتری!";
        endMessageBtn.innerText = "پایان مرحله";
        endMessageBox.style.display = 'block';
    }

    function gameLoop() {
        if (gameState !== 'PLAYING' || gamePaused) {
             if(gameState !== 'LOADING') draw();
             requestAnimationFrame(gameLoop);
             return;
        }
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    function update() {
        player.x += player.dx;
        player.y += player.dy;

        if (player.x < 0) player.x = 0;
        if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;
        if (player.y < 0) player.y = 0;
        if (player.y + player.height > canvas.height) player.y = canvas.height - player.height;

        if (player.invincibleTimer > 0) player.invincibleTimer--;
        if (player.shootCooldown > 0) player.shootCooldown--;

        journeyProgress += player.speed / 2;
        progressBar.style.width = `${(journeyProgress / journeyLength) * 100}%`;
        if (journeyProgress >= journeyLength) winGame();

        if (Math.random() < 0.02) {
            asteroids.push({
                x: canvas.width, y: Math.random() * canvas.height,
                size: Math.random() * 30 + 20,
                speed: Math.random() * 2 + 1,
                angle: 0, rotationSpeed: (Math.random() - 0.5) * 0.05,
                shapePoints: Array.from({length: Math.floor(Math.random() * 5) + 5}, () => ({
                    angle: Math.random() * Math.PI * 2,
                    radius: Math.random() * 0.4 + 0.8
                }))
            });
        }
        if (Math.random() < 0.01) {
             enemies.push({
                x: canvas.width, y: Math.random() * canvas.height,
                width: 60, height: 40,
                speed: Math.random() * 1.5 + 1.5,
                shootCooldown: 120,
                amplitude: Math.random() * 100 + 50,
                frequency: Math.random() * 0.02 + 0.01,
                startY: Math.random() * (canvas.height - 100)
            });
        }

        stars.forEach(star => {
            star.x -= star.speed;
            if (star.x < 0) {
                star.x = canvas.width;
                star.y = Math.random() * canvas.height;
            }
        });

        particles.forEach((p, index) => {
            p.x += p.vx; p.y += p.vy;
            p.life--;
            if (p.life <= 0) particles.splice(index, 1);
        });

        asteroids.forEach((a, index) => {
            a.x -= a.speed;
            a.angle += a.rotationSpeed;
            if (a.x + a.size < 0) asteroids.splice(index, 1);
            if (player.x < a.x + a.size && player.x + player.width > a.x - a.size &&
                player.y < a.y + a.size && player.y + player.height > a.y - a.size) {
                playerHit();
                createParticle(a.x, a.y, '#8B4513', 20);
                asteroids.splice(index, 1);
            }
        });

        enemies.forEach((e, index) => {
            e.x -= e.speed;
            e.y = e.startY + Math.sin(e.x * e.frequency) * e.amplitude;

            if (e.x + e.width < 0) enemies.splice(index, 1);
            if (e.shootCooldown > 0) e.shootCooldown--;
            else {
                enemyBullets.push({
                    x: e.x, y: e.y + e.height / 2, width: 10, height: 4, speed: 5
                });
                e.shootCooldown = 120;
            }
            if (player.x < e.x + e.width && player.x + player.width > e.x && player.y < e.y + e.height && player.y + player.height > e.y) {
                playerHit();
                createParticle(e.x + e.width / 2, e.y + e.height / 2, '#ff0000', 40);
                enemies.splice(index, 1);
            }
        });

        bullets.forEach((b, bIndex) => {
            b.x += b.speed;
            if (b.x > canvas.width) { bullets.splice(bIndex, 1); return; }
            asteroids.forEach((a, aIndex) => {
                if(b && a && b.x < a.x + a.size && b.x + b.width > a.x - a.size &&
                    b.y < a.y + a.size && b.y + b.height > a.y - a.size) {
                    if(bullets.includes(b)) bullets.splice(bullets.indexOf(b), 1);
                    if(asteroids.includes(a)) asteroids.splice(asteroids.indexOf(a), 1);
                    score += 10;
                    createParticle(a.x, a.y, '#8B4513', 15);
                }
            });
            enemies.forEach((e, eIndex) => {
                if (b && e && b.x < e.x + e.width && b.x + b.width > e.x && b.y < e.y + e.height && b.y + e.height > e.y) {
                    if(bullets.includes(b)) bullets.splice(bullets.indexOf(b), 1);
                    if(enemies.includes(e)) enemies.splice(enemies.indexOf(e), 1);
                    score += 50;
                    createParticle(e.x + e.width / 2, e.y + e.height / 2, '#ff0000', 30);
                }
            });
        });

        enemyBullets.forEach((b, bIndex) => {
            b.x -= b.speed;
            if (b.x < 0) { enemyBullets.splice(bIndex, 1); return; }
            if (player.x < b.x + b.width && player.x + player.width > b.x && player.y < b.y + b.height && player.y + b.height > b.y) {
                playerHit();
                enemyBullets.splice(bIndex, 1);
            }
        });

        scoreUI.innerText = `امتیاز: ${score}`;
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        stars.forEach(star => {
            ctx.fillStyle = `rgba(255, 255, 255, ${star.opacity})`;
            ctx.fillRect(star.x, star.y, star.size, star.size);
        });

        if (assets.space_station && assets.space_station.complete) {
            const progressRatio = journeyProgress / journeyLength;
            if (progressRatio > 0.8) {
                const stationSize = 200;
                const finalPos = canvas.width - stationSize - 20;
                const startPos = canvas.width;
                const currentX = startPos + ((finalPos - startPos) * ((progressRatio - 0.8) / 0.2));
                ctx.drawImage(assets.space_station, currentX, canvas.height / 2 - stationSize / 2, stationSize, stationSize);
            }
        }

        if (player.invincibleTimer > 0 && Math.floor(player.invincibleTimer / 6) % 2 === 0) {
            ctx.globalAlpha = 0.5;
        }
        if (assets.player_rocket && assets.player_rocket.complete) {
             ctx.drawImage(assets.player_rocket, player.x, player.y, player.width, player.height);
             createParticle(player.x, player.y + player.height / 2, '#ff6a00', 1);
        } else {
             ctx.fillStyle = '#00d9ff';
             ctx.fillRect(player.x, player.y, player.width, player.height);
        }
        ctx.globalAlpha = 1.0;

        asteroids.forEach(a => {
            ctx.save();
            ctx.translate(a.x, a.y);
            ctx.rotate(a.angle);
            ctx.beginPath();
            ctx.moveTo(a.size * a.shapePoints[0].radius, 0);
            a.shapePoints.forEach(p => {
                ctx.lineTo(Math.cos(p.angle) * a.size * p.radius, Math.sin(p.angle) * a.size * p.radius);
            });
            ctx.closePath();
            ctx.fillStyle = '#795548';
            ctx.fill();
            ctx.strokeStyle = '#5D4037';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.restore();
        });

        enemies.forEach(e => {
            if (assets.enemy_ship && assets.enemy_ship.complete) {
                ctx.drawImage(assets.enemy_ship, e.x, e.y, e.width, e.height);
            } else {
                ctx.fillStyle = 'purple';
                ctx.fillRect(e.x, e.y, e.width, e.height);
            }
        });

        ctx.fillStyle = '#33c6ff';
        bullets.forEach(b => ctx.fillRect(b.x, b.y, b.width, b.height));
        ctx.fillStyle = '#ff3333';
        enemyBullets.forEach(b => ctx.fillRect(b.x, b.y, b.width, b.height));

        particles.forEach(p => {
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life / 30;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1.0;
        });
    }

    function init() {
        loadingScreen.style.display = 'none';
        gameWrapper.style.display = 'block';
        controls.style.display = 'flex';
        resizeCanvas();
        player.y = canvas.height / 2 - player.height / 2;
        for (let i = 0; i < 150; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2 + 1,
                speed: Math.random() * 1 + 0.5,
                opacity: Math.random() * 0.5 + 0.3
            });
        }
        updateHealthUI();
        showDialogue();
    }

    function loadAssets(callback) {
        let loadedCount = 0;
        const totalAssets = Object.keys(assetPaths).length;
        if (totalAssets === 0) { callback(); return; }
        for (const key in assetPaths) {
            const path = assetPaths[key];
            if (assetPaths[key].endsWith('.mp4')) {
                assets[key] = { src: path };
                loadedCount++;
                if (loadedCount === totalAssets) callback();
            } else {
                assets[key] = new Image();
                assets[key].onload = () => {
                    loadedCount++;
                    if (loadedCount === totalAssets) callback();
                };
                assets[key].onerror = () => {
                    loadedCount++;
                    if (loadedCount === totalAssets) callback();
                };
                assets[key].src = path;
            }
        }
    }

    dialogueNextBtn.addEventListener('click', showDialogue);
    endMessageBtn.addEventListener('click', () => {
        if (gameState === 'WIN') {
            gameWrapper.style.display = 'none';
            controls.style.display = 'none';
            endMessageBox.style.display = 'none';
            videoOverlay.style.display = 'flex';
            if (window.playStageVideo) {
                try { window.playStageVideo(assets.win_video.src); } catch(e) { videoPlayer.src = assets.win_video.src; videoPlayer.play(); }
            } else {
                videoPlayer.src = assets.win_video.src;
                videoPlayer.play();
            }
        } else {
            window.location.reload();
        }
    });

    videoPlayer.addEventListener('ended', () => {
        try{ window.unlockStageNext && window.unlockStageNext(6); }catch(e){}
        window.location.href = '../level-select.html';
    });

    const joystickContainer = document.getElementById('joystick-container');
    const joystickThumb = document.getElementById('joystick-thumb');
    let joystickActive = false;
    let joystickStartX = 0, joystickStartY = 0;
    let joystickRadius = 60;

    joystickContainer.addEventListener('touchstart', (e) => {
        e.preventDefault();
        joystickRadius = joystickContainer.offsetWidth / 2;
        joystickActive = true;
        const touch = e.touches[0];
        const rect = joystickContainer.getBoundingClientRect();
        joystickStartX = rect.left + joystickRadius;
        joystickStartY = rect.top + joystickRadius;
    }, { passive: false });

    joystickContainer.addEventListener('touchmove', (e) => {
        e.preventDefault();
        if (!joystickActive) return;
        const touch = e.touches[0];
        let dx = touch.clientX - joystickStartX;
        let dy = touch.clientY - joystickStartY;
        const distance = Math.sqrt(dx * dx + dy * dy);

        let finalDx = dx, finalDy = dy;
        if (distance > joystickRadius) {
            finalDx = (dx / distance) * joystickRadius;
            finalDy = (dy / distance) * joystickRadius;
        }

        joystickThumb.style.transform = `translate(${finalDx}px, ${finalDy}px)`;
        player.dx = (dx / joystickRadius) * player.speed;
        player.dy = (dy / joystickRadius) * player.speed;

    }, { passive: false });

    joystickContainer.addEventListener('touchend', (e) => {
        e.preventDefault();
        joystickActive = false;
        joystickThumb.style.transform = 'translate(0px, 0px)';
        player.dx = 0;
        player.dy = 0;
    }, { passive: false });

    document.getElementById('shoot-btn').addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (player.shootCooldown <= 0 && !gamePaused) {
            bullets.push({
                x: player.x + player.width,
                y: player.y + player.height / 2 - 2,
                width: 15, height: 4, speed: 8
            });
            player.shootCooldown = 20;
        }
    }, { passive: false });

    window.addEventListener('resize', resizeCanvas);
    window.onload = () => loadAssets(init);
</script>

<script src="../scripts/video-playback-fix.js"></script>
<script>
    (function(){
        const vp = window.attachVideoHandlers({ videoSelector: '#video-player', overlaySelector: '#video-overlay', redirectTo: '../level-select.html' });
        window.stageVideoHelper = vp;
        window.playStageVideo = function(src){ vp.playSrc(src); };
        window.freeStageVideo = function(){ vp.freeVideo && vp.freeVideo(); };
        window.unlockStageNext = function(current){ vp.unlockNext && vp.unlockNext(current); };
        window.getUnlockedLevel = function(){ return vp.getUnlocked ? vp.getUnlocked() : 1; };
    })();
</script>
<script src="../scripts/common.js"></script>
</body>
