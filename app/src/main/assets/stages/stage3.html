<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مرحله ۳: سیاره سرخ</title>
    <link rel="stylesheet" href="../styles/common.css">
    <style>
        @font-face {
            font-family: 'Vazirmatn';
            src: url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-Regular.woff2') format('woff2');
            font-weight: normal; font-style: normal;
        }
        body, html {
            margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%;
            background-color: #000; font-family: 'Vazirmatn', sans-serif; color: white;
        }
        .scene-wrapper {
            width: 100%; height: 100%;
            background-size: cover; background-position: center;
            display: flex; justify-content: center; align-items: flex-end;
            transition: background-image 1s ease-in-out;
        }
        #loading-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000; z-index: 1000; display: flex;
            justify-content: center; align-items: center; text-align: center;
            font-size: 1.5rem;
        }
        .dialogue-container {
            position: absolute; bottom: 20px; left: 20px; right: 20px;
            background: rgba(0, 0, 0, 0.8); border: 2px solid #ff4500;
            border-radius: 15px; padding: 15px; box-sizing: border-box; text-align: center;
            animation: slideUp 0.5s ease-out;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .dialogue-text { font-size: 1.1rem; line-height: 1.6; margin-bottom: 15px; }
        .next-btn {
            padding: 10px 30px; font-size: 1.1rem; background-color: transparent;
            border: 2px solid #ff4500; color: #ff4500; border-radius: 10px; cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        .next-btn:hover { background-color: #ff4500; color: black; }
        .scene-image { max-width: 200px; max-height: 150px; margin-bottom: 15px; animation: fadeIn 1s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
<div id="loading-screen">در حال بارگذاری مرحله ۳...</div>
<div id="scene" class="scene-wrapper">
    <div id="dialogue-box" class="dialogue-container">
        <img id="scene-img" class="scene-image">
        <p id="dialogue-text" class="dialogue-text"></p>
        <button id="next-button" class="next-btn">بعدی</button>
    </div>
</div>
<div id="video-overlay" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:4000;display:none;justify-content:center;align-items:center;">
    <video id="video-player" playsinline style="width:100%;height:100%;object-fit:cover;"></video>
</div>

<script>
    const scene = document.getElementById('scene');
    const dialogueBox = document.getElementById('dialogue-box');
    const dialogueText = document.getElementById('dialogue-text');
    const nextButton = document.getElementById('next-button');
    const sceneImg = document.getElementById('scene-img');
    const loadingScreen = document.getElementById('loading-screen');
    const videoOverlay = document.getElementById('video-overlay');
    const videoPlayer = document.getElementById('video-player');

    const assets = {};
    const assetPaths = {
        'mars_bg': '../images/backgrounds/mars_background.png',
        'base_bg': '../images/alien_base.png',
        'flag': '../images/starspawn_flag.png'
    };

    let storyIndex = 0;
    const storyScript = [
        { text: "پس از شکست ارتش محافظان ماه، رئیس آن‌ها مجبور شد با دشمن قدیمی خود، ارتش ستارگان، متحد شود." },
        { text: "این دو ارتش با هم متحد شدند و نام خود را «ارتش ستاره‌زادگان» گذاشتند تا شما را نابود کنند.", image: 'flag' },
        { text: "در همین حال، شما با موفقیت از ماه به سیاره مریخ سفر کردید.", background: 'mars_bg' },
        { text: "به محض رسیدن، با یک پایگاه عظیم و ترسناک مواجه شدید که پر از سربازان دشمن بود.", background: 'base_bg' },
        { text: "تصمیم گرفتید به پایگاه حمله کنید، اما قبل از آن باید با قوانین این سیاره و فضا بیشتر آشنا می‌شدید." },
        { text: "شما متوجه یک قانون حیاتی شدید: زمان در فضا سریع‌تر می‌گذرد!", style: 'important' },
        { text: "برای اینکه بتوانید به زمین برگردید، باید کل ماموریت خود را در کمتر از ۱۲۰ دقیقه زمینی به پایان برسانید!", style: 'important' },
        { text: "این مرحله به پایان رسید. در مراحل بعد، نبرد برای تسخیر پایگاه آغاز خواهد شد..." }
    ];

    function playTransitionVideo(videoSrc) {
        try {
            window.shouldAutoExitOnVideoEnd = true;
            if (videoOverlay) videoOverlay.style.display = 'flex';
            if (window.playStageVideo) {
                window.playStageVideo(videoSrc);
            } else if (videoPlayer) {
                videoPlayer.src = videoSrc;
                videoPlayer.play();
            }
        } catch (e) {
            console.warn(e);
            window.location.href = '../level-select.html';
        }
    }

    function showNextScene() {
        if (storyIndex >= storyScript.length) {
            try{ window.unlockStageNext && window.unlockStageNext(3); }catch(e){}
            try {
                const cur = 3;
                const key = 'unlockedLevel';
                const existing = parseInt(localStorage.getItem(key) || '1', 10) || 1;
                const next = Math.max(existing, cur + 1);
                localStorage.setItem(key, String(next));
            } catch (e) {}
            playTransitionVideo('../videos/mars_to_saturn.mp4');
            return;
        }

        const currentScene = storyScript[storyIndex];

        if (currentScene.background && assets[currentScene.background]) {
            scene.style.backgroundImage = `url(${assets[currentScene.background].src})`;
        }

        if (currentScene.image && assets[currentScene.image]) {
            sceneImg.src = assets[currentScene.image].src;
            sceneImg.style.display = 'block';
        } else {
            sceneImg.style.display = 'none';
        }

        dialogueText.textContent = currentScene.text;
        dialogueText.style.color = currentScene.style === 'important' ? '#ff4500' : 'white';

        if (storyIndex === storyScript.length - 1) {
            nextButton.textContent = "پایان مرحله";
        }

        storyIndex++;
    }

    function loadAssetsAndStart() {
        let loadedCount = 0;
        const totalAssets = Object.keys(assetPaths).length;
        if (totalAssets === 0) {
            init();
            return;
        }
        for (const key in assetPaths) {
            const path = assetPaths[key];
            assets[key] = new Image();
            assets[key].onload = () => {
                loadedCount++;
                if (loadedCount === totalAssets) init();
            };
            assets[key].onerror = () => {
                loadedCount++;
                if (loadedCount === totalAssets) init();
            };
            assets[key].src = path;
        }
    }

    function init() {
        loadingScreen.style.display = 'none';
        dialogueBox.style.display = 'block';
        if(assets.mars_bg) scene.style.backgroundImage = `url(${assets.mars_bg.src})`;
        showNextScene();
    }

    nextButton.addEventListener('click', showNextScene);
    window.onload = loadAssetsAndStart;
</script>

<script src="../scripts/video-playback-fix.js"></script>
<script>
    (function(){
        const vp = window.attachVideoHandlers({ videoSelector: '#video-player', overlaySelector: '#video-overlay', redirectTo: '../level-select.html' });
        window.stageVideoHelper = vp;
        window.playStageVideo = function(src){ vp.playSrc(src); };
        window.freeStageVideo = function(){ vp.freeVideo && vp.freeVideo(); };
        window.unlockStageNext = function(current){ vp.unlockNext && vp.unlockNext(current); };
        window.getUnlockedLevel = function(){ return vp.getUnlocked ? vp.getUnlocked() : 1; };
    })();
</script>
<script src="../scripts/common.js"></script>
</body>
</html>
