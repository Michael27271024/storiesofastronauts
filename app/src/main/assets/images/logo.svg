<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Astronaut Stories Logo -->
  <defs>
    <linearGradient id="logogradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Rocket -->
  <g filter="url(#glow)">
    <!-- Rocket body -->
    <rect x="75" y="15" width="50" height="70" rx="8" fill="url(#logogradient)" stroke="#00ffff" stroke-width="2"/>
    
    <!-- Rocket window -->
    <circle cx="100" cy="30" r="8" fill="#333" stroke="#ffff00" stroke-width="1"/>
    
    <!-- Rocket flames -->
    <polygon points="85,85 100,100 115,85" fill="#ff6b6b" stroke="#ff0000" stroke-width="1"/>
    <polygon points="90,85 100,95 110,85" fill="#ffaa00" stroke="#ff6600" stroke-width="1"/>
    
    <!-- Rocket fins -->
    <polygon points="75,65 70,75 75,80" fill="#00ff88" stroke="#00ff88" stroke-width="1"/>
    <polygon points="125,65 130,75 125,80" fill="#00ff88" stroke="#00ff88" stroke-width="1"/>
  </g>
  
  <!-- Stars around -->
  <circle cx="30" cy="20" r="2" fill="#ffff00" opacity="0.8"/>
  <circle cx="40" cy="10" r="1.5" fill="#ffff00" opacity="0.6"/>
  <circle cx="160" cy="25" r="2" fill="#ffff00" opacity="0.8"/>
  <circle cx="175" cy="35" r="1.5" fill="#ffff00" opacity="0.6"/>
  <circle cx="35" cy="70" r="1.5" fill="#00ffff" opacity="0.6"/>
  <circle cx="170" cy="65" r="2" fill="#00ffff" opacity="0.8"/>
  
  <!-- Glow effect -->
  <circle cx="100" cy="50" r="65" fill="none" stroke="#00ffff" stroke-width="0.5" opacity="0.3"/>
</svg>
